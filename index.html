 switch(act){case 'login':openAdminLogin();break;case 'logout':logoutAdmin();break;case 'refresh-public':refreshPublicState();break;case 'go-create-event':navigateCreateEvent();break;case 'go-events':setView('events');break;case 'go-rankings':setView('rankings');break;case 'go-promo':setView('promo');break;case 'go-applications':setView('applications');break;case 'go-promo-for-event':promoEventId=id;promoText=promoContent(eventById(id));setView('promo');break;case 'open-event':selectedEventId=id;setView('events');break;case 'new-fighter':openFighterEditor(null);break;case 'edit-fighter':openFighterEditor(id);break;case 'delete-fighter':deleteFighter(id);break;case 'delete-event':deleteEvent(id);break;case 'simulate-pending':simulateEvent(id,false);break;case 'resimulate-all':simulateEvent(id,true);break;case 'edit-fight':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editFightModal(e,f);break;}case 'edit-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editResultModal(e,f);break;}case 'clear-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f&&confirm('Limpar o resultado desta luta? Cartel, ranking e cinturão serão recalculados.')){f.result=null;saveState();render();toast('Resultado removido.');}break;}case 'delete-fight':{const e=eventById(eid);if(e&&confirm('Excluir esta luta do card? O resultado deixa de contar no ranking.')){e.fights=e.fights.filter(x=>x.id!==fid);saveState();render();toast('Luta removida e ranking recalculado.');}break;}case 'generate-more-fights':{const e=eventById(id);if(e)addFightsToCount(e,6);break;}case 'close-modal':closeModal();break;case 'copy-fight-report':copyFightReport(eid,fid);break;case 'copy-promo':copyPromo();break;case 'download-promo':downloadPromo();break;case 'refresh-promo':refreshPromo();break;case 'print-promo':printPromo();break;case 'export-json':exportJSON();break;case 'trigger-import':$('importFile').click();break;case 'recalculate':{const c=recalculate();saveState();render();toast(`Recalculado: ${Object.keys(c.records).length} atletas avaliados.`);break;}case 'restore-seed':mergeSeedRoster();break;case 'clear-season':clearSeason();break;case 'reset-all':resetAll();break;case 'approve-application':approveApplication(id);break;case 'reject-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm(`Marcar a ficha de ${app.first} como recusada?`)){app.status='rejected';updateApplicationRemote(app).then(()=>{render();toast('Inscrição marcada como recusada.');});}break;}case 'delete-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm('Excluir permanentemente esta ficha de inscrição?')){deleteApplicationRemote(id).then(()=>{state.applications=state.applications.filter(a=>a.id!==id);render();toast('Ficha removida.');}).catch(err=>{console.error(err);toast('Não foi possível excluir a ficha no servidor.');});}break;}case 'create-empty-event':createEmptyFromInputs();break;}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}const btn=e.target.closest('[data-action]');if(btn){actionClick(btn);return;}if(e.target===$('modalBackdrop'))closeModal();});
document.addEventListener('submit',e=>{if(e.target.id==='adminLoginForm'){e.preventDefault();loginAdmin(e.target);return;}if(e.target.id==='applicationForm'){e.preventDefault();handleCreateApplication(e.target);return;}if(!isAdmin&&['createEventForm','editEventForm','fighterEditorForm','fightEditorForm','resultEditorForm','addFightForm'].includes(e.target.id)){e.preventDefault();toast('Entre como administrador para alterar a liga.');return;}if(e.target.id==='createEventForm'){e.preventDefault();createEventFromForm(e.target,true);}else if(e.target.id==='editEventForm'){e.preventDefault();saveEventEdit(e.target);}else if(e.target.id==='fighterEditorForm'){e.preventDefault();saveFighterForm(e.target);}else if(e.target.id==='fightEditorForm'){e.preventDefault();saveFightEditor(e.target);}else if(e.target.id==='resultEditorForm'){e.preventDefault();saveResultEditor(e.target);}else if(e.target.id==='addFightForm'){e.preventDefault();addManualFight(e.target);}});
document.addEventListener('input',e=>{if(e.target.id==='fighterSearch'){fighterSearch=e.target.value;const pos=e.target.selectionStart;render();const next=$('fighterSearch');if(next){next.focus();next.setSelectionRange(pos,pos);}}else if(e.target.id==='promoText'){promoText=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.id==='fighterDivision'){fighterDivision=e.target.value;render();}else if(e.target.id==='rankDivision'){rankDivision=e.target.value;render();}else if(e.target.id==='promoEventSelect'){promoEventId=e.target.value;promoText=promoContent(eventById(promoEventId));render();}else if(e.target.id==='addFightDivision'){refreshAddFightFighters();}else if(e.target.id==='newEventType'){const isNumbered=e.target.value==='numbered';const title=$('newTitleCount');if(title){title.disabled=!isNumbered;if(!isNumbered)title.value='0';else if(title.value==='0')title.value='1';}const warn=$('typeWarning');if(warn)warn.textContent=isNumbered?'Evento numerado: a ACL pode selecionar até duas disputas de cinturão; não é necessário colocar todos os títulos em jogo.':'Fight Night: nenhum cinturão pode ser colocado em jogo. O evento numerado é o formato para disputas de título.';}});
$('importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(file&&confirm('Importar este backup vai substituir os dados atuais deste navegador. Exporte o estado atual antes se quiser preservá-lo. Continuar?'))importJSONFile(file);e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
// Normaliza elencos importados e inicia o modo público/administrador após verificar a sessão.
function normalizeState(){state.events.forEach(e=>{e.fights=e.fights||[];if(!e.type)e.type='fightnight';if(e.type==='fightnight')e.fights.forEach(f=>{if(f.title){f.title=false;f.rounds=3;}});});if(!state.counters)state.counters={numbered:0,fightnight:0,totalCreated:state.events.length};if(typeof state.counters.totalCreated!=='number')state.counters.totalCreated=state.events.length;}
normalizeState();initializeApp();
})();
</script>
</body>
