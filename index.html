async function loadSharedState({bootstrap=false}={}){if(!supabaseClient){state=loadState();return;}const {data,error}=await supabaseClient.from('acl_state').select('payload').eq('id',1).maybeSingle();if(error)throw error;cloudStateExists=!!data?.payload;if(data?.payload){const payload=data.payload;state={...makeSeed(),...payload,applications:[]};state.fighters=Array.isArray(payload.fighters)?payload.fighters:makeSeed().fighters;state.events=Array.isArray(payload.events)?payload.events:[];state.initialChampions=payload.initialChampions||{};state.counters=payload.counters||{numbered:0,fightnight:0,totalCreated:state.events.length};normalizeState();if(isAdmin)await loadApplicationsFromCloud();else state.applications=[];cloudLoaded=true;backfillFightReports();if(isAdmin)saveState();return;}

function syncPublicLivePolling(){
 const shouldPoll=SUPABASE_CONFIGURED&&!!supabaseClient&&!isAdmin;
 const shouldPollNews=shouldPoll&&activeView==='newsroom';
 if(!shouldPoll){
  if(publicLivePoller){clearInterval(publicLivePoller);publicLivePoller=null;}
  if(publicLiveUiTicker){clearInterval(publicLiveUiTicker);publicLiveUiTicker=null;}
  if(newsroomPoller){clearInterval(newsroomPoller);newsroomPoller=null;}
  return;
 }
 if(!publicLivePoller)publicLivePoller=setInterval(()=>{if(!document.hidden)refreshPublicSharedStateSilently().catch(err=>console.warn('ACL public sync fallback failed',err));},1800);
 if(shouldPollNews&&!newsroomPoller)newsroomPoller=setInterval(()=>{if(!document.hidden&&activeView==='newsroom')loadMediaItems(true).then(()=>{if(activeView==='newsroom')render();}).catch(()=>{});},15000);
 if(!shouldPollNews&&newsroomPoller){clearInterval(newsroomPoller);newsroomPoller=null;}
 if(!publicLiveUiTicker)publicLiveUiTicker=setInterval(()=>{
  const live=state.liveSimulation;
  if(live&&live.status==='running'&&activeView==='events')updateLiveClock(live,Math.floor(liveElapsedMs(live)/1000));
 },200);
}
function notifyACLClients(){
 if(!supabaseClient||!liveBroadcastChannel||!liveBroadcastReady)return;
 try{liveBroadcastChannel.send({type:'broadcast',event:'acl-state-changed',payload:{at:Date.now()}}).catch(err=>console.debug('ACL broadcast fallback polling',err));}catch(err){console.debug('ACL broadcast unavailable',err);}
}
function setupACLClientBroadcast(){
 if(!supabaseClient||liveBroadcastChannel)return;
 try{
  liveBroadcastChannel=supabaseClient.channel('acl-live-public-sync',{config:{broadcast:{self:false}}});
  liveBroadcastChannel.on('broadcast',{event:'acl-state-changed'},()=>{
   if(!isAdmin)refreshPublicSharedStateSilently().catch(err=>console.warn('ACL live push could not refresh',err));
  });
  liveBroadcastChannel.subscribe(status=>{liveBroadcastReady=status==='SUBSCRIBED';if(liveBroadcastReady&&!isAdmin)refreshPublicSharedStateSilently().catch(()=>{});});
 }catch(err){console.warn('ACL realtime channel unavailable; use polling fallback',err);liveBroadcastReady=false;}
}
async function refreshPublicSharedStateSilently(){
 if(!supabaseClient||!SUPABASE_CONFIGURED||isAdmin||publicLivePollBusy)return;
 publicLivePollBusy=true;
 try{
  const {data,error}=await supabaseClient.from('acl_state').select('payload').eq('id',1).maybeSingle();
  if(error)throw error;
  if(!data?.payload)return;
  const oldLive=state.liveSimulation?{...state.liveSimulation,beats:[...(state.liveSimulation.beats||[])]}:null;
  const oldRun=state.eventTransmission?{...state.eventTransmission}:null;
  const oldResultSig=state.events.map(e=>`${e.id}:${eventResultsCount(e)}`).join('|');
  const payload=data.payload;
  state={...state,...payload,applications:[]};
  state.fighters=Array.isArray(payload.fighters)?payload.fighters:[];
  state.events=Array.isArray(payload.events)?payload.events:[];
  state.initialChampions=payload.initialChampions||{};
  state.counters=payload.counters||{numbered:0,fightnight:0,totalCreated:state.events.length};
  state.liveSimulation=payload.liveSimulation||null;
  state.eventTransmission=payload.eventTransmission||null;
  cloudStateExists=true;cloudLoaded=true;
  const nextLive=state.liveSimulation;
  const nextRun=state.eventTransmission;
  const activeEventId=nextLive&&['running','paused'].includes(nextLive.status)?nextLive.eventId:(nextRun&&['running','intermission'].includes(nextRun.status)?nextRun.eventId:null);
  // Public live sync must never change the page the visitor intentionally opened.
  if(activeEventId&&activeView==='events'&&String(selectedEventId)!==String(activeEventId))selectedEventId=activeEventId;
  const newResultSig=state.events.map(e=>`${e.id}:${eventResultsCount(e)}`).join('|');
  const changedLive=String(oldLive?.id||'')!==String(nextLive?.id||'')||String(oldLive?.status||'')!==String(nextLive?.status||'');
  const changedRun=String(oldRun?.id||'')!==String(nextRun?.id||'')||String(oldRun?.status||'')!==String(nextRun?.status||'')||String(oldRun?.currentFightId||'')!==String(nextRun?.currentFightId||'');
  if(activeView==='events'&&(changedLive||changedRun||oldResultSig!==newResultSig)){
   render();
   const stage=$('liveStage');if(stage&&nextLive?.beats?.length)applyLiveMove(stage,nextLive.beats[nextLive.beats.length-1]?.move||'idle',nextLive);
   return;
  }
  if(activeView==='events'&&nextLive&&nextLive.status==='running'&&oldLive&&String(oldLive.id)===String(nextLive.id)){
   const oldCount=(oldLive.beats||[]).length;const beats=nextLive.beats||[];const feed=$('liveNarrationFeed');
   if(feed&&beats.length>oldCount){for(const beat of beats.slice(oldCount)){const wrap=document.createElement('div');wrap.innerHTML=liveBeatHTML(beat);const node=wrap.firstElementChild;if(node)feed.appendChild(node);const stage=$('liveStage');if(stage)applyLiveMove(stage,beat.move||'idle',nextLive);}feed.scrollTop=feed.scrollHeight;}
   updateLiveClock(nextLive,Math.floor(liveElapsedMs(nextLive)/1000));
  }
 }finally{publicLivePollBusy=false;}
}

trong style="color:${winner?'var(--green)':'var(--orange2)'}">${winner?esc(nameWithNick(winner))+' venceu':'Empate'}</strong> · ${esc(r.method||'Resultado manual')}${r.round?' · Round '+r.round:''}${judgeScorecardsHTML(r)}${r.note?`<div class="small-text muted" style="margin-top:4px">${esc(r.note)}</div>`:''}</div>${renderLiveStatsDetails(r,f)}${renderFightReport(e,f)}`:pendingText}${f.story?`<div class="fight-story"><strong>Gancho editorial:</strong> ${esc(f.story)}</div>`:''}<div class="fight-actions">${liveButton}<button class="btn small" data-action="edit-fight" data-event-id="${e.id}" data-fight-id="${f.id}">Editar luta</button><button class="btn small" data-action="edit-result" data-event-id="${e.id}" data-fight-id="${f.id}">${r?'Corrigir resultado':'Definir resultado manual'}</button>${r?`<button class="btn small" data-action="clear-result" data-event-id="${e.id}" data-fight-id="${f.id}">Limpar resultado</button>`:''}<button class="btn danger small" data-action="delete-fight" data-event-id="${e.id}" data-fight-id="${f.id}">Excluir</button></div></div>`;}

details"><summary>Prospectos sem ranking (${prospects.length})</summary>${prospects.map(f=>`<div class="rank-row prospect-row"><div class="rank-pos">—</div>${fighterMiniAvatar(f)}<div class="rank-person"><strong>${esc(nameWithNick(f))}</strong><span>${esc(f.gym||f.base||f.origin)}</span></div><div class="rank-numbers">${recordText(c.records[f.id])}<small>AINDA SEM RANKING</small></div></div>`).join('')}</details>`:''}</section>`}).join('')}</div><div class="notice">Regra: prospects começam fora do ranking. A primeira luta oficial registrada os coloca na classificação; resultados futuros recalculam a posição e o cartel. Ao editar ou apagar eventos, o ranking e os cinturões são reconstruídos a partir do histórico restante.</div>`;

function promoContent(e){if(!e)return 'APEX COMBAT LEAGUE\n\nAinda não há evento cadastrado. Crie um evento e monte seu card para gerar a divulgação.';const c=recalculate();const f=e.fights||[];const head=f.find(x=>/luta principal|main event/i.test(String(x.slot||''))&&!/co-main/i.test(String(x.slot||'')))||f[f.length-1];const a=head?byId(head.a):null,b=head?byId(head.b):null;const lines=[];lines.push(`🥊 APEX COMBAT LEAGUE — ${eventLabel(e)}: ${e.name}`);lines.push(`📅 ${fmtDate(e.date,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})} | 📍 ${e.venue||'Los Santos, San Andreas'}`);lines.push('');lines.push(e.type==='fightnight'?'LOS SANTOS, É NOITE DE RANKING. Sem cinturões em disputa: cada vitória muda a conversa, cada derrota aperta o caminho até o topo.':'LOS SANTOS RECEBE UM EVENTO NUMERADO. A ACL reservou o cage para confrontos de alto impacto e disputas de título selecionadas.');lines.push('');if(head){lines.push(`🔥 LUTA PRINCIPAL — ${nameWithNick(a)} (${recordText(c.records[a.id])}) vs. ${nameWithNick(b)} (${recordText(c.records[b.id])})`);lines.push(`${divObj(head.division).label}${head.title?' · CINTURÃO EM JOGO':''}`);lines.push('');}lines.push('CARD CONFIRMADO');f.forEach((fight,i)=>{const fa=byId(fight.a),fb=byId(fight.b);if(!fa||!fb)return;const match=`${i+1}. ${nameWithNick(fa)} vs. ${nameWithNick(fb)} — ${divObj(fight.division).label}${fight.title?' [DISPUTA DE CINTURÃO]':''}`;lines.push(match);if(fight.story)lines.push(`   Gancho: ${fight.story}`);});if(e.notes){lines.push('');lines.push('O QUE ESTÁ EM JOGO');lines.push(e.notes);}const titleCount=f.filter(x=>x.title).length;if(e.type==='fightnight'){lines.push('');lines.push('📊 Sem disputas de cinturão nesta edição. O foco é ranking, prospectos e definição dos próximos desafiantes.');}else if(titleCount){lines.push('');lines.push(`🏆 ${titleCount} disputa(s) de cinturão confirmada(s). Não são todos os títulos da ACL — apenas as divisões selecionadas para este card.`);}return lines.join('\n');}

function posterWrapText(ctx,text,maxWidth,maxLines=2){
 const words=String(text||'').split(/\s+/).filter(Boolean),lines=[];let line='';
 for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width<=maxWidth||!line){line=test;}else{lines.push(line);line=word;if(lines.length>=maxLines-1)break;}}
 if(line&&lines.length<maxLines)lines.push(line);
 const consumed=lines.join(' ').replace(/\s+/g,' ').length;
 if(consumed<String(text||'').trim().replace(/\s+/g,' ').length&&lines.length){let last=lines.length-1;while(lines[last].length&&ctx.measureText(lines[last]+'…').width>maxWidth)lines[last]=lines[last].slice(0,-1);lines[last]=lines[last].trimEnd()+'…';}
 return lines;
}
function posterText(ctx,text,x,y,maxWidth,lineHeight,maxLines=2,align='left'){
 const lines=posterWrapText(ctx,text,maxWidth,maxLines);ctx.textAlign=align;lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));return lines.length*lineHeight;
}
function posterRoundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}

function posterDrawFlag(ctx,f,x,y,w,h){

function downloadPromoPNG(){

 try{
  renderPromoImage();
  const dataUrl=canvas.toDataURL('image/png');
  const slug=(e.name||'evento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
  const a=document.createElement('a');a.href=dataUrl;a.download=`ACL-${slug||'evento'}-discord.png`;document.body.appendChild(a);a.click();a.remove();

 }catch(err){console.error('ACL poster export failed',err);toast('Não foi possível exportar a arte neste navegador. Tente recarregar a página.');}
}

function fmtMediaDate(value){if(!value)return 'Data a definir';const d=new Date(value);return Number.isNaN(d.getTime())?'Data a definir':new Intl.DateTimeFormat('pt-BR',{day:'2-digit',month:'short',year:'numeric'}).format(d);}

ventId"><option value="">Sem evento específico</option>${eventOptions}</select></div><div class="field"><label for="mediaFightSelect">Confronto (quando aplicável)</label><select id="mediaFightSelect" name="fightId"><option value="">Selecione um evento primeiro</option></select></div><div class="form-grid"><div class="field"><label for="mediaFighterA">Atleta principal / canto A</label><select id="mediaFighterA" name="fighterAId"><option value="">Selecionar atleta</option>${fighterOptions}</select></div><div class="field"><label for="mediaFighterB">Adversário / canto B</label><select id="mediaFighterB" name="fighterBId"><option value="">Selecionar atleta</option>${fighterOptions}</select></div></div><div class="field"><label for="mediaHeadline">Título personalizado (opcional)</label><input id="mediaHeadline" name="title" maxlength="160" placeholder="Deixe em branco para sugerir automaticamente"></div><div class="field"><label for="mediaAngle">Gancho editorial / notas da direção</label><textarea id="mediaAngle" name="angle" maxlength="1800" placeholder="Ex.: respeite a história já construída; não invente falas do player; destaque a revanche..."></textarea></div><div class="media-player-note"><strong>Proteção de personagens de players:</strong> entrevistas geram perguntas e espaços para resposta. O sistema não publica declarações inventadas como se fossem falas de um jogador. Revise o texto antes de aprovar.</div><button class="btn primary" type="submit">✦ Gerar rascunho para aprovação</button></form><div class="notice">A geração é automática por modelos editoriais e dados oficiais da ACL. Todo material começa privado como rascunho; somente “Aprovar e publicar” envia para o Newsroom público.</div></section><div><section class="panel"><div class="panel-head"><div><h3>Automação editorial</h3><p>Rascunhos factuais aparecem quando o estado oficial muda.</p></div><button class="btn small" data-action="sync-media-news">⟳ Atualizar pautas</button></div><div class="list-stack"> function selectedMediaContext(form){const d=new FormData(form);const eventId=String(d.get('eventId')||'');const e=eventById(eventId);const fightId=String(d.get('fightId')||'');const f=e?.fights.find(x=>String(x.id)===fightId)||null;const fighterA=byId(String(d.get('fighterAId')||''))||(f?byId(f.a):null);const fighterB=byId(String(d.get('fighterBId')||''))||(f?byId(f.b):null);return {d,event:e,fight:f,fighterA,fighterB};}
function buildMediaDraft(type,ctx){const {d,event:e,fight:f,fighterA:a,fighterB:b}=ctx;const c=recalculate();const angle=String(d.get('angle')||'').trim();let item={type:'news',category:'ACL NEWS',title:'',excerpt:'',body:'',status:'draft',metadata:{eventId:e?.id||null,fightId:f?.id||null},sourceKey:null};

 }
 if(type==='event-preview'){

 }else if(type==='fight-result'){

 }else if(type==='interview'){
  if(!a)throw new Error('Selecione o atleta para preparar a entrevista.');item.type='interview';item.category='ENTREVISTA ACL';item.title=`Entrevista ACL: ${fullName(a)}`;item.excerpt=`Perguntas preparadas para ${fullName(a)} · ${divObj(a.division).label}.`;item.body=`ACL MEDIA CENTER — ROTEIRO DE ENTREVISTA\n\nCONVIDADO: ${fullName(a)}\nAcademia: ${a.gym||'Equipe independente'}\nCartel ACL: ${recordText(c.records[a.id])}\n\nAPRESENTAÇÃO\nHoje recebemos ${fullName(a)}, que representa ${a.gym||'sua equipe'} na divisão ${divObj(a.division).label}.\n\nPERGUNTAS DO APRESENTADOR\n1. Em que parte do seu jogo você mais trabalhou para chegar até aqui?\n[RESPOSTA DO PLAYER / CONVIDADO]\n\n2. O que você considera que precisa provar na sua próxima luta?\n[RESPOSTA DO PLAYER / CONVIDADO]\n\n3. Que aspecto do estilo do seu adversário mais exige atenção?\n[RESPOSTA DO PLAYER / CONVIDADO]\n\n4. Qual é o seu objetivo dentro da divisão nos próximos eventos?\n[RESPOSTA DO PLAYER / CONVIDADO]\n\n${angle?`PERGUNTA EXTRA DA DIREÇÃO\n${angle}\n[RESPOSTA DO PLAYER / CONVIDADO]\n\n`:''}Nota editorial: as respostas devem ser preenchidas ou aprovadas pelo player/participante. Nenhuma fala foi atribuída automaticamente ao personagem.`;item.metadata={fighterAId:a.id};

function generateStory(a,b,div,title){if(title)return `Cinturão de ${divObj(div).label} em jogo: ${fullName(a)} e ${fullName(b)} chegam com caminhos diferentes, mas só um pode sair com o título.`;const c=recalculate();const pa=c.ranking[div]||[];const ra=pa.findIndex(x=>x.id===a.id)+1,rb=pa.findIndex(x=>x.id===b.id)+1;if(Math.abs(ra-rb)<=1)return `Confronto direto entre atletas próximos no ranking. Uma vitória aqui pode ser o primeiro passo para entrar na conversa pelo top 5.`;return `${fullName(a)} tenta confirmar sua posição na divisão, enquanto ${fullName(b)} busca uma vitória que mude a hierarquia do ranking.`;}
function alreadyFought(a,b){return state.events.some(e=>(e.fights||[]).some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a)));}
function nextEventNumber(type){const field=type==='numbered'?'numbered':'fightnight';const max=state.events.filter(e=>e.type===type).reduce((n,e)=>Math.max(n,+e.number||0),0);state.counters[field]=Math.max(+state.counters[field]||0,max)+1;return state.counters[field];}
function createEventFromForm(form,generate=true){const data=new FormData(form);const name=String(data.get('name')||'').trim();if(!name){toast('Digite um nome para o evento.');return;}const type=data.get('type')==='numbered'?'numbered':'fightnight';const event={id:uid('event'),name,type,number:nextEventNumber(type),date:String(data.get('date')||todayISO()),venue:String(data.get('venue')||'Los Santos').trim(),notes:String(data.get('notes')||'').trim(),fights:[],createdAt:Date.now()};state.events.push(event);state.counters.totalCreated=(+state.counters.totalCreated||0)+1;if(generate){const count=clamp(parseInt(data.get('fightCount')||'6',10)||6,1,12);const titles=type==='numbered'?clamp(parseInt(data.get('titleCount')||'0',10)||0,0,2):0;generateCard(event,count,titles);}selectedEventId=event.id;saveState();render();toast(`${eventLabel(event)} criado: “${name}”.`);}
function generateCard(e,count=6,titleCount=0){if(e.type!=='numbered')titleCount=0;count=clamp(count,1,12);titleCount=Math.min(titleCount,count,2);e.fights=[];const used=new Set();const titleDivs=new Set();for(let i=0;i<titleCount;i++){const pair=pickTitlePair(e,used,titleDivs);if(!pair)break;const f=createFightObject(e,pair.a,pair.b,pair.division,true,'Luta principal',pair.story);e.fights.push(f);used.add(pair.a.id);used.add(pair.b.id);titleDivs.add(pair.division);}while(e.fights.length<count){const pair=pickRegularPair(used);if(!pair)break;const i=e.fights.length;const slot=slotName(i,count);e.fights.push(createFightObject(e,pair.a,pair.b,pair.division,false,slot,pair.story));used.add(pair.a.id);used.add(pair.b.id);}e.fights.forEach((f,i)=>{if(f.title){const titleFights=e.fights.filter(x=>x.title);f.slot=titleFights.indexOf(f)===titleFights.length-1?'Luta principal':'Co-main event';}else if(i===0)f.slot=slotName(i,e.fights.length);else if(i===1&&!e.fights[0]?.title)f.slot='Co-main event';else f.slot=slotName(i,e.fights.length);});}
function pickTitlePair(e,used,excludedDivs=new Set()){const c=recalculate();const divOptions=DIVISIONS.filter(d=>!excludedDivs.has(d.id)).map(d=>{const fs=(c.ranking[d.id]||[]).filter(f=>!used.has(f.id));const champId=c.champions[d.id];const champ=champId?fs.find(f=>f.id===champId):null;const opponents=fs.filter(f=>f.id!==champId);const last=state.events.filter(x=>x.id!==e.id&&(x.fights||[]).some(f=>f.title&&f.division===d.id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];return {d,fs,champ,opponents,last,eligible:champ?opponents.length>0:fs.length>=2};}).filter(x=>x.eligible);divOptions.sort((a,b)=>{if(!a.last&&!b.last)return a.d.id.localeCompare(b.d.id);if(!a.last)return -1;if(!b.last)return 1;return (a.last.date||'').localeCompare(b.last.date||'');});for(const opt of divOptions){let a,b;if(opt.champ){a=opt.champ;b=opt.opponents[0];}else{a=opt.fs[0];b=opt.fs[1];}if(!a||!b)continue;return {a,b,division:opt.d.id,story:opt.champ?'O campeão precisa confirmar o reinado diante de um desafiante que pode mudar a hierarquia da divisão.':'Cinturão vago: os dois nomes melhor posicionados disponíveis disputam a primeira palavra na divisão.'};}return null;}
function pickRegularPair(used){const c=recalculate();const allCandidates=[];DIVISIONS.forEach(d=>{let fs=divisionFighters(d.id).filter(f=>!used.has(f.id));const champ=c.champions[d.id];if(fs.filter(f=>f.id!==champ).length>=2)fs=fs.filter(f=>f.id!==champ);if(fs.length<2)return;const appearances={};state.events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).forEach(e=>(e.fights||[]).forEach(f=>{appearances[f.a]=(appearances[f.a]||0)+1;appearances[f.b]=(appearances[f.b]||0)+1;}));for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++){const a=fs[i],b=fs[j];let score=(c.points[a.id]||0)+(c.points[b.id]||0);score+=(a.ranked===false&&!(c.stats[a.id]?.fights||0)?95:0)+(b.ranked===false&&!(c.stats[b.id]?.fights||0)?95:0);score-=((appearances[a.id]||0)+(appearances[b.id]||0))*7;if(alreadyFought(a.id,b.id))score-=50;score+=Math.random()*5;allCandidates.push({a,b,division:d.id,score,story:generateStory(a,b,d.id,false)});}});allCandidates.sort((a,b)=>b.score-a.score);return allCandidates[0]||null;}
function createFightObject(e,a,b,division,title=false,slot='',story=''){return {id:uid('fight'),a:a.id,b:b.id,division,title:!!title,rounds:title?5:3,slot:slot||'Card preliminar',story:story||generateStory(a,b,division,title),result:null};}
function addFightsToCount(e,target=6){const used=new Set((e.fights||[]).flatMap(f=>[f.a,f.b]));while(e.fights.length<target){const pair=pickRegularPair(used);if(!pair)break;const i=e.fights.length;e.fights.push(createFightObject(e,pair.a,pair.b,pair.division,false,slotName(i,target),pair.story));used.add(pair.a.id);used.add(pair.b.id);}e.fights.forEach((f,i)=>{if(!f.title)f.slot=slotName(i,e.fights.length);});saveState();render();toast(`Card atualizado: ${e.fights.length} luta(s).`);}
function narrativePick(items){return items[Math.floor(Math.random()*items.length)];}

function fighterDefenseLine(f,opponent,phase){const s=statsFor(f),o=statsFor(opponent);const choices=[];

function finishDescription(method,winner,loser){const arts=fighterArts(winner);if(/Finalização/i.test(method)){let hold;if(arts.some(x=>x.includes('jiu-jítsu')))hold=narrativePick(['um estrangulamento pelas costas','uma guilhotina encaixada durante a tentativa de queda','uma chave de braço construída após avançar a posição','um triângulo fechado quando o adversário tentou se levantar']);else if(arts.some(x=>x.includes('sambo')||x.includes('judô')))hold=narrativePick(['uma chave de braço após controlar a queda','um estrangulamento aproveitando a transição no solo','uma chave de perna encaixada durante a scramble']);else hold=narrativePick(['um estrangulamento encaixado na transição','uma chave de braço construída a partir do controle por cima','uma guilhotina quando o adversário tentou entrar nas pernas']);return `${nameWithNick(winner)} aproveitou a reação de ${nameWithNick(loser)} para ajustar ${hold}. A defesa foi ficando cada vez mais difícil, até que ${nameWithNick(loser)} sinalizou a desistência; o árbitro entrou imediatamente e confirmou a vitória por finalização.`;}

function generateFightReport(e,f,result){const a=byId(f.a),b=byId(f.b);if(!a||!b||!result)return null;const winner=result.winnerId?byId(result.winnerId):null;const loser=winner?(winner.id===a.id?b:a):null;const method=result.method||'Resultado registrado';const finishing=/KO|TKO|Finalização|Desqualificação/i.test(method)&&!!winner;const lastRound=clamp(parseInt(result.round||f.rounds||3,10)||3,1,f.rounds||3);const describedRounds=finishing?lastRound:(f.rounds||3);const titleLine=f.title&&e.type==='numbered'?`Disputa de cinturão de ${divObj(f.division).label}. `:'';const hook=f.story?` O contexto que cercava a luta era: ${f.story.trim().replace(/[.!?]+$/,'')}.`:'';

function fightReportText(e,f){const r=f?.result;if(!e||!f||!r)return '';const report=r.report||generateFightReport(e,f,r);const a=byId(f.a),b=byId(f.b),winner=r.winnerId?byId(r.winnerId):null;const lines=[`APEX COMBAT LEAGUE — ${eventLabel(e)}: ${e.name}`,`${nameWithNick(a)} vs. ${nameWithNick(b)} — ${divObj(f.division).label}`,`RESULTADO: ${winner?nameWithNick(winner)+' venceu':'Empate'} por ${r.method||'resultado registrado'}${r.round?' · Round '+r.round:''}`,'','CONTEXTO DA LUTA',report.opening,''];report.rounds.forEach(x=>{lines.push(`ROUND ${x.number} — ${x.title.toUpperCase()}`,x.text,'');});lines.push('PONTO DE VIRADA',report.turningPoint,'','IMPACTO NA ACL',report.implications,'','TEXTO PARA NARRAÇÃO NO RÁDIO',report.radio);if(Array.isArray(r.liveTranscript)&&r.liveTranscript.length){lines.push('','TRANSCRIÇÃO EM TEMPO REAL');r.liveTranscript.forEach(b=>lines.push(`R${b.round} · ${b.clock} · ${b.kind==='round'?'GONGO':b.kind==='finish'?'RESULTADO':'AO VIVO'}`,b.text));}if(r.note)lines.push('','NOTA EDITORIAL',r.note);return lines.join('\n');}

function isJudgesDecision(result){return /decis(?:ã|a)o\s+(?:un[aâ]nime|dividida)|unanimous decision|split decision/i.test(String(result?.method||''));}

 const rounds=Math.max(1,Number(f.rounds)||Number(result.round)||3);
 const officialWinnerSide=String(result.winnerId)===String(f.a)?'a':'b';
 const split=/dividida/i.test(String(result.method||''));

 return judgeSides.map((pickedSide,i)=>{
  const dominant=!split&&i===1;
  const pickedScore=10*rounds-(dominant?0:1);
  const otherScore=9*rounds+(dominant?0:1);
  const aScore=pickedSide==='a'?pickedScore:otherScore;
  const bScore=pickedSide==='b'?pickedScore:otherScore;
  return {judge:`Juiz ${i+1}`,aScore,bScore,winnerId:pickedSide==='a'?f.a:f.b,winnerScore:pickedScore,loserScore:otherScore};

}
function ensureJudgeScorecards(f,result){if(isJudgesDecision(result)&&(!Array.isArray(result.judgeScorecards)||result.judgeScorecards.length!==3))result.judgeScorecards=buildJudgeScorecards(f,result);return result;}
function judgeScorecardsHTML(result){const cards=Array.isArray(result?.judgeScorecards)?result.judgeScorecards:[];if(!cards.length)return '';return `<div class="decision-scorecards"><h5>Cartões dos juízes · canto vermelho – canto verde</h5>${cards.map(c=>`<div class="decision-scorecard-row"><span>${esc(c.judge||'Juiz')}</span><strong>${Number(c.aScore)||0}–${Number(c.bScore)||0}</strong><span>para ${esc(nameWithNick(byId(c.winnerId)))}</span></div>`).join('')}</div>`;}
function simulateFight(f){const a=byId(f.a),b=byId(f.b);if(!a||!b)return null;const sa=statsFor(a),sb=statsFor(b);const scoreA=sa.striking*.23+sa.grappling*.19+sa.cardio*.14+sa.chin*.10+sa.technique*.20+sa.power*.14;const scoreB=sb.striking*.23+sb.grappling*.19+sb.cardio*.14+sb.chin*.10+sb.technique*.20+sb.power*.14;const pA=clamp(1/(1+Math.exp((scoreB-scoreA)/12)),.22,.78);const roll=Math.random();let result;if(roll<.035)result={winnerId:null,method:'Empate majoritário',round:f.rounds,note:'Os juízes não encontraram separação suficiente; a divisão segue sem uma resposta definitiva.'};else{const winner=roll<.035+(1-.035)*pA?a.id:b.id;const winF=byId(winner);const sw=statsFor(winF);const opp=byId(winner===a.id?b.id:a.id);const so=statsFor(opp);let finishChance=.30+((sw.power+sw.striking+sw.grappling)-(so.chin+so.grappling))/220;finishChance=clamp(finishChance,.18,.52);if(f.title)finishChance*=.92;const finish=Math.random()<finishChance;let method,round;if(finish){const subWeight=clamp((sw.grappling+sw.technique)/(sw.striking+sw.power+sw.grappling+sw.technique),.2,.7);const x=Math.random();method=x<subWeight?'Finalização':(x<subWeight+.48?'KO':'TKO');round=1+Math.floor(Math.pow(Math.random(),.68)*f.rounds);}else{method=Math.random()<.20?'Decisão dividida':'Decisão unânime';round=f.rounds;}const note=finish?(method==='Finalização'?'A sequência no chão abriu espaço para a finalização.':`Um ataque limpo mudou o rumo da luta e encerrou o combate por ${method.toLowerCase()}.`):(method==='Decisão dividida'?'Os juízes divergiram em uma luta de margens curtas.':'O vencedor controlou momentos decisivos e levou a melhor na pontuação.');result={winnerId:winner,method,round,note};}if(isJudgesDecision(result))result.judgeScorecards=buildJudgeScorecards(f,result);result.report=generateFightReport(eventForFight(f),f,result);return result;}
function eventForFight(f){return state.events.find(e=>(e.fights||[]).some(x=>x.id===f.id))||{id:'',name:'Evento ACL',type:f.title?'numbered':'fightnight',number:0,fights:[f]};}
async function simulateEvent(id,redo=false){return startEventTransmission(id,redo);}
async function handleACLTransmissionError(err,context='ACL FIGHT LIVE'){const detail=String(err?.message||err||'falha inesperada').slice(0,220);console.error(`[ACL FIGHT LIVE] ${context}`,err);const live=state.liveSimulation;if(live&&live.status==='running'){live.elapsedBeforePauseMs=liveElapsedMs(live);live.status='paused';live.pausedAt=Date.now();live.startedAt=null;clearLiveTicker();}const run=state.eventTransmission;if(run&&['running','intermission'].includes(run.status)){run.status='paused-error';run.lastError=detail;run.nextFightAt=null;}if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}try{await saveState();}catch(saveErr){console.error('[ACL FIGHT LIVE] recovery persistence failed',saveErr);}render();if(live&&['paused','finished'].includes(live.status)){try{openLiveSimulationModal();}catch(modalErr){console.error('[ACL FIGHT LIVE] panel reopen failed',modalErr);}}toast('A comissão chama os atletas para o corner. O combate aguarda a orientação da equipe antes de continuar.');}
async function startEventTransmission(eventId,redo=false){

 const e=eventById(eventId);if(!e){toast('Não encontrei esse evento.');return;}

 const runningLive=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)?state.liveSimulation:null;

 if(!redo&&otherRun){
  if(String(otherRun.eventId)===String(e.id)){
   if(runningLive&&String(runningLive.eventId)===String(e.id))openLiveSimulationModal();
   else if(runningLive)toast('Outra luta está ao vivo. Aguarde o combate atual terminar.');
   else{ensureEventTransmissionTicker();startNextEventFight().catch(err=>console.error('ACL queue recovery failed',err));toast('A fila deste evento foi retomada.');}
  }else toast('Outro evento está em transmissão. Termine ou cancele essa transmissão antes de iniciar outro.');

 const pending=orderedCardFights(e).filter(f=>!f.result);

async function startNextEventFight(){
 if(eventTransitionBusy||!isAdmin)return;
 eventTransitionBusy=true;
 try{
  const run=state.eventTransmission;if(!run||!['running','intermission'].includes(run.status))return;
  const active=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)?state.liveSimulation:null;
  if(active)return;
  if(run.status==='intermission'&&Date.now()<Number(run.nextFightAt||0))return;
  const e=eventById(run.eventId);if(!e){run.status='cancelled';run.finishedAt=Date.now();await saveState();return;}
  const order=Array.isArray(run.fightIds)&&run.fightIds.length?run.fightIds:orderedCardFights(e).map(f=>f.id);
  const next=order.map(fid=>e.fights.find(f=>String(f.id)===String(fid))).find(f=>f&&!f.result);
  if(!next){run.status='finished';run.currentFightId=null;run.nextFightAt=null;run.finishedAt=Date.now();run.completedFightIds=e.fights.filter(f=>f.result).map(f=>f.id);const saved=await saveState();if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}render();if(SUPABASE_CONFIGURED&&isAdmin&&!saved?.ok)toast('O evento terminou, mas o estado final ainda precisa sincronizar com a nuvem.');else toast(`Evento encerrado! ${e.name}: todas as lutas foram transmitidas.`);return;}
  run.status='running';run.currentFightId=next.id;run.nextFightAt=null;
  const runSaved=await saveState();if(SUPABASE_CONFIGURED&&isAdmin&&!runSaved?.ok){run.status='paused-error';run.nextFightAt=null;if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}render();toast('A sequência foi pausada porque o banco não confirmou a próxima luta. Corrija a conexão e clique em “Transmitir evento” para tentar novamente.');return;}
  await startLiveFight(e.id,next.id,{eventRun:true});
  const started=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)&&String(state.liveSimulation.eventId)===String(e.id)&&String(state.liveSimulation.fightId)===String(next.id);
  if(!started&&state.eventTransmission&&String(state.eventTransmission.id)===String(run.id)&&['running','intermission'].includes(state.eventTransmission.status)){
   state.eventTransmission.status='paused-error';state.eventTransmission.nextFightAt=null;
   if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}
   render();toast('A fila foi pausada porque a próxima luta não conseguiu iniciar. Confira o erro de gravação e clique em “Transmitir evento” para tentar novamente.');
  }
 }finally{eventTransitionBusy=false;}
}
function ensureEventTransmissionTicker(){if(eventTransmissionTicker)return;eventTransmissionTicker=setInterval(()=>{
 const run=state.eventTransmission;if(!isAdmin||!run||!['running','intermission'].includes(run.status)){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;return;}
 const live=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)?state.liveSimulation:null;
 if(live)return;
 if(run.status==='running'||Date.now()>=Number(run.nextFightAt||0))startNextEventFight().catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar a próxima luta'));

async function cancelEventTransmission(reason='cancelled'){

 if(state.liveSimulation&&String(state.liveSimulation.eventId)===String(run.eventId)&&['running','paused'].includes(state.liveSimulation.status)){
  state.liveSimulation=null;liveOutcomePlan=null;clearLiveTicker();
 }
 if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}
 const saved=await saveState();
 if(SUPABASE_CONFIGURED&&isAdmin&&!saved?.ok){state.eventTransmission=oldRun;state.liveSimulation=oldLive;if(oldLive&&oldLive.status==='running')ensureLiveTicker();ensureEventTransmissionTicker();toast('Não consegui salvar o cancelamento do evento. A transmissão continua como estava.');return;}

function liveElapsedMs(live){if(!live)return 0;const carried=Math.max(0,Number(live.elapsedBeforePauseMs)||0);return live.status==='running'&&live.startedAt?carried+Math.max(0,Date.now()-Number(live.startedAt)):carried;}
function liveWallSecondsFromCombatSeconds(combatSeconds){const s=Math.max(0,Number(combatSeconds)||0);return s+Math.floor(Math.max(0,s-1)/ACL_LIVE_ROUND_SECONDS)*ACL_LIVE_REST_SECONDS;}

function liveRoundNumber(live,elapsedSeconds){return livePeriodAtWall(live,elapsedSeconds).round;}
function liveRoundLabelAt(live,wallSeconds){const p=livePeriodAtWall(live,wallSeconds);return p.inRest?`INTERVALO · APÓS ROUND ${p.round}`:`ROUND ${p.round} / ${Math.max(1,Number(live?.rounds)||3)}`;}
function liveProgressAtWall(live,wallSeconds){const p=livePeriodAtWall(live,wallSeconds);return p.inRest?100:Math.max(0,Math.min(100,p.secondInRound/ACL_LIVE_ROUND_SECONDS*100));}
function liveClockAt(live,elapsedSeconds){const p=livePeriodAtWall(live,elapsedSeconds);if(p.inRest){const remaining=Math.max(0,p.restRemaining);return `00:${String(remaining).padStart(2,'0')}`;}const remaining=Math.max(0,ACL_LIVE_ROUND_SECONDS-p.secondInRound);return `${String(Math.floor(remaining/60)).padStart(2,'0')}:${String(remaining%60).padStart(2,'0')}`;}

 if(!live)return;

function initializeLiveSilhouetteStages(container=document){const live=state.liveSimulation;(container||document).querySelectorAll?.('.live-silhouette-stage').forEach(stage=>{if(live&&(!stage.dataset.liveId||String(stage.dataset.liveId)===String(live.id)))updateLiveSilhouetteStage(stage,live);});}
function applyLiveMove(stage,move,live=null){if(!stage)return;stage.dataset.move=String(move||'idle');if(live){stage.dataset.liveId=String(live.id||'');updateLiveSilhouetteStage(stage,live);}const target=stage.querySelector('#liveImpactFlash');if(target){const meta=liveActionBadge(move);target.innerHTML=`<span class="live-action-icon">${meta.icon}</span>${meta.text}`;target.classList.remove('pulse');void target.offsetWidth;target.classList.add('pulse');}}
function liveClampAdd(obj,key,amount){obj[key]=clamp((Number(obj[key])||0)+amount,0,100);}
function liveTrackStrikes(live,attackerSide,defenderSide,region,attempts,landed){const s=live.stats[attackerSide];s.strikesAttempted+=attempts;s.strikesLanded+=landed;s.significantAttempted+=attempts;s.significantLanded+=landed;const statKey=region==='head'?'head':region==='body'?'body':'legs';s[`${statKey}Attempted`]+=attempts;s[`${statKey}Landed`]+=landed;for(let i=0;i<landed;i++){if(region==='head')liveClampAdd(live.damage[defenderSide],'head',13+Math.floor(Math.random()*9));else if(region==='body')liveClampAdd(live.damage[defenderSide],'body',11+Math.floor(Math.random()*8));else{const leg=Math.random()<.5?'leftLeg':'rightLeg';liveClampAdd(live.damage[defenderSide],leg,16+Math.floor(Math.random()*8));}}}
function liveHitChance(attacker,defender){const sa=statsFor(attacker),sd=statsFor(defender);return clamp(.62+((sa.striking||65)-(sd.technique||65))/220+((sa.technique||65)-(sd.chin||65))/350,.35,.88);}
function applyLiveCombatImpact(live,move,actorSide,defenderSide){ensureLiveAnalytics(live);const {a,b}=liveFightContext(live);const m=String(move||'');const hit=m.match(/^([ab])-(jab-cross|body-kick|low-kick|counter|takedown|ground-strike|ground-pass|submission|getup|clinch-knee)$/);const side=hit?hit[1]:actorSide;const kind=hit?hit[2]:m;const other=side==='a'?'b':'a';const attacker=side==='a'?a:b,defender=other==='a'?a:b;if(!attacker||!defender)return {type:'none',region:null,landed:0,attempted:0};
 if(kind==='takedown'){live.stats[side].takedownAttempted++;live.stats[side].takedownLanded++;return {type:'takedown',region:null,landed:1,attempted:1,commentary:`QUEDA CONFIRMADA! ${nameWithNick(attacker)} soma uma queda conectada no placar estatístico.`};}
 if(kind==='ground-pass'){return {type:'position',region:null,landed:0,attempted:0,commentary:'Controle de posição em disputa; esse avanço não entra na contagem de golpes.'};}
 if(kind==='submission'){live.stats[side].submissionAttempts++;return {type:'submission',region:null,landed:0,attempted:0,commentary:'Tentativa de finalização registrada. A ameaça de chave ou estrangulamento ainda não conta como golpe conectado.'};}
 if(kind==='getup'||kind==='scramble'||kind==='clinch'||kind==='break-clinch'||kind==='reset'||kind==='idle'){return {type:'position',region:null,landed:0,attempted:0};}
 let region='head',attempts=1;if(kind==='body-kick'||kind==='clinch-knee')region='body';if(kind==='low-kick')region='legs';if(kind==='ground-strike'){attempts=2;region=Math.random()<.7?'head':'body';}if(kind==='jab-cross')attempts=2;
 const chance=liveHitChance(attacker,defender);let landed=0;for(let i=0;i<attempts;i++){const actualRegion=kind==='ground-strike'?(Math.random()<.72?'head':'body'):region;if(Math.random()<chance){landed++;const oneRegion=actualRegion;liveTrackStrikes(live,side,other,oneRegion,1,1);}else{liveTrackStrikes(live,side,other,actualRegion,1,0);}}
 let commentary='';const n=nameWithNick(attacker),d=nameWithNick(defender);if(region==='legs')commentary=landed?`${landed===1?'Chute baixo conecta':'Chutes baixos conectam'} na perna de ${d}! O dano nessa região aumenta.`:`${n} tenta o chute baixo, mas ${d} tira a perna da linha e evita o impacto limpo.`;else if(region==='body')commentary=landed?`${n} encontra o corpo! ${landed>1?'A sequência entra':'O golpe conecta'} na linha de cintura e o dano corporal aumenta.`:`O golpe de ${n} para na guarda; ${d} protege o corpo e não absorve impacto limpo.`;else commentary=landed?`${landed===attempts?'A sequência conecta limpa':landed===1?'Um golpe passa pela guarda':'Os golpes encontram a defesa'} na região da cabeça de ${d}; o mapa de dano é atualizado.`:`A sequência de ${n} não encontra alvo limpo: ${d} fecha a guarda e evita o dano direto na cabeça.`;
 return {type:'strike',region,landed,attempted:attempts,commentary};}
function liveStatRatio(landed,attempted){return `${Math.max(0,Number(landed)||0)}/${Math.max(0,Number(attempted)||0)}`;}
function liveStatsTableHTML(stats,a,b){const data=stats||liveFreshStats(),sa={...liveFreshSideStats(),...(data.a||{})},sb={...liveFreshSideStats(),...(data.b||{})};const rows=[['KD',sa.knockdowns,sb.knockdowns],['GOLPES TOTAIS',liveStatRatio(sa.strikesLanded,sa.strikesAttempted),liveStatRatio(sb.strikesLanded,sb.strikesAttempted)],['GOLPES SIGNIFICATIVOS',liveStatRatio(sa.significantLanded,sa.significantAttempted),liveStatRatio(sb.significantLanded,sb.significantAttempted)],['CABEÇA',liveStatRatio(sa.headLanded,sa.headAttempted),liveStatRatio(sb.headLanded,sb.headAttempted)],['CORPO',liveStatRatio(sa.bodyLanded,sa.bodyAttempted),liveStatRatio(sb.bodyLanded,sb.bodyAttempted)],['PERNAS',liveStatRatio(sa.legsLanded,sa.legsAttempted),liveStatRatio(sb.legsLanded,sb.legsAttempted)],['CONTROLE',liveTimeStamp(sa.controlSeconds),liveTimeStamp(sb.controlSeconds)],['QUEDAS',liveStatRatio(sa.takedownLanded,sa.takedownAttempted),liveStatRatio(sb.takedownLanded,sb.takedownAttempted)],['TENTATIVAS DE FINALIZAÇÃO',sa.submissionAttempts,sb.submissionAttempts]];return `<div class="live-stat-table-wrap"><table class="live-stat-table"><thead><tr><th>ESTATÍSTICA</th><th class="red">🥊 ${esc(nameWithNick(a))}</th><th class="green">🥊 ${esc(nameWithNick(b))}</th></tr></thead><tbody>${rows.map(row=>`<tr><td>${row[0]}</td><td class="value">${row[1]}</td><td class="value">${row[2]}</td></tr>`).join('')}</tbody></table></div>`;}
function liveFightSilhouettesHTML(a,b,damage,compact=false){const d=damage||liveFreshDamage();return `<div class="${compact?'live-final-silhouettes':'live-silhouette-duel'}">${liveSilhouetteCardHTML('a',a,d.a||{},compact)}${liveSilhouetteCardHTML('b',b,d.b||{},compact)}</div>`;}
function renderLiveStatsDetails(result,fight){if(!result?.liveStats||!fight)return '';const fA=byId(fight.a),fB=byId(fight.b);if(!fA||!fB)return '';return `<details class="live-result-details"><summary>📊 Ver estatísticas completas e mapa de dano corporal</summary>${liveFightSilhouettesHTML(fA,fB,result.damageMap||{},true)}<div style="margin-top:10px">${liveStatsTableHTML(result.liveStats,fA,fB)}</div></details>`;}

function liveCoachText(live,side,round){
 const {a,b}=liveFightContext(live),own=side==='a'?a:b,opp=side==='a'?b:a,opSide=side==='a'?'b':'a';
 ensureLiveAnalytics(live);
 const d=live.damage?.[side]||liveFreshDamageSide(),od=live.damage?.[opSide]||liveFreshDamageSide();
 const off=live.stats?.[side]||liveFreshSideStats(),oppOff=live.stats?.[opSide]||liveFreshSideStats();
 const ownLegs=(Number(d.leftLeg)||0)+(Number(d.rightLeg)||0),oppLegs=(Number(od.leftLeg)||0)+(Number(od.rightLeg)||0);
 const myLanded=Number(off.significantLanded)||0,theirLanded=Number(oppOff.significantLanded)||0;
 const myTD=Number(off.takedownLanded)||0,theirTD=Number(oppOff.takedownLanded)||0;

 const ownStats=statsFor(own||{}),oppStats=statsFor(opp||{});
 const arts=(own?.arts||[]).join(' ').toLowerCase(),style=String(own?.style||'').toLowerCase();
 const isGrappler=/grappl|finaliz|wrestl|luta livre/.test(style+' '+arts)||/jiu-jitsu|jiu-jitsu brasileiro|sambo|judo|judô|wrestling/.test(arts);

 const opponentRecentTakedown=new RegExp(`${opSide}-(takedown|ground-strike|ground-pass|submission)`).test(lastMoves)||/takedown|ground/.test(lastMoves);
 let angle='';
 if(live.position==='ground'&&live.topSide===side){
  angle=isGrappler?'Você está por cima: prende o quadril, estabiliza o controle e força o rival a defender antes de avançar para passagem ou finalização.':'Segura a posição por cima, bate curto sem perder base e obriga o adversário a carregar seu peso; não entregue espaço tentando um golpe grande.';

  angle=isGrappler&&Number(ownStats.grappling)>=Number(oppStats.grappling)?'Constrói frames, protege o pescoço e usa a primeira brecha para raspar ou levantar; não gaste os braços empurrando de frente.':'Fecha a guarda, protege a cabeça e cria espaço com o quadril para levantar na grade. Primeiro sai da posição ruim, depois volta a pontuar.';
 }else if(ownLegs>=34){
  angle=`A perna já está sentindo o castigo. ${isGrappler?'Usa fintas de nível e ameaça a queda para tirar o chute da jogada.':'Troca a base por instantes, checa os próximos chutes e responde com as mãos quando o rival apoia o pé.'}`;
 }else if(Number(d.head)>=32){

 }else if(Number(d.body)>=30){

 }else if(oppLegs>=30&&isKicker){

 }else if(Number(od.head)>=30){

 }else if(myLanded>theirLanded+4){

}

async function cancelLiveSimulation(){const live=state.liveSimulation;if(!live||!['running','paused'].includes(live.status))return;if(!confirm('Cancelar esta transmissão? Nenhum resultado será aplicado ao cartel, ranking ou cinturão. A luta continuará pendente no card.'))return;const old=live,oldRun=state.eventTransmission?JSON.parse(JSON.stringify(state.eventTransmission)):null;state.liveSimulation=null;if(state.eventTransmission&&String(state.eventTransmission.eventId)===String(live.eventId)&&['running','intermission'].includes(state.eventTransmission.status)){state.eventTransmission.status='cancelled';state.eventTransmission.finishedAt=Date.now();state.eventTransmission.nextFightAt=null;}const saved=await saveState();if(SUPABASE_CONFIGURED&&isAdmin&&!saved?.ok){state.liveSimulation=old;if(oldRun)state.eventTransmission=oldRun;toast('Não foi possível salvar o cancelamento. A transmissão continua registrada.');return;}if(liveTicker){clearInterval(liveTicker);liveTicker=null;}if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}liveOutcomePlan=null;closeModal();render();toast('Transmissão cancelada. Nenhum resultado foi aplicado.');}

function currentChampionBefore(eventId,division){const champs={};Object.entries(state.initialChampions||{}).forEach(([d,id])=>{if(id&&byId(id))champs[d]=id;});for(const e of sortedEvents()){if(e.id===eventId)break;for(const f of e.fights||[]){if(!f.title||f.division!==division||e.type!=='numbered'||!f.result?.winnerId)continue;champs[division]=f.result.winnerId;}}return champs[division]||null;}
function validTitleParticipants(e,aId,bId,division){const champion=currentChampionBefore(e.id,division);if(champion)return aId===champion||bId===champion;const c=recalculate();const top=(c.ranking[division]||[]).filter(f=>f.id===aId||f.id===bId);return top.length===2;}

async function optimizeFighterPhoto(file){
 if(!file||!String(file.type||'').startsWith('image/'))throw new Error('Selecione um arquivo de imagem válido.');
 if(file.size>12*1024*1024)throw new Error('A foto precisa ter no máximo 12 MB antes da otimização.');
 const objectUrl=URL.createObjectURL(file);
 try{
  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Não consegui abrir essa imagem. Use JPG, PNG ou WebP.'));img.src=objectUrl;});
  const maxW=640,maxH=820,scale=Math.min(1,maxW/image.naturalWidth,maxH/image.naturalHeight),canvas=document.createElement('canvas');
  canvas.width=Math.max(1,Math.round(image.naturalWidth*scale));canvas.height=Math.max(1,Math.round(image.naturalHeight*scale));
  const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Não foi possível preparar a imagem neste navegador.');
  ctx.fillStyle='#101720';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(image,0,0,canvas.width,canvas.height);
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',0.86));if(!blob)throw new Error('Não foi possível otimizar a foto.');return blob;
 }finally{URL.revokeObjectURL(objectUrl);}
}
async function uploadFighterPhoto(file,fighterId){
 if(!SUPABASE_CONFIGURED||!supabaseClient||!isAdmin)throw new Error('O envio de arquivos exige a conexão administrativa do Supabase. Você pode informar uma URL pública direta ou configurar o bucket de fotos.');
 const blob=await optimizeFighterPhoto(file);const safeId=String(fighterId).replace(/[^a-zA-Z0-9_-]/g,'_');const path=`fighters/${safeId}.jpg`;
 const {error}=await supabaseClient.storage.from('acl-fighter-photos').upload(path,blob,{contentType:'image/jpeg',upsert:true,cacheControl:'3600'});
 if(error)throw new Error(`Falha ao enviar a foto para o Supabase Storage: ${error.message}. Execute a atualização acl-media-center-setup.sql e tente novamente.`);
 const {data}=supabaseClient.storage.from('acl-fighter-photos').getPublicUrl(path);if(!data?.publicUrl)throw new Error('O Supabase não devolveu a URL pública da foto.');
 return `${data.publicUrl}${data.publicUrl.includes('?')?'&':'?'}v=${Date.now()}`;
}

 const photoFile=d.get('photoFile');const photoUrlInput=String(d.get('photoUrl')||'').trim();const removePhoto=d.get('removePhoto')==='on';

 if(old){const index=state.fighters.findIndex(x=>String(x.id??'')===String(old.id??''));if(index<0){const msg='Não encontrei esse atleta no elenco atual. Atualize os dados e tente novamente.';const box=$('fighterSaveError');if(box){box.textContent=msg;box.style.display='block';}toast(msg);return;}state.fighters[index]=f;}else state.fighters.push(f);

async function handleFighterSave(form){
 if(!form||fighterSaveBusy)return;
 if(typeof form.reportValidity==='function'&&!form.reportValidity())return;
 fighterSaveBusy=true;
 const button=$('fighterSaveButton');
 if(button){button.disabled=true;button.textContent='Salvando…';}
 try{
  await saveFighterForm(form);
 }catch(err){
  console.error('[ACL EDIT] Erro inesperado no formulário de atleta',err);
  const box=$('fighterSaveError');
  const detail=[err?.message,err?.code,err?.details,err?.hint].filter(Boolean).join(' · ')||'erro inesperado';
  const msg=`Erro inesperado ao salvar o atleta: ${detail}`;
  if(box){box.textContent=msg;box.style.display='block';}
  toast(msg);setStatus('! Atleta não salvo','red');
 }finally{
  fighterSaveBusy=false;
  const currentButton=$('fighterSaveButton');
  if(currentButton){currentButton.disabled=false;currentButton.textContent='Salvar atleta';}
 }
}
async function diagnoseFighterSave(){
 const box=$('fighterSaveError');
 const show=(msg,ok=false)=>{if(box){box.textContent=msg;box.style.display='block';box.style.borderColor=ok?'var(--line)':'var(--red)';}toast(msg);};
 try{
  if(!SUPABASE_CONFIGURED)throw new Error('Este site não reconhece uma configuração válida do Supabase. Confira config.js.');
  if(!supabaseClient)throw new Error('O cliente Supabase não foi inicializado. Recarregue a página e veja se há erro de conexão no console.');
  const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError)throw new Error(`Sessão Supabase: ${sessionError.message}`);
  const userId=sessionData?.session?.user?.id;
  if(!userId)throw new Error('Não existe uma sessão autenticada ativa. Saia e entre novamente como administradora.');
  const {data:adminRow,error:adminError}=await supabaseClient.from('acl_admins').select('user_id').eq('user_id',userId).maybeSingle();
  if(adminError)throw new Error(`Consulta à lista de administradores (acl_admins): ${adminError.message}`);
  if(!adminRow)throw new Error('Sua sessão está ativa, mas o usuário não consta em public.acl_admins.');
  const {data:row,error:readError}=await supabaseClient.from('acl_state').select('id,payload,updated_at').eq('id',1).maybeSingle();
  if(readError)throw new Error(`Leitura de acl_state: ${readError.message}`);
  if(!row?.payload)throw new Error('A linha acl_state id=1 não existe ou não contém payload.');
  let method='UPDATE RLS';
  const {data:updated,error:updateError}=await supabaseClient.from('acl_state').update({updated_at:new Date().toISOString()}).eq('id',1).select('id,updated_at').maybeSingle();
  if(updateError||!updated?.id){
   const why=updateError?.message||'UPDATE não alterou nenhuma linha (RLS ou grants)';
   const {data:rpcData,error:rpcError}=await supabaseClient.rpc('acl_save_state',{p_payload:row.payload});
   if(rpcError)throw new Error(`Escrita direta falhou: ${why}. RPC acl_save_state também falhou: ${rpcError.message}`);
   if(rpcData!==true&&rpcData!=='true')throw new Error(`RPC não confirmou a gravação: ${String(rpcData)}`);
   method='RPC acl_save_state';
  }
  const {data:verify,error:verifyError}=await supabaseClient.from('acl_state').select('id,updated_at,payload').eq('id',1).single();
  if(verifyError)throw new Error(`Leitura de confirmação após gravar: ${verifyError.message}`);
  if(!Array.isArray(verify?.payload?.fighters))throw new Error('A gravação respondeu, mas o payload não contém a lista de lutadores.');
  const msg=`Diagnóstico OK: login de admin, leitura e escrita confirmados (${method}). ${verify.payload.fighters.length} lutadores encontrados.`;
  show(msg,true);console.info('[ACL SAVE DIAGNOSTIC]',{userId,method,fighters:verify.payload.fighters.length,updatedAt:verify.updated_at});
 }catch(err){
  console.error('[ACL SAVE DIAGNOSTIC] Falhou',err);
  const detail=[err?.message,err?.code,err?.details,err?.hint].filter(Boolean).join(' · ')||'erro sem detalhes';
  show(`Diagnóstico falhou: ${detail}`);setStatus('! Falha na conexão de salvamento','red');
 }
}

async function deleteFighter(id){
 const f=byId(id);if(!f)return;
 if(SUPABASE_CONFIGURED&&(!supabaseClient||!isAdmin||!cloudLoaded)){toast('A base oficial não está pronta. Entre como administrador antes de excluir atletas.');return;}
 if(!confirm(`Excluir ${fullName(f)}? Suas lutas serão removidas dos cards e o histórico será recalculado. Essa operação não tem desfazer.`))return;

 const publicAllowed=['login','logout','close-modal','go-events','go-rankings','go-applications','open-event','copy-fight-report','refresh-public','download-media-poster'];if(!isAdmin&&!publicAllowed.includes(act)){toast('Entre como administrador para usar esta função.');return;}
 switch(act){case 'login':openAdminLogin();break;case 'logout':logoutAdmin();break;case 'refresh-public':refreshPublicState();break;case 'go-create-event':navigateCreateEvent();break;case 'go-events':setView('events');break;case 'go-rankings':setView('rankings');break;case 'go-promo':setView('promo');break;case 'go-applications':setView('applications');break;case 'go-promo-for-event':promoEventId=id;promoText=promoContent(eventById(id));setView('promo');break;case 'open-event':selectedEventId=id;setView('events');break;case 'new-fighter':openFighterEditor(null);break;case 'edit-fighter':openFighterEditor(id);break;case 'save-fighter-form':handleFighterSave($('fighterEditorForm'));break;case 'diagnose-fighter-save':diagnoseFighterSave();break;case 'delete-fighter':deleteFighter(id);break;case 'delete-event':deleteEvent(id);break;case 'simulate-pending':simulateEvent(id,false);break;case 'start-event-transmission':startEventTransmission(id,false).catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar o evento'));break;case 'cancel-event-transmission':if(confirm('Cancelar a sequência automática deste evento? A luta atual também será cancelada sem aplicar resultado.'))cancelEventTransmission('cancelled');break;case 'resimulate-all':simulateEvent(id,true).catch(err=>handleACLTransmissionError(err,'Não foi possível reiniciar o evento'));break;case 'start-live-fight':startLiveFight(eid,fid).catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar a luta'));break;case 'open-live-simulation':openLiveSimulationModal();break;case 'pause-live-sim':pauseLiveSimulation();break;case 'resume-live-sim':resumeLiveSimulation();break;case 'cancel-live-sim':cancelLiveSimulation();break;case 'clear-live-simulation':forceClearLiveSimulation();break;case 'edit-fight':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editFightModal(e,f);break;}case 'edit-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editResultModal(e,f);break;}case 'clear-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f&&confirm('Limpar o resultado desta luta? Cartel, ranking e cinturão serão recalculados.')){f.result=null;saveState();render();toast('Resultado removido.');}break;}case 'delete-fight':{const e=eventById(eid);if(e&&confirm('Excluir esta luta do card? O resultado deixa de contar no ranking.')){e.fights=e.fights.filter(x=>x.id!==fid);saveState();render();toast('Luta removida e ranking recalculado.');}break;}case 'generate-more-fights':{const e=eventById(id);if(e)addFightsToCount(e,6);break;}case 'close-modal':closeModal();break;case 'copy-fight-report':copyFightReport(eid,fid);break;case 'copy-promo':copyPromo();break;case 'download-promo':downloadPromo();break;case 'download-promo-png':downloadPromoPNG();break;case 'refresh-promo':refreshPromo();break;case 'print-promo':printPromo();break;case 'export-json':exportJSON();break;case 'trigger-import':$('importFile').click();break;case 'recalculate':{const c=recalculate();saveState();render();toast(`Recalculado: ${Object.keys(c.records).length} atletas avaliados.`);break;}case 'restore-seed':mergeSeedRoster();break;case 'clear-season':clearSeason();break;case 'reset-all':resetAll();break;case 'approve-application':approveApplication(id);break;case 'reject-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm(`Marcar a ficha de ${app.first} como recusada?`)){app.status='rejected';updateApplicationRemote(app).then(()=>{render();toast('Inscrição marcada como recusada.');});}break;}case 'delete-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm('Excluir permanentemente esta ficha de inscrição?')){deleteApplicationRemote(id).then(()=>{state.applications=state.applications.filter(a=>a.id!==id);render();toast('Ficha removida.');}).catch(err=>{console.error(err);toast('Não foi possível excluir a ficha no servidor.');});}break;}case 'create-empty-event':createEmptyFromInputs();break;case 'sync-media-news':syncAutomaticMediaDrafts().then(()=>{if(activeView==='media')render();toast('Pautas automáticas atualizadas a partir dos dados oficiais.');}).catch(err=>{console.error(err);toast('Não foi possível atualizar as pautas.');});break;case 'save-media-item':saveMediaItem(id,false,false);break;case 'publish-media-item':saveMediaItem(id,true,false);break;case 'unpublish-media-item':saveMediaItem(id,false,true);break;case 'delete-media-item':deleteMediaItem(id);break;case 'download-media-poster':downloadMediaPoster(id);break;case 'generate-media-quick':mediaQuickGenerate(btn.dataset.kind);break;}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}const btn=e.target.closest('[data-action]');if(btn){actionClick(btn);return;}if(e.target===$('modalBackdrop'))closeModal();});
document.addEventListener('submit',e=>{if(e.target.id==='mediaGeneratorForm'){e.preventDefault();generateMediaContent(e.target);return;}if(e.target.id==='adminLoginForm'){e.preventDefault();loginAdmin(e.target);return;}if(e.target.id==='applicationForm'){e.preventDefault();handleCreateApplication(e.target);return;}if(!isAdmin&&['createEventForm','editEventForm','fighterEditorForm','fightEditorForm','resultEditorForm','addFightForm','mediaGeneratorForm'].includes(e.target.id)){e.preventDefault();toast('Entre como administrador para alterar a liga.');return;}if(e.target.id==='createEventForm'){e.preventDefault();createEventFromForm(e.target,true);}else if(e.target.id==='editEventForm'){e.preventDefault();saveEventEdit(e.target);}else if(e.target.id==='fighterEditorForm'){e.preventDefault();handleFighterSave(e.target);}else if(e.target.id==='fightEditorForm'){e.preventDefault();saveFightEditor(e.target);}else if(e.target.id==='resultEditorForm'){e.preventDefault();saveResultEditor(e.target);}else if(e.target.id==='addFightForm'){e.preventDefault();addManualFight(e.target);}});
document.addEventListener('input',e=>{if(e.target.id==='fighterSearch'){fighterSearch=e.target.value;const pos=e.target.selectionStart;render();const next=$('fighterSearch');if(next){next.focus();next.setSelectionRange(pos,pos);}}else if(e.target.id==='promoText'){promoText=e.target.value;}});
document.addEventListener('input',e=>{if(e.target.name==='photoUrl'){const preview=$('fighterPhotoPreview');if(preview){const url=String(e.target.value||'').trim();preview.innerHTML=url&&/^https?:\/\//i.test(url)?`<img src="${esc(url)}" alt="Prévia da foto" referrerpolicy="no-referrer">`:esc(initials(byId(document.querySelector('#fighterEditorForm input[name="id"]')?.value)||{first:'A',last:'CL'}));}}});
document.addEventListener('change',e=>{if(e.target.name==='photoFile'){const file=e.target.files?.[0];const preview=$('fighterPhotoPreview');if(file&&preview){const oldUrl=preview.dataset.objectUrl;if(oldUrl)URL.revokeObjectURL(oldUrl);const url=URL.createObjectURL(file);preview.dataset.objectUrl=url;preview.innerHTML=`<img src="${url}" alt="Prévia da foto selecionada">`;}}else if(e.target.id==='fighterDivision'){fighterDivision=e.target.value;render();}else if(e.target.id==='rankDivision'){rankDivision=e.target.value;render();}else if(e.target.id==='promoEventSelect'){promoEventId=e.target.value;promoText=promoContent(eventById(promoEventId));render();}else if(e.target.id==='addFightDivision'){refreshAddFightFighters();}else if(e.target.id==='mediaEventSelect'){updateMediaFightSelect();}else if(e.target.id==='newEventType'){const isNumbered=e.target.value==='numbered';const title=$('newTitleCount');if(title){title.disabled=!isNumbered;if(!isNumbered)title.value='0';else if(title.value==='0')title.value='1';}const warn=$('typeWarning');if(warn)warn.textContent=isNumbered?'Evento numerado: a ACL pode selecionar até duas disputas de cinturão; não é necessário colocar todos os títulos em jogo.':'Fight Night: nenhum cinturão pode ser colocado em jogo. O evento numerado é o formato para disputas de título.';}});
$('importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(file&&confirm('Importar este backup vai substituir os dados atuais deste navegador. Exporte o estado atual antes se quiser preservá-lo. Continuar?'))importJSONFile(file);e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
// Normaliza elencos importados e inicia o modo público/administrador após verificar a sessão.
function normalizeState(){state.events.forEach(e=>{e.fights=e.fights||[];if(!e.type)e.type='fightnight';if(e.type==='fightnight')e.fights.forEach(f=>{if(f.title){f.title=false;f.rounds=3;}});});if(!state.counters)state.counters={numbered:0,fightnight:0,totalCreated:state.events.length};if(typeof state.counters.totalCreated!=='number')state.counters.totalCreated=state.events.length;if(!Object.prototype.hasOwnProperty.call(state,'liveSimulation'))state.liveSimulation=null;if(!Object.prototype.hasOwnProperty.call(state,'eventTransmission'))state.eventTransmission=null;if(state.liveSimulation&&Object.prototype.hasOwnProperty.call(state.liveSimulation,'plannedResult'))delete state.liveSimulation.plannedResult;if(state.liveSimulation&&liveSimulationIsStale(state.liveSimulation)){console.warn('ACL: removendo registro de transmissão órfão/expirado.',state.liveSimulation.id);state.liveSimulation=null;}}
normalizeState();initializeApp();
})();
