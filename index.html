/* Fighter photography: roster cards, rankings, fight cards and editor preview */
.fighter-card-top.fighter-card-hero{position:relative;display:block;height:230px;margin:-16px -16px 15px;overflow:hidden;border-radius:10px 10px 0 0;background:radial-gradient(circle at 50% 35%,rgba(201,164,92,.22),transparent 48%),linear-gradient(135deg,#1c2733,#080d13);border-bottom:1px solid rgba(201,164,92,.24)}
.fighter-portrait{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center;object-fit:cover;object-position:center 26%;color:#ead18a;font-size:74px;font-weight:1000;letter-spacing:-4px;background:linear-gradient(145deg,rgba(201,164,92,.13),rgba(6,10,15,.2));}
.fighter-portrait.photo-placeholder{background:radial-gradient(ellipse at 50% 38%,rgba(201,164,92,.28),transparent 32%),linear-gradient(135deg,#202c39,#080d13);}
.fighter-photo-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,6,10,.10),transparent 45%,rgba(3,6,10,.65));pointer-events:none}
.fighter-card-hero>.actions{position:absolute;top:10px;right:10px;z-index:2}
.fighter-card-hero>.actions .btn{background:rgba(6,10,15,.76);backdrop-filter:blur(8px)}
.fighter-card{overflow:hidden}
.fighter-mini-avatar{width:36px;height:36px;flex:0 0 36px;display:inline-flex;align-items:center;justify-content:center;border:1px solid rgba(201,164,92,.35);border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#283443,#0b1016);color:#e6c778;font-size:10px;font-weight:950;vertical-align:middle}
.rank-row{grid-template-columns:26px 36px minmax(0,1fr) auto}
.fighters-vs{align-items:stretch}
.fighter-side{min-width:0;display:flex;flex-direction:column;gap:7px}
.fighter-side.right{align-items:stretch}
.fight-portrait{width:100%;height:190px;flex:0 0 190px;display:flex;align-items:center;justify-content:center;object-fit:cover;object-position:center 25%;border:1px solid rgba(201,164,92,.22);border-radius:10px;background:radial-gradient(ellipse at 50% 30%,rgba(201,164,92,.21),transparent 40%),linear-gradient(145deg,#202c39,#080d13);color:#e6c778;font-size:43px;font-weight:1000;letter-spacing:-2px;overflow:hidden}
.fight-portrait.photo-placeholder{background:radial-gradient(ellipse at 50% 30%,rgba(201,164,92,.21),transparent 40%),linear-gradient(145deg,#202c39,#080d13)}
.fighter-side.right .fighter-name,.fighter-side.right .fighter-record{text-align:right}
.media-fighter-photo-form{display:grid;grid-template-columns:110px minmax(0,1fr);gap:13px;align-items:center}
#fighterPhotoPreview{width:110px;height:132px;border:1px solid rgba(201,164,92,.35);border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#202c39,#080d13);color:#e6c778;font-size:30px;font-weight:950}
#fighterPhotoPreview img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.fighter-photo-help{font-size:10px;color:var(--muted);line-height:1.5;margin-top:5px}
@media(max-width:700px){.fighter-card-top.fighter-card-hero{height:195px}.fight-portrait{height:140px;flex-basis:140px}.fighters-vs{grid-template-columns:minmax(0,1fr) 30px minmax(0,1fr);gap:6px}.media-fighter-photo-form{grid-template-columns:84px minmax(0,1fr)}#fighterPhotoPreview{width:84px;height:110px}.fighter-name{font-size:13px}}



/* ACL FIGHT LIVE — interface de transmissão renovada */
.modal.live-modal{width:min(1560px,97vw);height:min(94vh,1080px);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;border-color:#3b4b5c;background:#0d141d;box-shadow:0 28px 100px rgba(0,0,0,.72)}
.modal.live-modal .modal-head{flex:0 0 auto;padding:13px 20px;background:linear-gradient(100deg,rgba(201,164,92,.08),transparent 60%),#101923;align-items:center}
.modal.live-modal .modal-head h3{font-family:Oxanium,Inter,sans-serif;font-size:21px;letter-spacing:.3px}
.modal.live-modal .modal-head p{font-size:12px;line-height:1.45}
.modal.live-modal .modal-body{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:15px clamp(12px,1.7vw,25px)}
.modal.live-modal .modal-foot{flex:0 0 auto;background:#0c131b;padding:10px 18px;align-items:center}
.modal.live-modal .live-panel{gap:8px}
.live-broadcast-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(330px,.92fr);gap:13px;align-items:stretch;min-height:0}
.live-visual-column,.live-commentary-column{display:flex;flex-direction:column;gap:11px;min-width:0}
.live-fixed-scoreboard{position:sticky;top:-15px;z-index:8;background:rgba(9,15,22,.97);backdrop-filter:blur(12px);border:1px solid #324150;border-radius:14px;padding:7px;box-shadow:0 10px 24px rgba(0,0,0,.16)}
.live-fight-identity{grid-template-columns:minmax(0,1fr) minmax(105px,.38fr) minmax(0,1fr);gap:10px;padding:9px 12px;background:linear-gradient(100deg,rgba(240,68,86,.065),transparent 36%,transparent 64%,rgba(55,130,255,.065)),#0a1118}
.live-fight-name strong{font-size:clamp(12px,1.1vw,15px);line-height:1.25}
.live-fight-name span{font-size:11px;line-height:1.35}
.live-clock{font-size:clamp(32px,3.4vw,46px);letter-spacing:-1.8px}
.live-round-label{font-size:11px;margin-bottom:6px}
.live-progress{margin-top:8px}
.live-statusline{padding:5px 3px 0;font-size:11px}
.live-action-ribbon{position:relative;overflow:hidden;display:grid;gap:4px;padding:9px 12px;border:1px solid #354455;border-left:4px solid #8394a5;border-radius:12px;background:linear-gradient(105deg,rgba(255,255,255,.04),rgba(255,255,255,.012)),#111a24;box-shadow:0 8px 25px rgba(0,0,0,.14);min-width:0}
.live-action-ribbon[data-side="a"]{border-left-color:#f04456;background:linear-gradient(100deg,rgba(240,68,86,.105),transparent 68%),#101720}
.live-action-ribbon[data-side="b"]{border-left-color:#3987ff;background:linear-gradient(100deg,rgba(57,135,255,.105),transparent 68%),#101720}
.live-action-ribbon-head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:950;color:#aebdca}
.live-action-ribbon-clock{white-space:nowrap;color:#8d9dac;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.live-action-ribbon-main{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
.live-action-actor{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:950;min-width:0}
.live-action-actor.red{color:#ff8b9a}.live-action-actor.blue{color:#8cbbff}.live-action-actor.neutral{color:#d7e0e8}
.live-action-actor strong{color:#fff;overflow-wrap:anywhere}
.live-action-arrow{color:#8393a2;font-weight:900}
.live-action-name{font-size:clamp(13px,1.15vw,16px);font-weight:1000;letter-spacing:.15px;color:#fff}
.live-action-outcome{display:inline-flex;align-items:center;border:1px solid #425366;border-radius:6px;padding:4px 7px;font-size:9px;font-weight:950;letter-spacing:.7px;line-height:1.2}
.live-action-outcome.hit{color:#8af0bf;border-color:rgba(112,224,173,.35);background:rgba(112,224,173,.09)}
.live-action-outcome.miss{color:#c2cfdb;border-color:rgba(150,170,190,.28);background:rgba(150,170,190,.06)}
.live-action-outcome.position{color:#f1d58f;border-color:rgba(201,164,92,.32);background:rgba(201,164,92,.07)}
.live-action-detail{color:#bdcbd8;font-size:10.5px;line-height:1.38;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.live-live-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;min-width:0}
.live-live-stat{border:1px solid #2c3a49;background:#0e151e;border-radius:9px;padding:7px 9px;min-width:0}
.live-live-stat>span{display:block;font-size:9px;letter-spacing:.7px;font-weight:950;color:#95a6b6;line-height:1.3;margin-bottom:5px}
.live-live-stat-values{display:flex;justify-content:space-between;gap:5px;font-size:11px;font-weight:950;font-variant-numeric:tabular-nums}
.live-live-stat-values .red{color:#ff7484}.live-live-stat-values .blue{color:#83b5ff}
.live-live-stat-values b{white-space:nowrap}
.live-visual-column .live-silhouette-stage{min-height:0;height:auto;padding:13px 12px 11px}
.live-silhouette-stage:before{inset:12px 6% 12px}
.live-silhouette-card{grid-template-rows:auto clamp(160px,20vh,195px) auto;padding:6px 7px 4px}
.live-silhouette-wrap{height:clamp(160px,20vh,195px)}
.live-silhouette-name{font-size:clamp(10px,.95vw,13px)}
.live-damage-tile{padding:6px 3px}
.live-damage-tile b{font-size:9px}
.live-damage-tile span{font-size:11px}
/* The old badge sat across both bodies and hid the action instead of explaining it. */
.live-silhouette-stage .live-impact-flash{display:none!important}
.live-commentary-column{border:1px solid #2d3b4a;border-radius:13px;padding:12px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 40%),#0d141d;min-height:0}
.live-commentary-column .panel-head{margin:0 0 8px;padding:0 1px}
.live-commentary-column .panel-head h3{font-family:Oxanium,Inter,sans-serif;font-size:17px}
.live-commentary-column .panel-head p{font-size:11px;line-height:1.4}
.live-commentary-column .live-feed{max-height:min(56vh,610px);min-height:280px;flex:1;overflow:auto;padding:1px 4px 4px 1px;overscroll-behavior:contain}
.live-beat{grid-template-columns:64px minmax(0,1fr);gap:9px;padding:10px;border-radius:9px}
.live-beat p{font-size:12px;line-height:1.52}
.live-beat-actor{display:inline-block;margin:0 0 4px;padding:3px 6px;border-radius:5px;font-size:9px;font-weight:950;letter-spacing:.45px;text-transform:uppercase;background:rgba(255,255,255,.055);color:#c7d2dd}
.live-beat-actor.red{color:#ff8494;background:rgba(240,68,86,.1)}.live-beat-actor.blue{color:#84b5ff;background:rgba(55,130,255,.1)}
.live-coach-break{margin:0;gap:8px}
.live-coach-card{padding:11px}
.live-coach-card p{font-size:11px;line-height:1.5}
#liveFinalResult{scroll-margin-top:10px}.live-result-reason{font-size:12px;line-height:1.55;color:#e7d8b8;border-left:3px solid var(--orange);padding:7px 10px;background:rgba(201,164,92,.06);border-radius:0 7px 7px 0}
.live-final{margin:2px 0 1px;padding:15px;border-color:rgba(201,164,92,.42);background:linear-gradient(125deg,rgba(201,164,92,.1),transparent 70%),#101720;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.live-final-heading{padding:15px;background:rgba(5,9,14,.42)}
.live-final-heading h4{font-family:Oxanium,Inter,sans-serif;font-size:clamp(24px,3vw,38px);line-height:1.08;letter-spacing:-.4px;margin:9px 0 8px;color:#fff}
.live-final-heading>p{font-size:13px;line-height:1.55}
.live-final-heading>p strong{color:#f2d58f;font-size:14px}
.live-final .live-final-silhouettes{margin-top:2px}
.live-final .live-stat-table{min-width:440px}
.live-modal-status{font-size:11px;color:#9eafbe;margin-right:auto}
@media(max-width:1000px){.modal.live-modal{width:98vw;height:95vh;max-height:95vh}.live-broadcast-grid{grid-template-columns:minmax(0,1fr) minmax(300px,.95fr);gap:10px}.live-visual-column .live-silhouette-stage{min-height:0}.live-silhouette-card{grid-template-rows:auto clamp(150px,19vh,180px) auto}.live-silhouette-wrap{height:clamp(150px,19vh,180px)}.live-commentary-column .live-feed{min-height:240px;max-height:55vh}}
@media(max-width:780px){.modal.live-modal{width:100%;height:100dvh;max-height:100dvh;border-radius:0;border-left:0;border-right:0}.modal-backdrop:has(.modal.live-modal){padding:0}.modal.live-modal .modal-head{padding:11px 13px}.modal.live-modal .modal-body{padding:11px 10px}.modal.live-modal .modal-foot{padding:9px 12px}.live-broadcast-grid{grid-template-columns:1fr;gap:11px}.live-fixed-scoreboard{position:relative;top:auto}.live-fight-identity{grid-template-columns:minmax(0,1fr) minmax(80px,.38fr) minmax(0,1fr);gap:6px;padding:10px 5px}.live-fight-name strong{font-size:10px}.live-fight-name span{display:none}.live-fight-corner{font-size:8px;letter-spacing:.6px}.live-round-label{font-size:8px;letter-spacing:.4px;white-space:nowrap}.live-clock{font-size:31px}.live-clock-center{min-width:78px}.live-clock-hint{font-size:8px;line-height:1.2;letter-spacing:0}.live-action-ribbon{padding:10px}.live-action-name{font-size:13px}.live-live-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.live-silhouette-card{grid-template-rows:auto clamp(165px,22vh,205px) auto}.live-silhouette-wrap{height:clamp(165px,22vh,205px)}.live-commentary-column .live-feed{max-height:35vh;min-height:210px}.live-coach-break{grid-template-columns:1fr}.live-final-silhouettes{grid-template-columns:1fr 1fr}}
@media(max-width:420px){.live-action-ribbon-head{font-size:9px}.live-action-ribbon-main{gap:6px}.live-action-actor{font-size:10px}.live-action-name{font-size:12px}.live-live-stat{padding:7px}.live-live-stat-values{font-size:10px}.live-stage-heading strong{font-size:9px}.live-heat-legend{font-size:8px}.live-silhouette-card{padding:5px 4px}.live-damage-tile b{font-size:8px}}


/* ACL 2.1 — scorecards show round-by-round 10-9 / 10-8 scoring; browser TTS intentionally disabled. */
.decision-scoring-note{margin:0 0 8px;color:#91a2b3;font-size:10px;line-height:1.5}
.decision-scorecard-wrap{padding:2px 0 7px;border-top:1px solid rgba(255,255,255,.06)}
.decision-round-detail{margin:3px 0 0 78px;color:#aebdca;font-size:10px}
.decision-round-detail summary{cursor:pointer;color:#94a6b7;font-size:9px;font-weight:800;list-style:none}
.decision-round-detail summary::-webkit-details-marker{display:none}
.decision-round-detail summary:before{content:'＋ ';color:var(--orange2)}
.decision-round-detail[open] summary:before{content:'− '}
.decision-round-pills{display:flex;flex-wrap:wrap;gap:5px;margin:7px 0 3px}
.decision-round-pills span{padding:4px 6px;border:1px solid #354353;border-radius:6px;background:#0b1118;font-size:9px}
.decision-round-pills b{color:#f4f7fb;margin-left:3px;font-variant-numeric:tabular-nums}
.live-result-spotlight-scorecard{display:block!important}
.live-result-spotlight-scorecard-main{display:grid;grid-template-columns:minmax(0,1fr) 72px 72px minmax(0,1fr);gap:8px;align-items:center}
.live-result-spotlight-rounds{display:flex;flex-wrap:wrap;gap:5px;padding:7px 2px 0}
.live-result-spotlight-rounds span{display:inline-flex;align-items:center;gap:4px;padding:4px 6px;border:1px solid rgba(255,255,255,.1);border-radius:6px;background:rgba(0,0,0,.17);color:#a8b8c7;font-size:8px;font-weight:850}
.live-result-spotlight-rounds span b{color:#f3f6fa;font-size:9px;font-variant-numeric:tabular-nums}
.live-result-spotlight-rounds span.red{border-color:rgba(240,68,86,.28)}.live-result-spotlight-rounds span.blue{border-color:rgba(57,135,255,.28)}.live-result-spotlight-rounds span.draw{border-color:rgba(255,255,255,.12)}
@media(max-width:780px){.live-result-spotlight-scorecard-main{grid-template-columns:minmax(0,1fr) 50px 50px minmax(0,1fr);gap:5px}.decision-round-detail{margin-left:0}}
@media(max-width:380px){.live-result-spotlight-scorecard-main{grid-template-columns:minmax(0,1fr) 42px 42px minmax(0,1fr)}}


/* ACL Priority Update 2026: league hub, athlete profiles, and simulation audit */
.home-hub-intro{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(320px,.85fr);gap:18px;align-items:stretch;margin-bottom:18px}
.home-hub-copy{display:flex;flex-direction:column;justify-content:center;min-height:265px;padding:clamp(22px,3vw,38px);border:1px solid rgba(201,164,92,.34);background:radial-gradient(ellipse at 90% 0,rgba(201,164,92,.17),transparent 43%),linear-gradient(125deg,rgba(255,255,255,.018),transparent 62%),#0e131a;border-radius:13px;position:relative;overflow:hidden}
.home-hub-copy:after{content:'ACL';position:absolute;right:-9px;bottom:-48px;font:900 clamp(100px,15vw,190px)/1 Oxanium,Inter,sans-serif;font-style:italic;letter-spacing:-10px;color:rgba(201,164,92,.055);pointer-events:none}
.home-hub-copy h2{position:relative;z-index:1;font:800 clamp(32px,4vw,54px)/.98 Oxanium,Inter,sans-serif;letter-spacing:-1.9px;max-width:650px;margin:12px 0;color:#f4f0e8}
.home-hub-copy h2 em{color:var(--orange2);font-style:normal}
.home-hub-copy p{position:relative;z-index:1;color:#b6c0cb;max-width:540px;line-height:1.7;margin:0 0 18px}
.home-hub-copy .actions{position:relative;z-index:1}
.home-featured-event{border:1px solid #343a43;border-radius:13px;overflow:hidden;background:#10151c;display:flex;flex-direction:column;min-width:0}
.home-featured-event-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);font-size:10px;letter-spacing:1.2px;font-weight:950;text-transform:uppercase;color:var(--orange2)}
.home-featured-event-body{padding:17px;display:flex;flex-direction:column;gap:13px;flex:1}
.home-featured-event-body h3{font:800 clamp(20px,2vw,27px)/1.06 Oxanium,Inter,sans-serif;margin:0;color:#f4f0e8}
.home-featured-meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px}
.home-main-fight{border:1px solid rgba(201,164,92,.28);background:linear-gradient(115deg,rgba(201,164,92,.075),transparent 54%),#0b1016;border-radius:12px;padding:13px;margin-top:14px}
.home-main-fight-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
.home-main-fight-top strong{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--orange2)}
.home-matchup{display:grid;grid-template-columns:minmax(0,1fr) 35px minmax(0,1fr);gap:10px;align-items:center}
.home-fighter-link{display:flex;flex-direction:column;align-items:center;text-align:center;min-width:0;color:var(--text);background:transparent;border:0;padding:0;cursor:pointer}
.home-fighter-link:hover .home-fighter-name{color:var(--orange2)}
.home-fighter-img{width:100%;height:140px;display:block;object-fit:contain;object-position:center bottom;border-radius:7px;color:var(--orange2);font-size:30px;font-weight:950;background:linear-gradient(155deg,rgba(201,164,92,.12),rgba(6,10,15,.25));border:1px solid rgba(255,255,255,.075)}
.home-fighter-name{display:block;font-size:clamp(11px,1.15vw,14px);font-weight:900;line-height:1.3;margin-top:8px;overflow-wrap:anywhere;transition:color .15s}
.home-fighter-record{color:var(--muted);font-size:10px;margin-top:4px}
.home-matchup-vs{font:900 18px/1 Oxanium,Inter,sans-serif;color:var(--orange2);text-align:center}
.home-featured-event-empty{display:grid;place-items:center;min-height:190px;text-align:center;color:var(--muted);padding:20px;gap:8px}
.home-stat-label{font-size:9px;text-transform:uppercase;letter-spacing:1.2px;font-weight:900;color:var(--muted)}
.home-section-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:22px 0 11px}
.home-section-heading h3{margin:0;font:800 20px/1.1 Oxanium,Inter,sans-serif;color:#f0ece4}
.home-section-heading p{margin:5px 0 0;color:var(--muted);font-size:11px}
.home-result-row{cursor:pointer;transition:border-color .15s,background .15s}
.home-result-row:hover{border-color:rgba(201,164,92,.42);background:rgba(201,164,92,.045)}
.home-champion-row .belt-champ{cursor:pointer}
.fighter-profile-hero{display:grid;grid-template-columns:minmax(220px,.7fr) minmax(0,1.3fr);gap:22px;align-items:stretch;margin:14px 0 18px;padding:18px;border:1px solid rgba(201,164,92,.33);border-radius:14px;background:radial-gradient(ellipse at 75% 0,rgba(201,164,92,.13),transparent 40%),linear-gradient(140deg,#111821,#080c11)}
.fighter-profile-portrait-wrap{min-height:320px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative;border:1px solid rgba(201,164,92,.22);border-radius:10px;background:radial-gradient(ellipse at 50% 35%,rgba(201,164,92,.19),transparent 48%),linear-gradient(145deg,#202c39,#080d13)}
.fighter-profile-portrait{display:block;width:100%;height:100%;min-height:320px;max-height:430px;object-fit:contain;object-position:center bottom;color:var(--orange2);font-size:64px;font-weight:950}
.fighter-profile-summary{display:flex;flex-direction:column;justify-content:center;min-width:0;padding:8px 3px}
.fighter-profile-name{font:900 clamp(30px,4vw,50px)/.99 Oxanium,Inter,sans-serif;letter-spacing:-1.3px;margin:10px 0 5px;overflow-wrap:anywhere}
.fighter-profile-nick{font-size:14px;color:var(--orange2);font-weight:850}
.fighter-profile-record{font:900 clamp(35px,4vw,50px)/1 Oxanium,Inter,sans-serif;letter-spacing:-1px;margin:13px 0 4px}
.fighter-profile-record-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:900}
.fighter-profile-meta{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}

function divObj(id){return DIVISIONS.find(d=>d.id===id)||{id,label:id||'Sem divisão',weight:''}}

function dateObj(d){if(!d)return null;const x=new Date(d+'T12:00:00');return Number.isNaN(x.getTime())?null:x}
function fmtDate(d,opts={day:'2-digit',month:'short',year:'numeric'}){const x=dateObj(d);return x?new Intl.DateTimeFormat('pt-BR',opts).format(x):'Data a definir'}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}

function slotName(i,total=6){
 const n=Number(i)||0,t=Math.max(1,Number(total)||1);
 if(n===0)return 'Luta principal';
 if(n===1)return 'Co-main event';
 return n<Math.max(2,t-2)?'Card principal':'Card preliminar';
}
function cardSlotRank(f){
 const slot=String(f?.slot||'').toLowerCase();
 if(/prelim|preliminar/.test(slot))return 0;
 if(/card principal|main card/.test(slot))return 1;
 if(/co-main|co main/.test(slot))return 2;
 if(/luta principal|main event/.test(slot))return 3;
 return 1;
}
function orderedCardFights(e){
 return (e?.fights||[]).map((f,index)=>({f,index})).sort((aa,bb)=>{
  const a=aa.f,b=bb.f,rank=cardSlotRank(a)-cardSlotRank(b);
  if(rank)return rank;
  const titleRank=Number(!!a.title)-Number(!!b.title);
  if(titleRank)return titleRank;
  const explicit=(Number(a.cardOrder)||0)-(Number(b.cardOrder)||0);
  return explicit||aa.index-bb.index;
 }).map(x=>x.f);
}
function divisionFighters(div){return state.fighters.filter(f=>f.division===div)}
function sortedEvents(){return [...state.events].sort((a,b)=>(a.date||'9999-12-31').localeCompare(b.date||'9999-12-31')||(a.createdAt||0)-(b.createdAt||0))}
function eventDone(e){return !!e.fights?.length&&e.fights.every(f=>!!f.result)}
function eventResultsCount(e){return (e.fights||[]).filter(f=>!!f.result).length}
function statsFor(f){return f.stats||{striking:60,grappling:60,cardio:60,chin:60,technique:60,power:60}}
function recalculate(){
 const comp={};const points={};const stats={};const streak={};
 state.fighters.forEach(f=>{const b=f.baseRecord||{w:0,l:0,d:0};const acl=f.baseACLRecord||{w:0,l:0,d:0};const aclW=Math.max(0,Number(acl.w)||0),aclL=Math.max(0,Number(acl.l)||0),aclD=Math.max(0,Number(acl.d)||0);comp[f.id]={w:+b.w||0,l:+b.l||0,d:+b.d||0};points[f.id]=Number.isFinite(+f.basePoints)?+f.basePoints:40;stats[f.id]={fights:aclW+aclL+aclD,wins:aclW,losses:aclL,draws:aclD};streak[f.id]=f.baseACLStreak?{count:Math.max(0,Number(f.baseACLStreak.count)||0),type:['W','L','D'].includes(f.baseACLStreak.type)?f.baseACLStreak.type:''}:{count:0,type:''};});
 const champs={};Object.entries(state.initialChampions||{}).forEach(([d,id])=>{if(id&&byId(id))champs[d]=id;});
 for(const e of sortedEvents()){
  for(const fight of (e.fights||[])){
   if(!fight.result||!byId(fight.a)||!byId(fight.b))continue;
   const a=fight.a,b=fight.b,r=fight.result;if(!comp[a]||!comp[b])continue;
   stats[a].fights++;stats[b].fights++;
   if(r.winnerId===a||r.winnerId===b){const w=r.winnerId,l=w===a?b:a;comp[w].w++;comp[l].l++;stats[w].wins++;stats[l].losses++;
    const finish=/KO|TKO|Submission|Finalização/i.test(r.method||'');points[w]+=finish?8:6;points[l]-=finish?6:4;streak[w].count=streak[w].type==='W'?streak[w].count+1:1;streak[w].type='W';streak[l].count=streak[l].type==='L'?streak[l].count+1:1;streak[l].type='L';
    if(fight.title&&e.type==='numbered')champs[fight.division]=w;
   }else{comp[a].d++;comp[b].d++;stats[a].draws++;stats[b].draws++;points[a]+=1;points[b]+=1;streak[a]={count:0,type:'D'};streak[b]={count:0,type:'D'};}
  }
 }
 const ranking={};DIVISIONS.forEach(d=>{const fs=divisionFighters(d.id).filter(f=>f.ranked!==false||(stats[f.id]?.fights||0)>0).sort((a,b)=>{
  if(champs[d.id]===a.id&&champs[d.id]!==b.id)return -1;if(champs[d.id]===b.id&&champs[d.id]!==a.id)return 1;
  return (points[b.id]||0)-(points[a.id]||0)||(comp[b.id].w-comp[a.id].w)||(comp[a.id].l-comp[b.id].l)||fullName(a).localeCompare(fullName(b));
 });ranking[d.id]=fs;});
 return {records:comp,points,stats,streak,champions:champs,ranking};
}

async function hydrateServerAutomationRuntime(){
 if(!SERVER_AUTOMATION_ENABLED||!supabaseClient)return null;
 const {data,error}=await supabaseClient.from('acl_automation_runtime').select('payload,updated_at').eq('id',1).maybeSingle();
 if(error)throw error;
 const p=data?.payload;
 if(!p||p.source!=='acl-server-automation')return null;
 state.liveSimulation=Object.prototype.hasOwnProperty.call(p,'liveSimulation')?(p.liveSimulation?JSON.parse(JSON.stringify(p.liveSimulation)):null):state.liveSimulation;
 if(p.eventTransmission)state.eventTransmission=JSON.parse(JSON.stringify(p.eventTransmission));
 state.serverAutomation={enabled:true,source:'supabase-cron',active:!!p.active,status:p.status||'idle',eventId:p.eventId||null,currentFightId:p.eventTransmission?.currentFightId||null,updatedAt:p.updatedAt||data.updated_at||null};
 return p;
}

function syncPublicLivePolling(){

  if(publicLivePoller){clearInterval(publicLivePoller);publicLivePoller=null;}
  if(publicLiveUiTicker){clearInterval(publicLiveUiTicker);publicLiveUiTicker=null;}
  if(newsroomPoller){clearInterval(newsroomPoller);newsroomPoller=null;}
  return;
 }

 if(shouldPollNews&&!newsroomPoller)newsroomPoller=setInterval(()=>{if(!document.hidden&&activeView==='newsroom')loadMediaItems(true).then(()=>{if(activeView==='newsroom')render();}).catch(()=>{});},15000);

  liveBroadcastChannel=supabaseClient.channel('acl-live-public-sync',{config:{broadcast:{self:false}}});

async function refreshPublicSharedStateSilently(){
 if(!supabaseClient||!SUPABASE_CONFIGURED||(isAdmin&&!SERVER_AUTOMATION_ENABLED)||publicLivePollBusy)return;
 publicLivePollBusy=true;
 try{
  const {data,error}=await supabaseClient.from('acl_state').select('payload').eq('id',1).maybeSingle();
  if(error)throw error;
  if(!data?.payload)return;
  const oldLive=state.liveSimulation?{...state.liveSimulation,beats:[...(state.liveSimulation.beats||[])]}:null;
  const oldRun=state.eventTransmission?{...state.eventTransmission}:null;
  const oldResultSig=state.events.map(e=>`${e.id}:${eventResultsCount(e)}`).join('|');
  const payload=data.payload;
  state={...state,...payload,applications:isAdmin?(state.applications||[]):[]};
  state.fighters=Array.isArray(payload.fighters)?payload.fighters:[];

ir →</span></div></div>`).join('')}</div>`:`<div class="empty"><strong>Primeiro evento em preparação.</strong><p>O calendário será atualizado quando a direção publicar o card.</p></div>`}</div></div><div>${selected?`${live?`<div class="panel" style="border-color:rgba(255,75,87,.35)">${liveSimulationHTML(live)}</div>`:intermission?`${aclSponsorBroadcastStripHTML(e,live)}<div class="panel acl-intermission"><div class="live-kicker"><span class="live-dot"></span> ACL FIGHT LIVE · EVENTO EM ANDAMENTO</div><h3>Preparando o próximo combate...</h3><p class="muted">A próxima luta entra automaticamente em instantes. Não atualize a página: a transmissão será sincronizada sozinha.</p></div>`:''}<div class="panel"><div class="event-headline"><div><div class="actions"><span class="tag ${selected.type==='numbered'?'lime':'orange'}">${eventLabel(selected)}</span>${statusTag(selected)}</div><h3>${esc(selected.name)}</h3><div class="small-text muted">${esc(fmtDate(selected.date))} · ${esc(selected.venue||'Local a definir')}</div></div></div>${selected.notes?`<p class="muted">${esc(selected.notes)}</p>`:''}<div class="event-details-grid"><div class="detail-tile"><span>Lutas no card</span><strong>${selected.fights.length}</strong></div><div class="detail-tile"><span>Resultados</span><strong>${eventResultsCount(selected)} / ${selected.fights.length}</strong></div><div class="detail-tile"><span>Cinturões</span><strong>${selected.type==='fightnight'?'0 (bloqueado)':selected.fights.filter(f=>f.title).length+' em disputa'}</strong></div></div></div><div class="panel"><div class="panel-head"><div><h3>Card de lutas</h3><p>Relatos completos liberados após os resultados</p></div></div>${selected.fights.length?orderedCardFights(selected).map((f,i)=>renderPublicFightCard(selected,f,i,c)).join(''):`<div class="empty">Este card ainda não foi publicado por completo.</div>`}</div>`:`<div class="panel"><div class="empty"><strong>Nenhum evento publicado.</strong><p>Confira novamente em breve.</p></div> function renderPublicFightCard(e,f,i,c){return renderFightCard(e,f,i,c).replace(/<div class="fight-actions">[\s\S]*?<\/div>/,'');}
function renderPublicFighters(){const c=recalculate();const filtered=state.fighters.filter(f=>{const q=fighterSearch.toLowerCase();return (!q||[f.first,f.nick,f.last,f.origin,f.base,f.gym,(f.arts||[]).join(' '),divObj(f.division).label].join(' ').toLowerCase().includes(q))&&(fighterDivision==='all'||f.division===fighterDivision)}).sort((a,b)=>fullName(a).localeCompare(fullName(b)));return `<div class="page-head"><div><div class="eyebrow">Roster oficial / Los Santos</div><h2>Conheça os atletas</h2><p>Cartéis, academias, artes marciais e histórias dos nomes que movimentam a ACL.</p></div><div class="actions"><button class="btn primary" data-view="applications">Tentar entrar na ACL</button></div></div><div class="toolbar"><div class="field"><label for="fighterSearch">Buscar atleta</label><input id="fighterSearch" placeholder="Nome, apelido, academia, origem..." value="${esc(fighterSearch)}"></div><div class="field"><label for="fighterDivision">Divisão</label><select id="fighterDivision"><option value="all">Todas as divisões</option>${DIVISIONS.map(d=>`<option value="${d.id}" ${fighterDivision===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div><span class="tag grey">${filtered.length} atletas</span></div>${filtered.length?`<div class="grid fighters-grid">${filtered.map(f=>fighterCard(f,c).replace(/<div class="actions"><button class="btn small" data-action="edit-fighter"[\s\S]*?<\/div>/,'')).join('')}</div>`:`<div class="empty"><strong>Nenhum atleta encontrado.</strong><p>Altere a busca ou confira outra divisão.</p></div>`}`;}

function activityHTML(f,e,c){const a=byId(f.a),b=byId(f.b),r=f.result;if(!a||!b||!r)return '';const winner=r.winnerId?byId(r.winnerId):null;return `<div class="activity-row home-result-row" data-action="open-event" data-id="${esc(String(e.id))}" role="button" tabindex="0"><div><div style="font-size:12px;font-weight:850">${winner?`${esc(nameWithNick(winner))} <span class="muted">venceu</span>`:`${esc(nameWithNick(a))} <span class="muted">empatou com</span> ${esc(nameWithNick(b))}`}</div><div class="small-text muted">${esc(nameWithNick(a))} vs. ${esc(nameWithNick(b))} · ${esc(e.name)}</div><div class="small-text" style="color:var(--orange2);margin-top:4px">${esc(r.method||'Resultado registrado')}${r.round?' · Round '+r.round:''}${f.title?' · DISPUTA DE CINTURÃO':''}</div></div><span class="tag ${f.title?'lime':'grey'}">${f.title?'TÍTULO':'RESULTADO'} ↗</span></div>`;}

function renderEvents(){if(!isAdmin)return renderPublicEvents();const evts=[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));const selected=eventById(selectedEventId)||evts[0]||null;if(selected)selectedEventId=selected.id;
 const suggestion=suggestedType();return `<div class="page-head"><div><div class="eyebrow">Matchmaking / agenda</div><h2>Eventos & cards</h2><p>Dê um nome próprio a cada edição, gere confrontos automaticamente e edite qualquer parte do card depois de criado.</p></div><div class="actions"><span class="tag ${suggestion==='numbered'?'lime':'orange'}">Sugestão: ${suggestion==='numbered'?'ACL numerado':'Fight Night'}</span></div></div>
 <div class="event-layout"><div><div class="panel"><div class="panel-head"><div><h3>Nova edição</h3><p>O nome é obrigatório e nunca será repetido automaticamente.</p></div><span class="tag orange">NOVO CARD</span></div><form id="createEventForm"><div class="form-grid"><div class="field full"><label for="newEventName">Nome do evento *</label><input id="newEventName" name="name" required maxlength="90" placeholder="Ex.: Noite de Acerto de Contas"></div><div class="field"><label for="newEventType">Formato *</label><select id="newEventType" name="type"><option value="fightnight" ${suggestion==='fightnight'?'selected':''}>Fight Night — sem cinturão</option><option value="numbered" ${suggestion==='numbered'?'selected':''}>Evento numerado ACL — títulos permitidos</option></select></div><div class="field"><label for="newEventDate">Data do evento</label><input id="newEventDate" name="date" type="date" value="${todayISO()}"></div><div class="field"><label for="newEventScheduledAt">Agendar início automático</label><input id="newEventScheduledAt" name="scheduledAt" type="datetime-local"><small class="muted">${SERVER_AUTOMATION_ENABLED?'O servidor inicia automaticamente no horário, mesmo com o site fechado.':'Para iniciar sem deixar o site aberto, habilite a automação de servidor da ACL.'}</small></div><div class="field full"><label for="newEventVenue">Local / arena</label><input id="newEventVenue" name="venue" value="Maze Bank Arena, Los Santos" maxlength="100"></div><div class="field"><label for="newFightCount">Quantidade de lutas</label><select id="newFightCount" name="fightCount"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></div><div class="field" id="titleCountWrap"><label for="newTitleCount">Disputas de cinturão</label><select id="newTitleCount" name="titleCount" ${suggestion!=='numbered'?'disabled':''}><option value="0">Nenhuma</option><option value="1" ${suggestion==='numbered'?'selected':''}>1 — luta principal</option><option value="2">2 — card especial</option></select></div><div class="field full"><label for="newEventNotes">Contexto / gancho editorial (opcional)</label><textarea id="newEventNotes" name="notes" rows="3" placeholder="Ex.: dois prospectos disputam espaço no ranking; o campeão pediu um adversário que ainda não enfrentou."></textarea></div></div><div id="typeWarning" class="helper" style="margin-top:13px">Fight Night: nenhum cinturão pode ser colocado em jogo. O evento numerado é o formato para disputas de título.</div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">＋ Criar evento e montar card</button><button class="btn" type="button" data-action="create-empty-event">Criar vazio</button></div></form></div><div class="notice">A numeração do tipo é gerada separadamente (Fight Night #01, ACL #01 etc.). O nome que você digitar vira o título editorial do evento. Apagar uma edição não apaga outras nem reaproveita o número.</div>

 <div>${selected?renderEventDetail(selected):`<div class="panel"><div class="empty"><strong>Selecione ou crie um evento.</strong><p>O editor completo do card aparecerá aqui.</p></div></div>`}</div></div>`;

function renderAddFightForm(e){const used=new Set((e.fights||[]).flatMap(f=>[f.a,f.b]));const firstDiv=DIVISIONS.find(d=>divisionFighters(d.id).filter(f=>!used.has(f.id)).length>=2)?.id||DIVISIONS[0].id;const options=DIVISIONS.map(d=>`<option value="${d.id}" ${d.id===firstDiv?'selected':''}>${esc(d.label)}</option>`).join('');const available=divisionFighters(firstDiv).filter(f=>!used.has(f.id));return `<form id="addFightForm" data-event-id="${e.id}"><div class="form-grid three"><div class="field"><label>Divisão</label><select name="division" id="addFightDivision">${options}</select></div><div class="field"><label>Atleta A</label><select name="a" id="addFightA">${available.map((f,i)=>`<option value="${f.id}">${esc(fullName(f))}${i===0?' · topo do ranking':''}</option>`).join('')}</select></div><div class="field"><label>Atleta B</label><select name="b" id="addFightB">${available.slice(1).concat(available.slice(0,1)).map((f,i)=>`<option value="${f.id}" ${i===0?'selected':''}>${esc(fullName(f))}</option>`).join('')}</select></div><div class="field full"><label>Gancho editorial da luta (opcional)</label><input name="story" maxlength="300" placeholder="Ex.: o vencedor pode entrar no top 5 da divisão"></div><div class="field full"><label class="checkline"><input type="checkbox" name="title" ${e.type!=='numbered'?'disabled':''}> Disputa de cinturão ${e.type!=='numbered'?'(bloqueada em Fight Night)':''}</label></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" type="submit">＋ Adicionar luta</button><button class="btn" type="button" data-action="generate-more-fights" data-id="${e.id}">Gerar lutas até completar 6</button></div></form>`;}
function renderEventDetail(e){const c=recalculate();const titleFights=(e.fights||[]).filter(f=>f.title).length;const currentLive=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)?state.liveSimulation:null;const liveCtx=currentLive?liveFightContext(currentLive):null;const liveRecoveryNotice=currentLive?`<div class="notice" style="margin-bottom:14px;border-color:rgba(255,104,122,.4)"><strong>Transmissão registrada como ativa${liveCtx?.f?`: ${esc(fullName(byId(liveCtx.f.a)))} vs. ${esc(fullName(byId(liveCtx.f.b)))}`:''}.</strong> Se não há luta ocorrendo, libere o registro antigo para não bloquear o evento. <button class="btn danger small" data-action="clear-live-simulation">Liberar transmissão travada</button></div>`:'';const run=state.eventTransmission&&state.eventTransmission.eventId===e.id?state.eventTransmission:null;const runActive=run&&['running','intermission'].includes(run.status);const runSequenceCopy=SERVER_AUTOMATION_ENABLED?'O servidor continua trabalhando com o site fechado.':'Mantenha a aba administrativa aberta nesta versão.';const runNotice=runActive?`<div class="notice" style="margin-bottom:14px;border-color:rgba(201,164,92,.45)"><strong>📡 Evento em transmissão automática.</strong> ${run.status==='intermission'?'Intervalo rápido: o próximo combate começará automaticamente.':'A sequência do card está ativa; as próximas lutas iniciam sozinhas. '+runSequenceCopy} <span class="small-text muted">${(e.fights||[]).filter(x=>x.result).length}/${e.fights.length} resultados registrados.</span><button class="btn danger small" data-action="cancel-event-transmission">Cancelar evento</button></div>`:run&&run.status==='finished'?`<div class="notice" style="margin-bottom:14px;border-color:rgba(112,224,173,.35)"><strong>✓ Transmissão do evento concluída.</strong> Todas as lutas foram finalizadas e os resultados foram gravados.</div>`:'';return `${liveRecoveryNotice}${runNotice}<div class="panel"><div class="event-headline"><div><div clas function renderSimulationAudit(e,f){
 const r=f?.result;if(!r)return '';const audit=r.simulationAudit||null;const manual=audit?.source==='admin-manual';const live=audit?.source==='live-transmission';const sourceLabel=manual?'Resultado manual/admin':live?'ACL Fight Live · motor ao vivo':audit?.source==='automated-simulation'?'Motor automático offline':'Registro histórico';
 const roundScores=Array.isArray(r.roundScores)?r.roundScores:[];const a=byId(f.a),b=byId(f.b);const cards=Array.isArray(r.judgeScorecards)?r.judgeScorecards:(!manual&&isJudgesDecision(r)&&roundScores.length?buildJudgeScorecards(f,r):[]);
 const rows=roundScores.length?`<div class="table-wrap"><table class="audit-rounds"><thead><tr><th>Round</th><th>Canto vermelho</th><th>Canto azul</th><th>Diferença</th></tr></thead><tbody>${roundScores.map(row=>{const av=Number(row.a)||0,bv=Number(row.b)||0;return `<tr><td><strong>${Number(row.round)||'—'}</strong></td><td>${av.toFixed(2)}</td><td>${bv.toFixed(2)}</td><td>${(av-bv>=0?'+':'')+(av-bv).toFixed(2)}</td></tr>`;}).join('')}</tbody></table></div><p class="live-rule-note" style="margin-top:7px">Estes são os indicadores internos de desempenho acumulados pelo motor; não são os pontos 10–9/10–8 dos cartões oficiais. A pontuação oficial de cada juiz aparece abaixo, quando existe.</p>`:`<div class="notice">${manual?'Como este resultado foi definido manualmente, não existe registro de ações internas do motor para auditar.':'Este registro não contém pontuação interna round a round. O resultado histórico é exibido sem inventar dados ausentes.'}</div>`;
 const damage=audit?.damageAtFinish||r.damageMap||null,energy=audit?.staminaAtFinish||r.combatState?.stamina||null;
 const damagePct=(side)=>{const d=damage?.[side];if(!d)return null;return Object.values(d).filter(v=>Number.isFinite(Number(v))).reduce((sum,v)=>sum+Number(v),0);};
 const snap=damage?`<div class="audit-snapshot">${[['Dano recebido · vermelho',damagePct('a')],['Dano recebido · azul',damagePct('b')],['Resistência final · vermelho',energy?.a],['Resistência final · azul',energy?.b]].map(([lab,val])=>`<div class="audit-snapshot-item"><span>${lab}</span><b>${val===null||val===undefined?'—':`${Math.round(Number(val))}${String(lab).startsWith('Resistência')?'%':' pts'}`}</b></div>`).join('')}</div>`:'';
 let narrative='';if(manual)narrative='O resultado foi inserido/ajustado manualmente por um administrador. Ele altera o cartel e a classificação, mas fica identificado como ajuste oficial da direção.';else if(live)narrative=`Resultado produzido pela transmissão ao vivo. Foram arquivados ${roundScores.length} registro(s) de desempenho por round e ${Array.isArray(r.liveTranscript)?r.liveTranscript.length:0} entradas de transmissão. ${r.finishClock?`Tempo final registrado: ${r.finishClock}.`:''}`;else if(audit?.source==='automated-simulation')narrative=`Resultado produzido pelo motor automático, versão ${audit.version||r.engineVersion||'não informada'}. O motor acumulou sinais de desempenho durante ${audit.roundsSimulated||roundScores.length} round(s); a decisão, se houver, é calculada somando os cartões individuais. ${audit.finishRound?`Round do encerramento: ${audit.finishRound}.`:''}`;else narrative='Resultado histórico: o arquivo disponível não traz todas as medições internas do combate. A interface mostra somente os dados que realmente foram armazenados.';
 const cardHtml=cards.length?judgeScorecardsHTML({...r,judgeScorecards:cards}):'';
 return `<details class="simulation-audit"><summary><span>🔎 Auditoria do resultado e do motor</span><span class="tag ${audit?'lime':'grey'}">${esc(sourceLabel)}</span></summary><div class="simulation-audit-body"><div class="audit-source"><span class="tag ${manual?'orange':'lime'}">${esc(sourceLabel)}</span>${audit?.version?`<span class="tag grey">Motor v${Number(audit.version)}</span>`:''}<span class="tag grey">${roundScores.length} round(s) registrados</span>${r.round?`<span class="tag grey">Resultado no round ${Number(r.round)}</span>`:''}</div><div class="audit-note">${esc(narrative)}</div><div class="report-section-title">Indicadores registrados por round</div>${rows}${snap?`<div class="report-section-title">Snapshot no encerramento</div>${snap}`:''}${cardHtml?`<div class="report-section-title">Cartões individuais somados</div>${cardHtml}`:''}${r.note?`<div class="report-section-title">Nota registrada pelo motor</div><p class="report-copy-block">${esc(r.note)}</p>`:''}<div class="report-section-title">Proveniência</div><p class="live-rule-note">Evento: ${esc(e?.name||'Evento não identificado')} · Luta: ${esc(nameWithNick(a))} vs. ${esc(nameWithNick(b))} · Resultado: ${esc(r.method||'não informado')}${audit?.createdAt?` · Gerado em ${esc(new Date(audit.createdAt).toLocaleString('pt-BR'))}`:''}. A tela não sintetiza registros internos quando eles não foram guardados na época do combate.</p></div></details>`;
}
function renderFightCard(e,f,i,c){const a=byId(f.a),b=byId(f.b);if(!a||!b)return '';const facingCompatible=photoDirectionValue(a)==='right'&&photoDirectionValue(b)==='left';const r=f.result;const winner=r?.winnerId?byId(r.winnerId):null;const live=state.liveSimulation;const thisLive=!!live&&String(live.eventId)===String(e.id)&&String(live.fightId)===String(f.id)&&['running','paused'].includes(live.status);const transmission=state.eventTransmission&&String(state.eventTransmission.eventId)===String(e.id)&&['running','intermission'].includes(state.eventTransmission.status);const liveButton=thisLive?`<button class="btn primary small" data-action="open-live-simulation">● Abrir transmissão ao vivo</button>`:'';const pendingText=!r?(transmission?`<div class="fight-result pending">📡 Evento em transmissão automática — aguardando a chamada desta luta.</div>`:`<div class="fight-result pending">⏳ Resultado pendente — inicie o evento inteiro para começar a transmissão automática.</div>`):'';return `<div class="fight-card"><div class="fight-top"><div><div class="fight-slot">${esc(f.slot||slotName(i,e.fights.length))} · ${esc(divObj(f.division).label)} · ${f.rounds||3} rounds de 1 min</div><div class="fighter-meta"><span class="tag ${f.title?'lime':'grey'}">${f.title?'♛ DISPUTA DE CINTURÃO':'LUTA CASADA'}</span>${f.title&&e.type!=='numbered'?'<span class="tag red">FORMATO INVÁLIDO</span>':''}${thisLive?'<span class="tag red">TRANSMISSÃO AO VIVO</span>':''}</div></div><span class="small-text muted">${String(i+1).padStart(2,'0')}</span></div><div class="fighters-vs ${facingCompatible?'natural-faceoff':'adaptive-split'}"><div class="fighter-side">${fighterPortraitMarkup(a,'fight-portrait')}<div class="fighter-name">${esc(nameWithNick(a))}</div><div class="fighter-record">${recordText(c.records[a.id])} · ${esc(a.base||a.origin)}</div></div><div class="vs">VS</div><div class="fighter-side right">${fighterPortraitMarkup(b,'fight-portrait')}<div class="fighter-name">${esc(nameWithNick(b) function renderRankings(){
 const c=recalculate();const divs=rankDivision==='all'?DIVISIONS:DIVISIONS.filter(d=>d.id===rankDivision);
 return `<div class="page-head"><div><div class="eyebrow">Competitive landscape / standings</div><h2>Rankings & cinturões</h2><p>Cada divisão segue o formato UFC: campeão separado e posições numeradas de #1 a #15. O elenco extra fica abaixo, sem ranking oficial; atletas fora do top 15 ainda podem ter lutas registradas na ACL.</p></div><div class="actions"><span class="tag lime">Campeão + Top 15</span></div></div><div class="toolbar"><div class="field"><label for="rankDivision">Filtrar divisão</label><select id="rankDivision"><option value="all">Todas as divisões</option>${DIVISIONS.map(d=>`<option value="${d.id}" ${rankDivision===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div><span class="tag grey">Pontos dinâmicos</span></div><div class="grid rank-layout">${divs.map(d=>{
  const full=c.ranking[d.id]||[],champId=c.champions[d.id],champ=champId?byId(champId):null;
  const contenders=full.filter(f=>String(f.id)!==String(champId||'')).slice(0,15);
  const displayed=[...(champ?[champ]:[]),...contenders];const visibleIds=new Set(displayed.map(f=>String(f.id)));

 }).join('')}</div><div class="notice">Cada divisão exibe no máximo 15 desafiantes numerados, além do campeão. Os demais atletas permanecem no elenco; registros-base de lutas ACL anteriores ao arquivo detalhado contam para a experiência, mas não são apresentados como eventos completos inventados. Rankings e cinturões continuam sendo recalculados a partir dos pontos-base e dos resultados oficiais registrados.</div>`;

function pickPromoEvent(){let e=eventById(promoEventId);if(e)return e;const upcoming=state.events.filter(x=>!eventDone(x)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return upcoming[0]||[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||null;}
function promoContent(e){if(!e)return 'APEX COMBAT LEAGUE\n\nAinda não há evento cadastrado. Crie um evento e monte seu card para gerar a divulgação.';const c=recalculate();const f=e.fights||[];const head=f.find(x=>/luta principal|main event/i.test(String(x.slot||''))&&!/co-main/i.test(String(x.slot||'')))||f[f.length-1];const a=head?byId(head.a):null,b=head?byId(head.b):null;const lines=[];lines.push(`🥊 APEX COMBAT LEAGUE — ${eventLabel(e)}: ${e.name}`);lines.push(`📅 ${fmtDate(e.date,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})} | 📍 ${e.venue||'Los Santos, San Andreas'}`);lines.push('');lines.push(e.type==='fightnight'?'LOS SANTOS, É NOITE DE RANKING. Sem cinturões em disputa: cada vitória muda a conversa, cada derrota aperta o caminho até o topo.':'LOS SANTOS RECEBE UM EVENTO NUMERADO. A ACL reservou o cage para confrontos de alto impacto e disputas de título selecionadas.');lines.push('');if(head){lines.push(`🔥 LUTA PRINCIPAL — ${nameWithNick(a)} (${recordText(c.records[a.id])}) vs. ${nameWithNick(b)} (${recordText(c.records[b.id])})`);lines.push(`${divObj(head.division).label}${head.title?' · CINTURÃO EM JOGO':''}`);lines.push('');}lines.push('CARD CONFIRMADO');f.forEach((fight,i)=>{const fa=byId(fight.a),fb=byId(fight.b);if(!fa||!fb)return;const match=`${i+1}. ${nameWithNick(fa)} vs. ${nameWithNick(fb)} — ${divObj(fight.division).label}${fight.title?' [DISPUTA DE CINTURÃO]':''}`;lines.push(match);if(fight.story)lines.push(`   Gancho: ${fight.story}`);});if(e.notes){lines.push('');lines.push('O QUE ESTÁ EM JOGO');lines.push(e.notes);}const titleCount=f.filter(x=>x.title).length;if(e.type==='fightnight'){lines.push('');lines.push('📊 Sem disputas de cinturão nesta edição. O foco é ranking, prospectos e definição dos próximos desafiantes.');}else if(titleCount){lines.push('');lines.push(`🏆 ${titleCount} disputa(s) de cinturão confirmada(s). Não são todos os títulos da ACL — apenas as divisões selecionadas para este card.`);}return lines.join('\n');}
function renderPromo(){

function aclSafeHttpUrl(value){const raw=String(value||'').trim();if(!raw)return '';try{const u=new URL(raw);return ['http:','https:'].includes(u.protocol)?u.href:'';}catch{return '';}}

 const raw=String(value||'').trim();

 return aclSafeHttpUrl(raw);
}

async function saveACLInstitutionalCategory(form,rename=false){
 if(!isAdmin){toast('Entre como administrador para gerenciar categorias.');return;}
 const data=new FormData(form),oldName=String(data.get('oldName')||'').trim(),name=String(rename?data.get('newName'):data.get('categoryName')||'').trim();
 if(!name){toast('Informe um nome para a categoria.');return;}
 if(name.length>60){toast('Use no máximo 60 caracteres no nome da categoria.');return;}
 const categories=aclGetInstitutionalCategories();
 const duplicate=categories.some(category=>category.toLocaleLowerCase('pt-BR')===name.toLocaleLowerCase('pt-BR')&&(!rename||category!==oldName));
 if(duplicate){toast('Já existe uma categoria com esse nome.');return;}
 if(rename){
  if(!oldName||!categories.includes(oldName)){toast('A categoria que você tentou renomear não foi encontrada.');return;}
  state.aclInstitutionalCategories=categories.map(category=>category===oldName?name:category);
  (state.aclHistory||[]).forEach(item=>{if(isACLInstitutionalHistoryItem(item)&&String(item.category||'')===oldName){item.category=name;item.updatedAt=Date.now();}});
  editingInstitutionalCategory=null;
 }else{
  state.aclInstitutionalCategories=[...categories,name];
 }
 const result=await saveState();
 if(result?.ok){render();toast(rename?'Categoria renomeada e seções atualizadas.':'Categoria institucional adicionada ao seletor de Quem Somos.');}
}

function aclSortHistory(items){const order=['Nossa história','Quem somos','Missão e valores','Liderança','Estrutura da organização','Compromisso com o esporte','Outra informação institucional'];return [...items].sort((a,b)=>{const ca=order.indexOf(String(a.category||'')),cb=order.indexOf(String(b.category||''));const ra=ca<0?999:ca,rb=cb<0?999:cb;return ra-rb||(Number(a.createdAt)||0)-(Number(b.createdAt)||0);});}
async function optimizeACLContentImage(file,scope='history'){
 if(!file||!String(file.type||'').startsWith('image/'))throw new Error('Selecione um arquivo de imagem válido.');
 if(file.size>12*1024*1024)throw new Error('A imagem precisa ter no máximo 12 MB antes da otimização.');
 const objectUrl=URL.createObjectURL(file);
 try{
  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Não foi possível abrir essa imagem. Use JPG, PNG ou WebP.'));img.src=objectUrl;});
  let maxW=scope==='sponsor'?1000:900,maxH=scope==='sponsor'?620:1000;
  const scale=Math.min(1,maxW/image.naturalWidth,maxH/image.naturalHeight);
  let width=Math.max(1,Math.round(image.naturalWidth*scale)),height=Math.max(1,Math.round(image.naturalHeight*scale));
  const preserveAlpha=['image/png','image/webp','image/avif','image/gif'].includes(String(file.type).toLowerCase());
  for(let attempt=0;attempt<4;attempt++){
   const canvas=document.createElement('canvas');canvas.width=width;canvas.height=height;
   const ctx=canvas.getContext('2d');if(!ctx)throw new Error('Não foi possível preparar a imagem neste navegador.');
   if(!preserveAlpha){ctx.fillStyle='#10141a';ctx.fillRect(0,0,width,height);}ctx.drawImage(image,0,0,width,height);
   let blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/webp',attempt===0?.84:attempt===1?.76:.66));
   if(!blob||!blob.type.includes('webp'))blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',attempt===0?.84:attempt===1?.76:.66));
   if(!blob)throw new Error('Não foi possível otimizar a imagem.');
   if(blob.size<=500*1024||attempt===3)return {blob,mime:blob.type,ext:blob.type.includes('webp')?'webp':'jpg'};
   width=Math.max(1,Math.round(width*.82));height=Math.max(1,Math.round(height*.82));
  }
  throw new Error('Não foi possível otimizar a imagem.');
 }finally{URL.revokeObjectURL(objectUrl);}
}
async function uploadACLContentImage(file,scope='history',recordId='item'){
 const optimized=await optimizeACLContentImage(file,scope);
 if(SUPABASE_CONFIGURED){
  if(!supabaseClient||!isAdmin||!cloudLoaded)throw new Error('A conexão administrativa ainda não está pronta. Entre novamente e tente o envio.');
  const safeScope=String(scope||'content').replace(/[^a-zA-Z0-9_-]/g,'_');
  const safeId=String(recordId||uid('content')).replace(/[^a-zA-Z0-9_-]/g,'_');
  const path=`fighters/content_${safeScope}_${safeId}.${optimized.ext}`;
  const {error}=await supabaseClient.storage.from('acl-fighter-photos').upload(path,optimized.blob,{contentType:optimized.mime,upsert:true,cacheControl:'3600'});
  if(error)throw new Error(`Não foi possível enviar a imagem ao armazenamento da ACL: ${error.message}. Confira as permissões do bucket acl-fighter-photos.`);
  const {data}=supabaseClient.storage.from('acl-fighter-photos').getPublicUrl(path);
  if(!data?.publicUrl)throw new Error('O armazenamento não devolveu uma URL pública para a imagem.');
  return `${data.publicUrl}${data.publicUrl.includes('?')?'&':'?'}v=${Date.now()}`;
 }
 if(optimized.blob.size>650*1024)throw new Error('A imagem ficou grande para o armazenamento local. Escolha uma imagem menor ou use uma URL pública.');

function selectedMediaContext(form){

 const value=name=>String(d.get(name)||'').trim();
 const type=value('contentType')||'event-preview';
 const eventId=value('eventId');

 const fighterAId=value('fighterAId');
 const fighterBId=value('fighterBId');
 let event=eventId?state.events.find(x=>String(x.id)===eventId)||null:null;
 if(eventId&&!event)throw new Error('O evento selecionado não foi encontrado. Atualize o Media Center e selecione o evento novamente.');
 let fight=null;
 if(fightId){
  const ownerEvent=state.events.find(x=>(x.fights||[]).some(y=>String(y.id)===fightId))||null;
  if(!ownerEvent)throw new Error('O confronto selecionado não foi encontrado. Selecione o evento e o confronto novamente.');
  if(event&&String(event.id)!==String(ownerEvent.id))throw new Error('O confronto não pertence ao evento selecionado. Escolha o evento e a luta novamente.');

  fight=(ownerEvent.fights||[]).find(y=>String(y.id)===fightId)||null;
 }
 let fighterA=fighterAId?byId(fighterAId):null;
 let fighterB=fighterBId?byId(fighterBId):null;
 if(fighterAId&&!fighterA)throw new Error('O atleta principal selecionado não foi encontrado. Atualize a página e tente novamente.');

 // Para materiais/resultados de luta, a dupla oficial vem do confronto escolhido,

 if(fight&&['result-poster','fight-result'].includes(type)){
  fighterA=byId(fight.a)||null;

 }else if(fight){
  if(!fighterA)fighterA=byId(fight.a)||null;

 }
 return {d,event,fight,fighterA,fighterB};
}

async function optimizeFighterPhoto(file){

  const image=await new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('Não consegui abrir essa imagem. Use JPG, PNG ou WebP.'));img.src=objectUrl;});

  ctx.drawImage(image,0,0,canvas.width,canvas.height);

async function handleFighterSave(form){
 if(!form||fighterSaveBusy)return;
 if(typeof form.reportValidity==='function'&&!form.reportValidity())return;
 fighterSaveBusy=true;
 const button=$('fighterSaveButton');
 if(button){button.disabled=true;button.textContent='Salvando…';}
 try{
  await saveFighterForm(form);
 }catch(err){
  console.error('[ACL EDIT] Erro inesperado no formulário de atleta',err);
  const box=$('fighterSaveError');
  const detail=[err?.message,err?.code,err?.details,err?.hint].filter(Boolean).join(' · ')||'erro inesperado';
  const msg=`Erro inesperado ao salvar o atleta: ${detail}`;
  if(box){box.textContent=msg;box.style.display='block';}
  toast(msg);setStatus('! Atleta não salvo','red');
 }finally{
  fighterSaveBusy=false;
  const currentButton=$('fighterSaveButton');
  if(currentButton){currentButton.disabled=false;currentButton.textContent='Salvar atleta';}
 }
}
async function diagnoseFighterSave(){
 const box=$('fighterSaveError');
 const show=(msg,ok=false)=>{if(box){box.textContent=msg;box.style.display='block';box.style.borderColor=ok?'var(--line)':'var(--red)';}toast(msg);};
 try{
  if(!SUPABASE_CONFIGURED)throw new Error('Este site não reconhece uma configuração válida do Supabase. Confira config.js.');
  if(!supabaseClient)throw new Error('O cliente Supabase não foi inicializado. Recarregue a página e veja se há erro de conexão no console.');
  const {data:sessionData,error:sessionError}=await supabaseClient.auth.getSession();
  if(sessionError)throw new Error(`Sessão Supabase: ${sessionError.message}`);
  const userId=sessionData?.session?.user?.id;
  if(!userId)throw new Error('Não existe uma sessão autenticada ativa. Saia e entre novamente como administradora.');
  const {data:adminRow,error:adminError}=await supabaseClient.from('acl_admins').select('user_id').eq('user_id',userId).maybeSingle();
  if(adminError)throw new Error(`Consulta à lista de administradores (acl_admins): ${adminError.message}`);
  if(!adminRow)throw new Error('Sua sessão está ativa, mas o usuário não consta em public.acl_admins.');
  const {data:row,error:readError}=await supabaseClient.from('acl_state').select('id,payload,updated_at').eq('id',1).maybeSingle();
  if(readError)throw new Error(`Leitura de acl_state: ${readError.message}`);
  if(!row?.payload)throw new Error('A linha acl_state id=1 não existe ou não contém payload.');
  let method='UPDATE RLS';
  const {data:updated,error:updateError}=await supabaseClient.from('acl_state').update({updated_at:new Date().toISOString()}).eq('id',1).select('id,updated_at').maybeSingle();
  if(updateError||!updated?.id){
   const why=updateError?.message||'UPDATE não alterou nenhuma linha (RLS ou grants)';
   const {data:rpcData,error:rpcError}=await supabaseClient.rpc('acl_save_state',{p_payload:row.payload});
   if(rpcError)throw new Error(`Escrita direta falhou: ${why}. RPC acl_save_state também falhou: ${rpcError.message}`);
   if(rpcData!==true&&rpcData!=='true')throw new Error(`RPC não confirmou a gravação: ${String(rpcData)}`);
   method='RPC acl_save_state';
  }
  const {data:verify,error:verifyError}=await supabaseClient.from('acl_state').select('id,updated_at,payload').eq('id',1).single();
  if(verifyError)throw new Error(`Leitura de confirmação após gravar: ${verifyError.message}`);
  if(!Array.isArray(verify?.payload?.fighters))throw new Error('A gravação respondeu, mas o payload não contém a lista de lutadores.');
  const msg=`Diagnóstico OK: login de admin, leitura e escrita confirmados (${method}). ${verify.payload.fighters.length} lutadores encontrados.`;
  show(msg,true);console.info('[ACL SAVE DIAGNOSTIC]',{userId,method,fighters:verify.payload.fighters.length,updatedAt:verify.updated_at});
 }catch(err){
  console.error('[ACL SAVE DIAGNOSTIC] Falhou',err);
  const detail=[err?.message,err?.code,err?.details,err?.hint].filter(Boolean).join(' · ')||'erro sem detalhes';
  show(`Diagnóstico falhou: ${detail}`);setStatus('! Falha na conexão de salvamento','red');
 }
}

}

function importJSONFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(String(reader.result||''));if(!incoming||!Array.isArray(incoming.fighters)||!Array.isArray(incoming.events)||!incoming.initialChampions)throw new Error('Arquivo não parece ser um backup ACL.');const importedMedia=Array.isArray(incoming.mediaCenterItems)?incoming.mediaCenterItems:[];delete incoming.mediaCenterItems;incoming.applications=Array.isArray(incoming.applications)?incoming.applications:[];incoming.liveSimulation=incoming.liveSimulation||null;incoming.eventTransmission=incoming.eventTransmission||null;incoming.counters=incoming.counters||{numbered:0,fightnight:0,totalCreated:incoming.events.length};incoming.events.forEach(e=>{if(!Array.isArray(e.fights))e.fights=[];if(!e.number)e.number=1;e.fights.forEach(f=>{if(!f.id)f.id=uid('fight');if(!('result'in f))f.result=null;});});incoming.aclHistory=Array.isArray(incoming.aclHistory)?incoming.aclHistory:[];incoming.sponsors=Array.isArray(incoming.sponsors)?incoming.sponsors:[];state=incoming;normalizeState();backfillFightReports();selectedEventId=null;promoEventId='';promoText='';(async()=>{if(isAdmin)await syncLegacyApplications(state.applications);saveState();await cloudSaveQueue;if(isAdmin)await loadApplicationsFromCloud();if(isAdmin&&importedMedia.length){try{await importMediaBackup(importedMedia);}catch(err){console.error(err);toast('Temporada restaurada, mas não foi possível restaurar todos os conteúdos editoriais.');}}render();toast('Backup importado. Elenco, eventos e histórico restaurados.');})();}catch(err){console.error(err);alert('Não foi possível importar esse arquivo. Confirme se selecionou um backup JSON da ACL.');}};reader.readAsText(file);}
async function mergeSeedRoster(){const seed=makeSeed();const existing=new Set(state.fighters.map(f=>String(f.id)));const names=new Set(state.fighters.map(f=>`${f.first}|${f.last}|${f.division}`.toLowerCase()));let add=0,rankedAdd=0,prospectAdd=0;seed.fighters.forEach(f=>{const key=`${f.first}|${f.last}|${f.division}`.toLowerCase();if(!existing.has(String(f.id))&&!names.has(key)){state.fighters.push(f);existing.add(String(f.id));names.add(key);add++;if(f.ranked===false)prospectAdd++;else rankedAdd++;}});Object.entries(seed.initialChampions).forEach(([d,id])=>{if(!state.initialChampions[d]&&byId(id))state.initialChampions[d]=id;});const result=await saveState();render();if(!result?.ok){toast(`${add} atleta(s) mesclados na tela, mas a nuvem não confirmou a gravação. Confira a conexão e tente salvar novamente.`);return;}toast(add?`${add} atletas adicionados: ${rankedAdd} ranqueados e ${prospectAdd} prospectos sem ranking.`:'O roster ampliado já está mesclado. Nenhum atleta novo foi necessário.');}
async function clearSeason(){if(!confirm('Apagar TODOS os eventos, cards, resultados e inscrições pendentes? O elenco e os cartéis-base serão mantidos; ranking/cinturões retornam à base.'))return;try{await clearApplicationsRemote();}catch(err){console.error(err);toast('Não foi possível limpar a fila de inscrições no servidor.');return;}state.events=[];state.applications=[];state.counters.totalCreated=0;state.counters.numbered=0;state.counters.fightnight=0;selectedEventId=null;promoEventId='';promoText='';saveState();await cloudSaveQueue;render();toast('Temporada limpa. Rankings e títulos retornaram ao elenco-base.');}

function copyFightReport(eid,fid){const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(!e||!f?.result)return;const value=fightReportText(e,f);const done=()=>toast('Relato completo copiado. Pronto para usar na narração.');const fallback=()=>{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{const ok=document.execCommand('copy');toast(ok?'Relato completo copiado.':'Não foi possível copiar automaticamente; abra o relato e copie manualmente.');}catch(err){toast('Não foi possível copiar automaticamente; abra o relato e copie manualmente.');}ta.remove();};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(done).catch(fallback);else fallback();}
function copyPromo(){const textValue=$('promoText')?.value||promoText;if(!textValue){toast('Não há texto para copiar.');return;}promoText=textValue;const fallback=()=>{const ta=$('promoText');if(ta){ta.focus();ta.select();try{const ok=document.execCommand('copy');toast(ok?'Texto selecionado/copied.':'Selecione o texto e copie manualmente.');}catch(e){toast('Selecione o texto e copie manualmente.');}}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(textValue).then(()=>toast('Divulgação copiada para a área de transferência.')).catch(fallback);else fallback();}
function downloadPromo(){const textValue=$('promoText')?.value||promoText;const e=eventById(promoEventId);const blob=new Blob([textValue],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ACL-divulgacao-${(e?.name||'evento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}.txt`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Texto promocional baixado em .txt.');}
function printPromo(){const textValue=$('promoText')?.value||promoText;const e=eventById(promoEventId);if(!e)return;const w=window.open('','_blank','width=850,height=900');if(!w){toast('O navegador bloqueou a janela de impressão. Permita pop-ups ou baixe o .txt.');return;}w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(e.name)} — ACL</title><style>body{font-family:Arial,sans-serif;margin:40px;color:#101820}header{border-bottom:6px solid #c9a45c;padding-bottom:18px}small{letter-spacing:3px;color:#b04417;font-weight:bold}h1{font-size:42px;line-height:1;margin:14px 0}h2{font-size:18px}pre{white-space:pre-wrap;font:14px/1.6 Arial,sans-serif;border-top:1px solid #bbb;padding-top:18px}footer{margin-top:30px;border-top:2px solid #111;padding-top:12px;font-size:11px}

function actionClick(btn){const act=btn.dataset.action,id=btn.dataset.id,eid=btn.dataset.eventId,fid=btn.dataset.fightId;
 const publicAllowed=['login','logout','close-modal','go-events','go-rankings','go-applications','open-event','open-fighter-profile','copy-fight-report','refresh-public','download-media-poster'];if(!isAdmin&&!publicAllowed.includes(act)){toast('Entre como administrador para usar esta função.');return;}
 switch(act){case 'login':openAdminLogin();break;case 'logout':logoutAdmin();break;case 'refresh-public':refreshPublicState();break;case 'go-create-event':navigateCreateEvent();break;case 'go-events':setView('events');break;case 'go-rankings':setView('rankings');break;case 'go-promo':setView('promo');break;case 'go-applications':setView('applications');break;case 'go-promo-for-event':promoEventId=id;promoText=promoContent(eventById(id));setView('promo');break;case 'open-event':selectedEventId=id;setView('events');break;case 'open-fighter-profile':openFighterProfile(id);break;case 'new-fighter':openFighterEditor(null);break;case 'edit-fighter':openFighterEditor(id);break;case 'save-fighter-form':handleFighterSave($('fighterEditorForm'));break;case 'diagnose-fighter-save':diagnoseFighterSave();break;case 'reset-fighter-photo-frame':{const form=$('fighterEditorForm');if(form){form.elements.namedItem('photoScale').value=100;form.elements.namedItem('photoX').value=0;form.elements.namedItem('photoY').value=0;refreshFighterPhotoFramePreview();toast('Enquadramento restaurado. Salve o atleta para confirmar.');}break;}case 'delete-fighter':deleteFighter(id);break;case 'delete-event':deleteEvent(id);break;case 'simulate-pending':simulateEvent(id,false);break;case 'start-event-transmission':startEventTransmission(id,false).catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar o evento'));break;case 'cancel-event-transmission':if(confirm('Cancelar a sequência automática deste evento? A luta atual também será cancelada sem aplicar resultado.'))cancelEventTransmission('cancelled');break;case 'resimulate-all':simulateEvent(id,true).catch(err=>handleACLTransmissionError(err,'Não foi possível reiniciar o evento'));break;case 'start-live-fight':startLiveFight(eid,fid).catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar a luta'));break;case 'open-live-simulation':openLiveSimulationModal();break;case 'pause-live-sim':pauseLiveSimulation();break;case 'resume-live-sim':resumeLiveSimulation();break;case 'cancel-live-sim':cancelLiveSimulation();break;case 'clear-live-simulation':forceClearLiveSimulation();break;case 'edit-fight':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editFightModal(e,f);break;}case 'edit-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editResultModal(e,f);break;}case 'clear-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f&&confirm('Limpar o resultado desta luta? Cartel, ranking e cinturão serão recalculados.')){f.result=null;saveState();render();toast('Resultado removido.');}break;}case 'delete-fight':{const e=eventById(eid);if(e&&confirm('Excluir esta luta do card? O resultado deixa de contar no ranking.')){e.fights=e.fights.filter(x=>x.id!==fid);saveState();render();toast('Luta removida e ranking recalculado.');}break;}case 'generate-more-fights':{const e=eventById(id);if(e)addFightsToCount(e,6);break;}case 'close-modal':closeModal();break;case 'copy-fight-report':copyFightReport(eid,fid);break;case 'copy-promo':copyPromo();break;case 'download-promo':downloadPromo();break;case 'download-promo-png':downloadPromoPNG();break;case 'refresh-promo':refreshPromo();break;case 'print-promo':printPromo();break;case 'export-json':exportJSON();break;case 'trigger-import':$('importFile').click();break;case 'recalculate':{const c=recalculate();saveState();render();toast(`Recalculado: ${Object.keys(c.records).length} atletas avaliados.`);break;}case 'restore-seed':mergeSeedRoster();break;case 'clear-season':clearSeason();break;case 'reset-all':resetAll();break;case 'approve-application':approveApplication(id);break;case 'reject-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm(`Marcar a ficha de ${app.first} como recusada?`)){app.status='rejected';updateApplicationRemote(app).then(()=>{render();toast('Inscrição marcada como recusada.');});}break;}case 'delete-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm('Excluir permanentemente esta ficha de inscrição?')){deleteApplicationRemote(id).then(()=>{state.applications=state.applications.filter(a=>a.id!==id);render();toast('Ficha removida.');}).catch(err=>{console.error(err);toast('Não foi possível excluir a ficha no servidor.');});}break;}case 'create-empty-event':createEmptyFromInputs();break;case 'sync-media-news':syncAutomaticMediaDrafts().then(()=>{if(activeView==='media')render();toast('Pautas automáticas atualizadas a partir dos dados oficiais.');}).catch(err=>{console.error(err);toast('Não foi possível atualizar as pautas.');});break;case 'sync-medical-assessments':syncAutomaticMedicalAssessments().then(r=>{render();toast(`Avaliações médicas automáticas atualizadas. ${r.created} novo(s) registro(s); ${r.skippedTelemetry} luta(s) sem telemetria completa foram ignoradas.`);}).catch(err=>{console.error(err);toast(err?.message||'Não foi possível sincronizar as avaliações médicas.');});break;case 'save-media-item':saveMediaItem(id,false,false);break;case 'publish-media-item':saveMediaItem(id,true,false);break;case 'unpublish-media-item':saveMediaItem(id,false,true);break;case 'delete-media-item':deleteMediaItem(id);break;case 'download-media-poster':downloadMediaPoster(id);break;case 'generate-media-quick':mediaQuickGenerate(btn.dataset.kind);break;case 'edit-acl-history':editingHistoryId=id;setView('history');break;case 'cancel-history-edit':editingHistoryId=null;render();break;case 'edit-institutional-category':editingInstitutionalCategory=String(btn.dataset.category||'');setView('institutional-categories');break;case 'cancel-institutional-category-edit':editingInstitutionalCategory=null;render();break;case 'delete-institutional-category':{const category=String(btn.dataset.category||'');if(!category)break;const used=aclInstitutionalCategoryUsage(category);if(used){toast('Essa categoria ainda está vinculada a '+used+' seção(ões). Reclassifique as seções antes de excluí-la.');break;}const cats=aclGetInstitutionalCategories();if(cats.length<=1){toast('Mantenha pelo menos uma categoria institucional.');break;}if(confirm(`Excluir a categoria “${category}”?`)){state.aclInstitutionalCategories=cats.filter(x=>x!==category);saveState().then(r=>{if(r?.ok){editingInstitutionalCategory=null;render();toast('Categoria institucional excluída.');}});}break;}case 'toggle-acl-history':toggleACLHistoryItem(id);break;case 'delete-acl-history':if(confirm('Excluir permanentemente este registro histórico?')){state.aclHistory=(state.aclHistory||[]).filter(x=>String(x.id)!==String(id));if(String(editingHistoryId)===String(id))editingHistoryId=null;saveState().then(r=>{if(r?.ok){render();toast('Registro histórico excluído.');}});}break;case 'edit-acl-sponsor':editingSponsorId=id;setView('sponsors');break;case 'cancel-sponsor-edit':editingSponsorId=null;render();break;case 'toggle-acl-sponsor':toggleACLSponsor(id);break;case 'delete-acl-sponsor':if(confirm('Excluir este patrocinador da ACL? Ele também deixará de aparecer na transmissão.')){state.sponsors=(state.sponsors||[]).filter(x=>String(x.id)!==String(id));if(String(editingSponsorId)===String(id))editingSponsorId=null;saveState().then(r=>{if(r?.ok){render();toast('Patrocinador excluído.');}});}break;}

function applyNewsroomFilters(){const q=String(document.querySelector('[data-news-filter]')?.value||'').trim().toLocaleLowerCase('pt-BR');const cat=String(document.querySelector('[data-news-category-filter]')?.value||'');const filtering=!!(q||cat);const cards=[...document.querySelectorAll('[data-news-card],[data-news-lead]')];cards.forEach(card=>{card.hidden=(!!q&&!String(card.dataset.search||'').includes(q))||(!!cat&&card.dataset.category!==cat);});const placeholder=document.querySelector('[data-news-grid-placeholder]');if(placeholder)placeholder.hidden=filtering;const empty=document.querySelector('[data-news-filter-empty]');if(empty)empty.hidden=!filtering||cards.some(card=>!card.hidden);}

function normalizeState(){state.aclHistory=Array.isArray(state.aclHistory)?state.aclHistory:[];state.sponsors=Array.isArray(state.sponsors)?state.sponsors:[];state.aclInstitutionalCategories=aclGetInstitutionalCategories();state.medicalReports=Array.isArray(state.medicalReports)?state.medicalReports:[];state.fighters.forEach(f=>{if(!f.availability)f.availability={status:'available',until:null,reason:'',reportId:null,updatedAt:null};});state.events.forEach(e=>{e.fights=e.fights||[];if(!e.type)e.type='fightnight';if(e.type==='fightnight')e.fights.forEach(f=>{if(f.title){f.title=false;f.rounds=3;}});});if(!state.counters)state.counters={numbered:0,fightnight:0,totalCreated:state.events.length};if(typeof state.counters.totalCreated!=='number')state.counters.totalCreated=state.events.length;if(!Object.prototype.hasOwnProperty.call(state,'liveSimulation'))state.liveSimulation=null;if(!Object.prototype.hasOwnProperty.call(state,'eventTransmission'))state.eventTransmission=null;if(state.liveSimulation&&Object.prototype.hasOwnProperty.call(state.liveSimulation,'plannedResult'))delete state.liveSimulation.plannedResult;if(state.liveSimulation&&liveSimulationIsStale(state.liveSimulation)){console.warn('ACL: removendo registro de transmissão órfão/expirado.',state.liveSimulation.id);state.liveSimulation=null;}}
normalizeState();initializeApp();
