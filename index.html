function updateAuthUI(){document.body.classList.toggle('public-mode',!isAdmin);const auth=$('authButton');if(auth){auth.dataset.action=isAdmin?'logout':'login';auth.textContent=isAdmin?'Sair do painel admin':'Entrar como administrador';}const appsNav=document.querySelector('#mainNav [data-view="applications"]');if(appsNav)appsNav.textContent=isAdmin?'＋ Inscrições':'＋ Inscrever-se';const backupNav=document.querySelector('#mainNav [data-view="backup"]');if(backupNav)backupNav.style.display=isAdmin?'':'none';if(!SUPABASE_CONFIGURED){setStatus('● Configuração do banco pendente','grey');$('footerStatus').textContent='Modo de demonstração local — configure o Supabase para compartilhar dados.';}else if(cloudUnavailable){setStatus('! Banco indisponível','red');$('footerStatus').textContent='Não foi possível conectar ao banco compartilhado.';}else if(isAdmin){$('footerStatus').textContent='Painel administrativo autenticado · alterações compartilhadas na nuvem.';}else if(!cloudStateExists){setStatus('● Aguardando ativação admin','grey');$('footerStatus').textContent='Prévia do elenco base. O administrador deve entrar uma vez para inicializar a temporada oficial.';}else{$('footerStatus').textContent='Elenco, cards, resultados e rankings oficiais da ACL.';}}
function render(){
 if(!isAdmin&&activeView==='backup')activeView='dashboard';
 document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));
 const root=$('viewRoot');
 if(activeView==='dashboard')root.innerHTML=isAdmin?renderDashboard():renderPublicDashboard();
 else if(activeView==='events')root.innerHTML=renderEvents();
 else if(activeView==='fighters')root.innerHTML=renderFighters();
 else if(activeView==='rankings')root.innerHTML=renderRankings();
 else if(activeView==='promo')root.innerHTML=renderPromo();
 else if(activeView==='applications')root.innerHTML=renderApplications();
 else if(activeView==='backup')root.innerHTML=renderBackup();
 initializeLiveSilhouetteStages(root);
 syncPublicLivePolling();
 if(activeView==='promo')requestAnimationFrame(()=>renderPromoImage());
}
function syncPublicLivePolling(){
 const shouldPoll=SUPABASE_CONFIGURED&&!!supabaseClient&&!isAdmin;
 if(!shouldPoll){
  if(publicLivePoller){clearInterval(publicLivePoller);publicLivePoller=null;}
  if(publicLiveUiTicker){clearInterval(publicLiveUiTicker);publicLiveUiTicker=null;}
  return;
 }
 if(!publicLivePoller)publicLivePoller=setInterval(()=>{if(!document.hidden)refreshPublicSharedStateSilently().catch(err=>console.warn('ACL public sync fallback failed',err));},1800);
 if(!publicLiveUiTicker)publicLiveUiTicker=setInterval(()=>{
  const live=state.liveSimulation;
  if(live&&live.status==='running'&&activeView==='events')updateLiveClock(live,Math.floor(liveElapsedMs(live)/1000));
 },200);
}
function notifyACLClients(){
 if(!supabaseClient||!liveBroadcastChannel||!liveBroadcastReady)return;
 try{liveBroadcastChannel.send({type:'broadcast',event:'acl-state-changed',payload:{at:Date.now()}}).catch(err=>console.debug('ACL broadcast fallback polling',err));}catch(err){console.debug('ACL broadcast unavailable',err);}
}
function setupACLClientBroadcast(){
 if(!supabaseClient||liveBroadcastChannel)return;
 try{
  liveBroadcastChannel=supabaseClient.channel('acl-live-public-sync',{config:{broadcast:{self:false}}});
  liveBroadcastChannel.on('broadcast',{event:'acl-state-changed'},()=>{
   if(!isAdmin)refreshPublicSharedStateSilently().catch(err=>console.warn('ACL live push could not refresh',err));
  });
  liveBroadcastChannel.subscribe(status=>{liveBroadcastReady=status==='SUBSCRIBED';if(liveBroadcastReady&&!isAdmin)refreshPublicSharedStateSilently().catch(()=>{});});
 }catch(err){console.warn('ACL realtime channel unavailable; use polling fallback',err);liveBroadcastReady=false;}
}
async function refreshPublicSharedStateSilently(){
 if(!supabaseClient||!SUPABASE_CONFIGURED||isAdmin||publicLivePollBusy)return;
 publicLivePollBusy=true;
 try{
  const {data,error}=await supabaseClient.from('acl_state').select('payload').eq('id',1).maybeSingle();
  if(error)throw error;
  if(!data?.payload)return;
  const oldLive=state.liveSimulation?{...state.liveSimulation,beats:[...(state.liveSimulation.beats||[])]}:null;
  const oldRun=state.eventTransmission?{...state.eventTransmission}:null;
  const oldResultSig=state.events.map(e=>`${e.id}:${eventResultsCount(e)}`).join('|');
  const payload=data.payload;
  state={...state,...payload,applications:[]};
  state.fighters=Array.isArray(payload.fighters)?payload.fighters:[];
  state.events=Array.isArray(payload.events)?payload.events:[];
  state.initialChampions=payload.initialChampions||{};
  state.counters=payload.counters||{numbered:0,fightnight:0,totalCreated:state.events.length};
  state.liveSimulation=payload.liveSimulation||null;
  state.eventTransmission=payload.eventTransmission||null;
  cloudStateExists=true;cloudLoaded=true;
  const nextLive=state.liveSimulation;
  const nextRun=state.eventTransmission;
  const activeEventId=nextLive&&['running','paused'].includes(nextLive.status)?nextLive.eventId:(nextRun&&['running','intermission'].includes(nextRun.status)?nextRun.eventId:null);
  const wasOnEvents=activeView==='events';
  if(activeEventId){if(!isAdmin&&activeView!=='events')activeView='events';if(String(selectedEventId)!==String(activeEventId))selectedEventId=activeEventId;}
  const switchedIntoLiveEvents=!wasOnEvents&&activeView==='events';
  const newResultSig=state.events.map(e=>`${e.id}:${eventResultsCount(e)}`).join('|');
  const changedLive=String(oldLive?.id||'')!==String(nextLive?.id||'')||String(oldLive?.status||'')!==String(nextLive?.status||'');
  const changedRun=String(oldRun?.id||'')!==String(nextRun?.id||'')||String(oldRun?.status||'')!==String(nextRun?.status||'')||String(oldRun?.currentFightId||'')!==String(nextRun?.currentFightId||'');
  if(activeView==='events'&&(switchedIntoLiveEvents||changedLive||changedRun||oldResultSig!==newResultSig)){
   render();
   const stage=$('liveStage');if(stage&&nextLive?.beats?.length)applyLiveMove(stage,nextLive.beats[nextLive.beats.length-1]?.move||'idle',nextLive);
   return;
  }
  if(activeView==='events'&&nextLive&&nextLive.status==='running'&&oldLive&&String(oldLive.id)===String(nextLive.id)){
   const oldCount=(oldLive.beats||[]).length;const beats=nextLive.beats||[];const feed=$('liveNarrationFeed');
   if(feed&&beats.length>oldCount){for(const beat of beats.slice(oldCount)){const wrap=document.createElement('div');wrap.innerHTML=liveBeatHTML(beat);const node=wrap.firstElementChild;if(node)feed.appendChild(node);const stage=$('liveStage');if(stage)applyLiveMove(stage,beat.move||'idle',nextLive);}feed.scrollTop=feed.scrollHeight;}
   updateLiveClock(nextLive,Math.floor(liveElapsedMs(nextLive)/1000));
  }
 }finally{publicLivePollBusy=false;}
}

function renderPublicApplications(){return `<div class="page-head"><div><div class="eyebrow">Fighter intake / inscrições abertas</div><h2>Inscreva seu lutador</h2><p>Envie sua ficha para a direção da Apex Combat League. A inscrição ficará pendente até a avaliação administrativa.</p></div><div class="actions"><span class="tag orange">AVALIAÇÃO DA ACL</span></div></div><div class="grid dashboard-grid"><div class="panel"><div class="panel-head"><div><h3>Ficha de inscrição</h3><p>Use os dados do personagem do seu roleplay.</p></div></div><form id="applicationForm"><div class="form-grid"><div class="field"><label>Nome *</label><input name="first" required maxlength="35" placeholder="Primeiro nome"></div><div class="field"><label>Apelido de luta *</label><input name="nick" required maxlength="35" placeholder="Como será anunciado"></div><div class="field"><label>Sobrenome *</label><input name="last" required maxlength="35" placeholder="Sobrenome do atleta"></div><div class="field"><label>Divisão *</label><select name="division" required>${DIVISIONS.map(d=>`<option value="${d.id}">${esc(d.label)} (${esc(d.weight)})</option>`).join('')}</select></div><div class="field full"><label>Origem / cidade / país *</label><input name="origin" required maxlength="90" placeholder="Ex.: Rancho, Los Santos"></div><div class="field full"><label>Academia / equipe</label><input name="gym" maxlength="80" placeholder="Nome da equipe ou academia"></div><div class="field full"><label>Artes marciais praticadas *</label><input name="arts" required maxlength="120" placeholder="Ex.: Boxe, Wrestling, Jiu-jítsu"></div><div class="field full"><label>História do personagem e estilo de luta *</label><textarea name="bio" required minlength="15" maxlength="700" placeholder="Conte de onde veio, como luta e por que merece uma vaga na ACL."></textarea></div></div><div class="actions" style="margin-top:13px"><button type="submit" class="btn primary">Enviar para avaliação</button></div></form><div class="notice">A candidatura não garante entrada imediata no elenco. A direção revisará a ficha antes de aprová-la.</div></div><div class="panel"><div class="panel-head"><div><h3>Como funciona</h3><p>Do cadastro à estreia</p></div></div><div class="list-stack"><div class="belt-row"><div><div class="belt-name">1. Envie a ficha</div><div class="belt-div">Descreva um personagem original e sua base de luta.</div></div></div><div class="belt-row"><div><div class="belt-name">2. Aguarde avaliação</div><div class="belt-div">A equipe verifica divisão, estilo e história.</div></div></div><div class="belt-row"><div><div class="belt-name">3. Entre no roster</div><div class="belt-div">Após a aprovação, o atleta aparece no elenco oficial.</div></div></div></div></div></div>`;}
function activityHTML(f,e,c){const a=byId(f.a),b=byId(f.b),r=f.result;if(!a||!b||!r)return '';const winner=r.winnerId?byId(r.winnerId):null;return `<div class="activity-row"><div><div style="font-size:12px;font-weight:850">${winner?esc(fullName(winner)):'Empate'} <span class="muted">${winner?'venceu':'entre'}</span> ${winner?esc(''):`${esc(fullName(a))} e ${esc(fullName(b))}`}</div><div class="small-text muted">${esc(e.name)} · ${esc(r.method)}${r.round?' · R'+r.round:''}</div></div><span class="tag ${f.title?'lime':'grey'}">${f.title?'TÍTULO':'RESULTADO'}</span></div>`;}
function renderEvents(){if(!isAdmin)return renderPublicEvents();const evts=[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));const selected=eventById(selectedEventId)||evts[0]||null;if(selected)selectedEventId=selected.id;
 const suggestion=suggestedType();return `<div class="page-head"><div><div class="eyebrow">Matchmaking / agenda</div><h2>Eventos & cards</h2><p>Dê um nome próprio a cada edição, gere confrontos automaticamente e edite qualquer parte do card depois de criado.</p></div><div class="actions"><span class="tag ${suggestion==='numbered'?'lime':'orange'}">Sugestão: ${suggestion==='numbered'?'ACL numerado':'Fight Night'}</span></div></div>
 <div class="event-layout"><div><div class="panel"><div class="panel-head"><div><h3>Nova edição</h3><p>O nome é obrigatório e nunca será repetido automaticamente.</p></div><span class="tag orange">NOVO CARD</span></div><form id="createEventForm"><div class="form-grid"><div class="field full"><label for="newEventName">Nome do evento *</label><input id="newEventName" name="name" required maxlength="90" placeholder="Ex.: Noite de Acerto de Contas"></div><div class="field"><label for="newEventType">Formato *</label><select id="newEventType" name="type"><option value="fightnight" ${suggestion==='fightnight'?'selected':''}>Fight Night — sem cinturão</option><option value="numbered" ${suggestion==='numbered'?'selected':''}>Evento numerado ACL — títulos permitidos</option></select></div><div class="field"><label for="newEventDate">Data do evento</label><input id="newEventDate" name="date" type="date" value="${todayISO()}"></div><div class="field full"><label for="newEventVenue">Local / arena</label><input id="newEventVenue" name="venue" value="Maze Bank Arena, Los Santos" maxlength="100"></div><div class="field"><label for="newFightCount">Quantidade de lutas</label><select id="newFightCount" name="fightCount"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></div><div class="field" id="titleCountWrap"><label for="newTitleCount">Disputas de cinturão</label><select id="newTitleCount" name="titleCount" ${suggestion!=='numbered'?'disabled':''}><option value="0">Nenhuma</option><option value="1" ${suggestion==='numbered'?'selected':''}>1 — luta principal</option><option value="2">2 — card especial</option></select></div><div class="field full"><label for="newEventNotes">Contexto / gancho editorial (opcional)</label><textarea id="newEventNotes" name="notes" rows="3" placeholder="Ex.: dois prospectos disputam espaço no ranking; o campeão pediu um adversário que ainda não enfrentou."></textarea></div></div><div id="typeWarning" class="helper" style="margin-top:13px">Fight Night: nenhum cinturão pode ser colocado em jogo. O evento numerado é o formato para disputas de título.</div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">＋ Criar evento e montar card</button><button class="btn" type="button" data-action="create-empty-event">Criar vazio</button></div></form></div><div class="notice">A numeração do tipo é gerada separadamente (Fight Night #01, ACL #01 etc.). O nome que você digitar vira o título editorial do evento. Apagar uma edição não apaga outras nem reaproveita o número.</div>
 <div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Calendário da ACL</h3><p>${evts.length} edição(ões) no arquivo</p></div><span class="tag grey">${evts.filter(e=>!eventDone(e)).length} em aberto</span></div>${evts.length?`<div class="list-stack">${evts.map(e=>`<div class="event-card ${selected&&selected.id===e.id?'selected':''}" data-action="open-event" data-id="${e.id}"><div class="actions" style="justify-content:space-between"><span class="tag ${e.type==='numbered'?'lime':'orange'}">${eventLabel(e)}</span>${statusTag(e)}</div><div class="event-card-title">${esc(e.name)}</div><div class="event-card-meta"><span>▦ ${esc(fmtDate(e.date))}</span><span>⚔ ${(e.fights||[]).length} lutas</span></div><div class="event-card-bottom"><span class="small-text muted">${esc(e.venue||'Los Santos')}</span><span class="small-text" style="color:var(--orange2);font-weight:900">Abrir →</span></div></div>`).join('')}</div>`:`<div class="empty"><strong>Nenhum evento criado ainda.</strong><p>Escolha um nome acima e monte o primeiro card.</p></div>`}</div></div>
 <div>${selected?renderEventDetail(selected):`<div class="panel"><div class="empty"><strong>Selecione ou crie um evento.</strong><p>O editor completo do card aparecerá aqui.</p></div></div>`}</div></div>`;
}
function defaultEventPitch(e){return e.type==='fightnight'?'Noite de confronto e movimentação do ranking. Sem cinturões em disputa: cada vitória pode mudar o caminho até a próxima chance.':'Um palco maior para lutas decisivas. O evento numerado pode ter disputas de título selecionadas pela direção da ACL.'}
function renderAddFightForm(e){const used=new Set((e.fights||[]).flatMap(f=>[f.a,f.b]));const firstDiv=DIVISIONS.find(d=>divisionFighters(d.id).filter(f=>!used.has(f.id)).length>=2)?.id||DIVISIONS[0].id;const options=DIVISIONS.map(d=>`<option value="${d.id}" ${d.id===firstDiv?'selected':''}>${esc(d.label)}</option>`).join('');const available=divisionFighters(firstDiv).filter(f=>!used.has(f.id));return `<form id="addFightForm" data-event-id="${e.id}"><div class="form-grid three"><div class="field"><label>Divisão</label><select name="division" id="addFightDivision">${options}</select></div><div class="field"><label>Atleta A</label><select name="a" id="addFightA">${available.map((f,i)=>`<option value="${f.id}">${esc(fullName(f))}${i===0?' · topo do ranking':''}</option>`).join('')}</select></div><div class="field"><label>Atleta B</label><select name="b" id="addFightB">${available.slice(1).concat(available.slice(0,1)).map((f,i)=>`<option value="${f.id}" ${i===0?'selected':''}>${esc(fullName(f))}</option>`).join('')}</select></div><div class="field full"><label>Gancho editorial da luta (opcional)</label><input name="story" maxlength="300" placeholder="Ex.: o vencedor pode entrar no top 5 da divisão"></div><div class="field full"><label class="checkline"><input type="checkbox" name="title" ${e.type!=='numbered'?'disabled':''}> Disputa de cinturão ${e.type!=='numbered'?'(bloqueada em Fight Night)':''}</label></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" type="submit">＋ Adicionar luta</button><button class="btn" type="button" data-action="generate-more-fights" data-id="${e.id}">Gerar lutas até completar 6</button></div></form>`;}
function renderEventDetail(e){const c=recalculate();const titleFights=(e.fights||[]).filter(f=>f.title).length;const currentLive=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)?state.liveSimulation:null;const liveCtx=currentLive?liveFightContext(currentLive):null;const liveRecoveryNotice=currentLive?`<div class="notice" style="margin-bottom:14px;border-color:rgba(255,104,122,.4)"><strong>Transmissão registrada como ativa${liveCtx?.f?`: ${esc(fullName(byId(liveCtx.f.a)))} vs. ${esc(fullName(byId(liveCtx.f.b)))}`:''}.</strong> Se não há luta ocorrendo, libere o registro antigo para não bloquear o evento. <button class="btn danger small" data-action="clear-live-simulation">Liberar transmissão travada</button></div>`:'';const run=state.eventTransmission&&state.eventTransmission.eventId===e.id?state.eventTransmission:null;const runActive=run&&['running','intermission'].includes(run.status);const runNotice=runActive?`<div class="notice" style="margin-bottom:14px;border-color:rgba(255,107,53,.45)"><strong>📡 Evento em transmissão automática.</strong> ${run.status==='intermission'?'Intervalo rápido: o próximo combate começará automaticamente.':'A sequência do card está ativa; as próximas lutas iniciam sozinhas. Deixe a aba administrativa aberta durante o evento.'} <span class="small-text muted">${(e.fights||[]).filter(x=>x.result).length}/${e.fights.length} resultados registrados.</span><button class="btn danger small" data-action="cancel-event-transmission">Cancelar evento</button></div>`:run&&run.status==='finished'?`<div class="notice" style="margin-bottom:14px;border-color:rgba(112,224,173,.35)"><strong>✓ Transmissão do evento concluída.</strong> Todas as lutas foram finalizadas e os resultados foram gravados.</div>`:'';return `${liveRecoveryNotice}${runNotice}<div class="panel"><div class="event-headline"><div><div class="actions"><span class="tag ${e.type==='numbered'?'lime':'orange'}">${eventLabel(e)}</span>${statusTag(e)}</div><h3>${esc(e.name)}</h3><div class="small-text muted">${esc(fmtDate(e.date))} · ${esc(e.venue||'Local a definir')}</div></div><button class="btn danger small" data-action="delete-event" data-id="${e.id}">Excluir evento</button></div>
 <div class="event-details-grid"><div class="detail-tile"><span>Lutas no card</span><strong>${e.fights.length}</strong></div><div class="detail-tile"><span>Resultados</span><strong>${eventResultsCount(e)} / ${e.fights.length}</strong></div><div class="detail-tile"><span>Cinturões</span><strong>${e.type==='fightnight'?'0 (bloqueado)':titleFights+' em disputa'}</strong></div></div>
 <div class="rule"></div><div class="panel-head"><div><h3>Editar informações do evento</h3><p>O nome, a data, o formato, o local e o contexto podem ser alterados.</p></div></div><form id="editEventForm" data-id="${e.id}"><div class="form-grid"><div class="field full"><label>Nome do evento *</label><input name="name" required value="${esc(e.name)}" maxlength="90"></div><div class="field"><label>Formato</label><select name="type"><option value="numbered" ${e.type==='numbered'?'selected':''}>Evento numerado ACL</option><option value="fightnight" ${e.type==='fightnight'?'selected':''}>Fight Night — sem cinturão</option></select></div><div class="field"><label>Data</label><input name="date" type="date" value="${esc(e.date||'')}"></div><div class="field full"><label>Local / arena</label><input name="venue" value="${esc(e.venue||'')}" maxlength="100"></div><div class="field full"><label>Contexto / gancho editorial</label><textarea name="notes" rows="3" placeholder="O que está em jogo para esta edição?">${esc(e.notes||'')}</textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" type="submit">Salvar alterações</button><button class="btn" type="button" data-action="go-promo-for-event" data-id="${e.id}">Preparar divulgação ↗</button></div></form></div>
 <div class="panel"><div class="panel-head"><div><h3>Card de lutas</h3><p>Transmissão automática do card inteiro. Rounds de 1 minuto, narração progressiva e cinturões apenas nos eventos numerados. A luta principal será a última.</p></div><div class="actions"><button class="btn primary small" data-action="start-event-transmission" data-id="${e.id}" ${!e.fights.length||e.fights.every(f=>f.result)||runActive?'disabled':''}>▶ Transmitir evento</button><button class="btn small" data-action="resimulate-all" data-id="${e.id}" ${!e.fights.length?'disabled':''}>↻ Reiniciar e transmitir</button></div></div>
 ${e.fights.length?orderedCardFights(e).map((f,i)=>renderFightCard(e,f,i,c)).join(''):`<div class="empty"><strong>Este card ainda não tem lutas.</strong><p>Adicione os confrontos manualmente ou gere um card automático.</p></div>`}
 <div class="rule"></div><div class="panel-head"><div><h3>Adicionar confronto</h3><p>Atletas devem ser da mesma divisão. Cada atleta só luta uma vez no mesmo card.</p></div></div>${renderAddFightForm(e)}</div>`;}
function renderFightCard(e,f,i,c){const a=byId(f.a),b=byId(f.b);if(!a||!b)return '';const r=f.result;const winner=r?.winnerId?byId(r.winnerId):null;const live=state.liveSimulation;const thisLive=!!live&&String(live.eventId)===String(e.id)&&String(live.fightId)===String(f.id)&&['running','paused'].includes(live.status);const transmission=state.eventTransmission&&String(state.eventTransmission.eventId)===String(e.id)&&['running','intermission'].includes(state.eventTransmission.status);const liveButton=thisLive?`<button class="btn primary small" data-action="open-live-simulation">● Abrir transmissão ao vivo</button>`:'';const pendingText=!r?(transmission?`<div class="fight-result pending">📡 Evento em transmissão automática — aguardando a chamada desta luta.</div>`:`<div class="fight-result pending">⏳ Resultado pendente — inicie o evento inteiro para começar a transmissão automática.</div>`):'';return `<div class="fight-card"><div class="fight-top"><div><div class="fight-slot">${esc(f.slot||slotName(i,e.fights.length))} · ${esc(divObj(f.division).label)} · ${f.rounds||3} rounds de 1 min</div><div class="fighter-meta"><span class="tag ${f.title?'lime':'grey'}">${f.title?'♛ DISPUTA DE CINTURÃO':'LUTA CASADA'}</span>${f.title&&e.type!=='numbered'?'<span class="tag red">FORMATO INVÁLIDO</span>':''}${thisLive?'<span class="tag red">TRANSMISSÃO AO VIVO</span>':''}</div></div><span class="small-text muted">${String(i+1).padStart(2,'0')}</span></div><div class="fighters-vs"><div class="fighter-side"><div class="fighter-name">${esc(fullName(a))}</div><div class="fighter-nick">“${esc(a.nick||'Sem apelido')}”</div><div class="fighter-record">${recordText(c.records[a.id])} · ${esc(a.base||a.origin)}</div></div><div class="vs">VS</div><div class="fighter-side right"><div class="fighter-name">${esc(fullName(b))}</div><div class="fighter-nick">“${esc(b.nick||'Sem apelido')}”</div><div class="fighter-record">${recordText(c.records[b.id])} · ${esc(b.base||b.origin)}</div></div></div>${r?`<div class="fight-result"><strong style="color:${winner?'var(--green)':'var(--orange2)'}">${winner?esc(fullName(winner))+' venceu':'Empate'}</strong> · ${esc(r.method||'Resultado manual')}${r.round?' · Round '+r.round:''}${r.note?`<div class="small-text muted" style="margin-top:4px">${esc(r.note)}</div>`:''}</div>${renderLiveStatsDetails(r,f)}${renderFightReport(e,f)}`:pendingText}${f.story?`<div class="fight-story"><strong>Gancho editorial:</strong> ${esc(f.story)}</div>`:''}<div class="fight-actions">${liveButton}<button class="btn small" data-action="edit-fight" data-event-id="${e.id}" data-fight-id="${f.id}">Editar luta</button><button class="btn small" data-action="edit-result" data-event-id="${e.id}" data-fight-id="${f.id}">${r?'Corrigir resultado':'Definir resultado manual'}</button>${r?`<button class="btn small" data-action="clear-result" data-event-id="${e.id}" data-fight-id="${f.id}">Limpar resultado</button>`:''}<button class="btn danger small" data-action="delete-fight" data-event-id="${e.id}" data-fight-id="${f.id}">Excluir</button></div></div>`;}
function initials(f){return ((f.first||'?')[0]+(f.last||'?')[0]).toUpperCase()}
function rankPos(f,c){const arr=c.ranking[f.division]||[];return c.champions[f.division]===f.id?'CAMPEÃO':String(arr.findIndex(x=>x.id===f.id)+(c.champions[f.division]&&arr[0]?.id===c.champions[f.division]?0:1));}
function fighterCard(f,c){const st=statsFor(f),r=c.records[f.id]||f.baseRecord;const champ=c.champions[f.division]===f.id;return `<article class="fighter-card"><div class="fighter-card-top"><div class="fighter-avatar">${initials(f)}</div><div class="actions"><button class="btn small" data-action="edit-fighter" data-id="${esc(String(f.id))}">Editar</button><button class="btn danger small" data-action="delete-fighter" data-id="${esc(String(f.id))}">×</button></div></div><h3>${esc(fullName(f))}</h3><div class="nickname">“${esc(f.nick||'Sem apelido')}”</div><div class="fighter-meta"><span class="tag ${champ?'lime':'grey'}">${champ?'♛ CAMPEÃO':`RANK #${esc(rankPos(f,c))}`}</span><span class="tag blue">${recordText(r)}</span></div><div class="fighter-meta"><span class="small-text muted">Origem: ${esc(f.origin||'Não informada')}</span></div><div class="fighter-meta"><span class="small-text muted">⌖ Luta por: ${esc(f.base||'Los Santos')}</span></div><div class="fighter-meta"><span class="small-text muted">⌂ Academia: ${esc(f.gym||'Equipe independente')}</span></div><div class="arts">${(f.arts||[]).map(a=>`<span class="art-chip">${esc(a)}</span>`).join('')}</div><p class="fighter-story">${esc(f.bio||'Sem biografia cadastrada. Edite o perfil para adicionar contexto de narração.')}</p><div class="attribute-bars">${[['STR',st.striking],['GRP',st.grappling],['GÁS',st.cardio],['QUEIXO',st.chin],['TÉC',st.technique]].map(([l,v])=>`<div class="attr"><strong>${v}</strong><div class="bar"><span style="width:${v}%"></span></div><span>${l}</span></div>`).join('')}</div><div class="card-footer"><span class="small-text muted">${esc(divObj(f.division).label)} · ${f.age||'—'} anos</span><span class="small-text" style="font-weight:900">${c.points[f.id]??f.basePoints} pts</span></div></article>`;}
function renderRankings(){const c=recalculate();const divs=rankDivision==='all'?DIVISIONS:DIVISIONS.filter(d=>d.id===rankDivision);return `<div class="page-head"><div><div class="eyebrow">Competitive landscape / standings</div><h2>Rankings & cinturões</h2><p>A classificação é calculada a partir do cartel inicial e de todos os resultados salvos. Ao editar ou apagar um evento, o ranking e os campeões são reconstruídos automaticamente.</p></div><div class="actions"><span class="tag lime">Histórico reversível</span></div></div><div class="toolbar"><div class="field"><label for="rankDivision">Filtrar divisão</label><select id="rankDivision"><option value="all">Todas as divisões</option>${DIVISIONS.map(d=>`<option value="${d.id}" ${rankDivision===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div><span class="tag grey">Pontos dinâmicos</span></div><div class="grid rank-layout">${divs.map(d=>{const fs=c.ranking[d.id]||[];const champ=c.champions[d.id];return `<section class="rank-panel"><div class="rank-head"><div><h3>${esc(d.label)}</h3><div class="small-text muted">${esc(d.weight)} · ${fs.length} atletas</div></div><span class="tag ${champ?'lime':'red'}">${champ?'CINTURÃO ATIVO':'CINTURÃO VAGO'}</span></div>${champ?'<div class="title-rule"></div>':''}${fs.map((f,i)=>{const isChamp=champ===f.id;const r=c.records[f.id];const s=c.stats[f.id];return `<div class="rank-row ${isChamp?'champ':''}"><div class="rank-pos">${isChamp?'♛':(i+(champ?0:1))}</div><div class="rank-person"><strong>${esc(fullName(f))} ${isChamp?'<span style="color:var(--lime)">· C</span>':''}</strong><span>“${esc(f.nick||'—')}” · ${esc(f.gym||f.base||f.origin)}</span></div><div class="rank-numbers">${recordText(r)}<small>${c.points[f.id]??0} pts · ${s.fights} ACL</small></div></div>`}).join('')||'<div class="empty">Sem atletas nesta divisão.</div>'}</section>`}).join('')}</div><div class="notice">Regra de cálculo: cada vitória melhora a pontuação (finalização/KO vale mais que decisão), derrotas reduzem pontos e empates dão um pequeno ajuste. O campeão é exibido separado no topo. Lutas passadas e títulos são reprocessados na ordem cronológica do evento.</div>`;}
function pickPromoEvent(){let e=eventById(promoEventId);if(e)return e;const upcoming=state.events.filter(x=>!eventDone(x)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return upcoming[0]||[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||null;}
function promoContent(e){if(!e)return 'APEX COMBAT LEAGUE\n\nAinda não há evento cadastrado. Crie um evento e monte seu card para gerar a divulgação.';const c=recalculate();const f=e.fights||[];const head=f[0];const a=head?byId(head.a):null,b=head?byId(head.b):null;const lines=[];lines.push(`🥊 APEX COMBAT LEAGUE — ${eventLabel(e)}: ${e.name}`);lines.push(`📅 ${fmtDate(e.date,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})} | 📍 ${e.venue||'Los Santos, San Andreas'}`);lines.push('');lines.push(e.type==='fightnight'?'LOS SANTOS, É NOITE DE RANKING. Sem cinturões em disputa: cada vitória muda a conversa, cada derrota aperta o caminho até o topo.':'LOS SANTOS RECEBE UM EVENTO NUMERADO. A ACL reservou o cage para confrontos de alto impacto e disputas de título selecionadas.');lines.push('');if(head){lines.push(`🔥 LUTA PRINCIPAL — ${fullName(a)} “${a.nick}” (${recordText(c.records[a.id])}) vs. ${fullName(b)} “${b.nick}” (${recordText(c.records[b.id])})`);lines.push(`${divObj(head.division).label}${head.title?' · CINTURÃO EM JOGO':''}`);lines.push('');}lines.push('CARD CONFIRMADO');f.forEach((fight,i)=>{const fa=byId(fight.a),fb=byId(fight.b);if(!fa||!fb)return;const match=`${i+1}. ${fullName(fa)} “${fa.nick}” vs. ${fullName(fb)} “${fb.nick}” — ${divObj(fight.division).label}${fight.title?' [DISPUTA DE CINTURÃO]':''}`;lines.push(match);if(fight.story)lines.push(`   Gancho: ${fight.story}`);});if(e.notes){lines.push('');lines.push('O QUE ESTÁ EM JOGO');lines.push(e.notes);}const titleCount=f.filter(x=>x.title).length;if(e.type==='fightnight'){lines.push('');lines.push('📊 Sem disputas de cinturão nesta edição. O foco é ranking, prospectos e definição dos próximos desafiantes.');}else if(titleCount){lines.push('');lines.push(`🏆 ${titleCount} disputa(s) de cinturão confirmada(s). Não são todos os títulos da ACL — apenas as divisões selecionadas para este card.`);}lines.push('');lines.push('APEX COMBAT LEAGUE — A reputação é construída dentro do cage.');lines.push('#ACL #LosSantos #FightNight');return lines.join('\n');}

function posterWrapText(ctx,text,maxWidth,maxLines=2){
 const words=String(text||'').split(/\s+/).filter(Boolean),lines=[];let line='';
 for(const word of words){const test=line?line+' '+word:word;if(ctx.measureText(test).width<=maxWidth||!line){line=test;}else{lines.push(line);line=word;if(lines.length>=maxLines-1)break;}}
 if(line&&lines.length<maxLines)lines.push(line);
 const consumed=lines.join(' ').replace(/\s+/g,' ').length;
 if(consumed<String(text||'').trim().replace(/\s+/g,' ').length&&lines.length){let last=lines.length-1;while(lines[last].length&&ctx.measureText(lines[last]+'…').width>maxWidth)lines[last]=lines[last].slice(0,-1);lines[last]=lines[last].trimEnd()+'…';}
 return lines;
}
function posterText(ctx,text,x,y,maxWidth,lineHeight,maxLines=2,align='left'){
 const lines=posterWrapText(ctx,text,maxWidth,maxLines);ctx.textAlign=align;lines.forEach((line,i)=>ctx.fillText(line,x,y+i*lineHeight));return lines.length*lineHeight;
}
function posterRoundRect(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}}
function posterFighterLine(f){if(!f)return 'Atleta a confirmar';return `${fullName(f)} “${f.nick||'ACL'}”`;}
function promoFightPriority(f){const s=String(f.slot||'').toLowerCase();if(s.includes('prelim'))return 0;if(s.includes('card principal'))return 1;if(s.includes('co-main')||s.includes('co main'))return 2;if(s.includes('luta principal')||s.includes('main event'))return 3;return 1;}

function downloadPromoPNG(){
 const e=eventById($('promoEventSelect')?.value||promoEventId)||pickPromoEvent();const canvas=$('promoCanvas');
 if(!e||!canvas){toast('Selecione um evento para gerar a arte.');return;}
 try{
  renderPromoImage();
  const dataUrl=canvas.toDataURL('image/png');
  const slug=(e.name||'evento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase();
  const a=document.createElement('a');a.href=dataUrl;a.download=`ACL-${slug||'evento'}-discord.png`;document.body.appendChild(a);a.click();a.remove();
  toast('Arte PNG baixada. Agora é só anexar no Discord!');
 }catch(err){console.error('ACL poster export failed',err);toast('Não foi possível exportar a arte neste navegador. Tente recarregar a página.');}

function renderFighters(){if(!isAdmin)return renderPublicFighters();const c=recalculate();const filtered=state.fighters.filter(f=>{const q=fighterSearch.toLowerCase();return (!q||[f.first,f.nick,f.last,f.origin,f.base,f.gym,(f.arts||[]).join(' '),divObj(f.division).label].join(' ').toLowerCase().includes(q))&&(fighterDivision==='all'||f.division===fighterDivision)}).sort((a,b)=>fullName(a).localeCompare(fullName(b)));return `<div class="page-head"><div><div class="eyebrow">Roster management / cadastro</div><h2>O elenco da ACL</h2><p>Perfis completos para narração: origem, academia, artes marciais, cartel, atributos e gancho de personagem. Edite, cadastre ou remova atletas quando quiser.</p></div><div class="actions"><button class="btn primary" data-action="new-fighter">＋ Cadastrar atleta</button><button class="btn" data-action="go-applications">Ver inscrições</button></div></div><div class="toolbar"><div class="field"><label for="fighterSearch">Buscar atleta</label><input id="fighterSearch" placeholder="Nome, apelido, academia, origem..." value="${esc(fighterSearch)}"></div><div class="field"><label for="fighterDivision">Divisão</label><select id="fighterDivision"><option value="all">Todas as divisões</option>${DIVISIONS.map(d=>`<option value="${d.id}" ${fighterDivision===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div><span class="tag grey">${filtered.length} atletas</span></div>${filtered.length?`<div class="grid fighters-grid">${filtered.map(f=>fighterCard(f,c)).join('')}</div>`:`<div class="empty"><strong>Nenhum atleta encontrado.</strong><p>Altere a busca ou cadastre um novo nome para a ACL.</p><button class="btn primary" data-action="new-fighter">Cadastrar atleta</button></div>`}`;}
function renderBackup(){return `<div class="page-head"><div><div class="eyebrow">Administration / data integrity</div><h2>Dados & backup</h2><p>Tenha controle do universo da ACL. Exporte toda a base para guardar, transferir para outro navegador ou recuperar depois.</p></div><div class="actions"><span class="tag lime">Salvamento automático</span></div></div><div class="grid dashboard-grid"><div class="panel"><div class="panel-head"><div><h3>Backup completo</h3><p>Elenco, cartéis, eventos, lutas, resultados, inscrições e contadores.</p></div></div><div class="helper">Os dados oficiais ficam na base compartilhada do Supabase. O backup JSON serve para migração e recuperação; guarde uma cópia segura regularmente.</div><div class="actions" style="margin-top:15px"><button class="btn primary" data-action="export-json">↓ Exportar backup JSON</button><button class="btn" data-action="trigger-import">↑ Importar backup JSON</button></div><div class="rule"></div><div class="detail-tile"><span>Elenco</span><strong>${state.fighters.length} atletas</strong></div><div class="detail-tile" style="margin-top:8px"><span>Arquivo de eventos</span><strong>${state.events.length} eventos · ${state.events.reduce((n,e)=>n+e.fights.length,0)} lutas</strong></div><div class="detail-tile" style="margin-top:8px"><span>Inscrições</span><strong>${state.applications.length} fichas</strong></div></div><div class="panel"><div class="panel-head"><div><h3>Ferramentas administrativas</h3><p>Operações para manutenção do universo</p></div></div><div class="list-stack"><div class="belt-row"><div><div class="belt-name">Validar consistência</div><div class="belt-div">Reprocessa rankings e campeões sem apagar dados.</div></div><button class="btn small" data-action="recalculate">Recalcular</button></div><div class="belt-row"><div><div class="belt-name">Adicionar elenco de exemplo</div><div class="belt-div">Só acrescenta os atletas-padrão ausentes; não substitui eventos.</div></div><button class="btn small" data-a function generateStory(a,b,div,title){if(title)return `Cinturão de ${divObj(div).label} em jogo: ${fullName(a)} e ${fullName(b)} chegam com caminhos diferentes, mas só um pode sair com o título.`;const c=recalculate();const pa=c.ranking[div]||[];const ra=pa.findIndex(x=>x.id===a.id)+1,rb=pa.findIndex(x=>x.id===b.id)+1;if(Math.abs(ra-rb)<=1)return `Confronto direto entre atletas próximos no ranking. Uma vitória aqui pode ser o primeiro passo para entrar na conversa pelo top 5.`;return `${fullName(a)} tenta confirmar sua posição na divisão, enquanto ${fullName(b)} busca uma vitória que mude a hierarquia do ranking.`;}
function alreadyFought(a,b){return state.events.some(e=>(e.fights||[]).some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a)));}
function nextEventNumber(type){const field=type==='numbered'?'numbered':'fightnight';const max=state.events.filter(e=>e.type===type).reduce((n,e)=>Math.max(n,+e.number||0),0);state.counters[field]=Math.max(+state.counters[field]||0,max)+1;return state.counters[field];}
function createEventFromForm(form,generate=true){const data=new FormData(form);const name=String(data.get('name')||'').trim();if(!name){toast('Digite um nome para o evento.');return;}const type=data.get('type')==='numbered'?'numbered':'fightnight';const event={id:uid('event'),name,type,number:nextEventNumber(type),date:String(data.get('date')||todayISO()),venue:String(data.get('venue')||'Los Santos').trim(),notes:String(data.get('notes')||'').trim(),fights:[],createdAt:Date.now()};state.events.push(event);state.counters.totalCreated=(+state.counters.totalCreated||0)+1;if(generate){const count=clamp(parseInt(data.get('fightCount')||'6',10)||6,1,12);const titles=type==='numbered'?clamp(parseInt(data.get('titleCount')||'0',10)||0,0,2):0;generateCard(event,count,titles);}selectedEventId=event.id;saveState();render();toast(`${eventLabel(event)} criado: “${name}”.`);}
function generateCard(e,count=6,titleCount=0){if(e.type!=='numbered')titleCount=0;count=clamp(count,1,12);titleCount=Math.min(titleCount,count,2);e.fights=[];const used=new Set();const titleDivs=new Set();for(let i=0;i<titleCount;i++){const pair=pickTitlePair(e,used,titleDivs);if(!pair)break;const f=createFightObject(e,pair.a,pair.b,pair.division,true,'Luta principal',pair.story);e.fights.push(f);used.add(pair.a.id);used.add(pair.b.id);titleDivs.add(pair.division);}while(e.fights.length<count){const pair=pickRegularPair(used);if(!pair)break;const i=e.fights.length;const slot=slotName(i,count);e.fights.push(createFightObject(e,pair.a,pair.b,pair.division,false,slot,pair.story));used.add(pair.a.id);used.add(pair.b.id);}e.fights.forEach((f,i)=>{if(f.title){const titleFights=e.fights.filter(x=>x.title);f.slot=titleFights.indexOf(f)===titleFights.length-1?'Luta principal':'Co-main event';}else if(i===0)f.slot=slotName(i,e.fights.length);else if(i===1&&!e.fights[0]?.title)f.slot='Co-main event';else f.slot=slotName(i,e.fights.length);});}
function pickTitlePair(e,used,excludedDivs=new Set()){const c=recalculate();const divOptions=DIVISIONS.filter(d=>!excludedDivs.has(d.id)).map(d=>{const fs=(c.ranking[d.id]||[]).filter(f=>!used.has(f.id));const champId=c.champions[d.id];const champ=champId?fs.find(f=>f.id===champId):null;const opponents=fs.filter(f=>f.id!==champId);const last=state.events.filter(x=>x.id!==e.id&&(x.fights||[]).some(f=>f.title&&f.division===d.id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];return {d,fs,champ,opponents,last,eligible:champ?opponents.length>0:fs.length>=2};}).filter(x=>x.eligible);divOptions.sort((a,b)=>{if(!a.last&&!b.last)return a.d.id.localeCompare(b.d.id);if(!a.last)return -1;if(!b.last)return 1;return (a.last.date||'').localeCompare(b.last.date||'');});for(const opt of divOptions){let a,b;if(opt.champ){a=opt.champ;b=opt.opponents[0];}else{a=opt.fs[0];b=opt.fs[1];}if(!a||!b)continue;return {a,b,division:opt.d.id,story:opt.champ?'O campeão precisa confirmar o reinado diante de um desafiante que pode mudar a hierarquia da divisão.':'Cinturão vago: os dois nomes melhor posicionados disponíveis disputam a primeira palavra na divisão.'};}return null;}
function pickRegularPair(used){const c=recalculate();const allCandidates=[];DIVISIONS.forEach(d=>{let fs=(c.ranking[d.id]||[]).filter(f=>!used.has(f.id));const champ=c.champions[d.id];if(fs.filter(f=>f.id!==champ).length>=2)fs=fs.filter(f=>f.id!==champ);if(fs.length<2)return;const appearances={};state.events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).forEach(e=>(e.fights||[]).forEach(f=>{appearances[f.a]=(appearances[f.a]||0)+1;appearances[f.b]=(appearances[f.b]||0)+1;}));for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++){const a=fs[i],b=fs[j];let score=(c.points[a.id]||0)+(c.points[b.id]||0);score-=((appearances[a.id]||0)+(appearances[b.id]||0))*7;if(alreadyFought(a.id,b.id))score-=50;score+=Math.random()*5;allCandidates.push({a,b,division:d.id,score,story:generateStory(a,b,d.id,false)});}});allCandidates.sort((a,b)=>b.score-a.score);return allCandidates[0]||null;}
function createFightObject(e,a,b,division,title=false,slot='',story=''){return {id:uid('fight'),a:a.id,b:b.id,division,title:!!title,rounds:title?5:3,slot:slot||'Card preliminar',story:story||generateStory(a,b,division,title),result:null};}
function addFightsToCount(e,target=6){const used=new Set((e.fights||[]).flatMap(f=>[f.a,f.b]));while(e.fights.length<target){const pair=pickRegularPair(used);if(!pair)break;const i=e.fights.length;e.fights.push(createFightObject(e,pair.a,pair.b,pair.division,false,slotName(i,target),pair.story));used.add(pair.a.id);used.add(pair.b.id);}e.fights.forEach((f,i)=>{if(!f.title)f.slot=slotName(i,e.fights.length);});saveState();render();toast(`Card atualizado: ${e.fights.length} luta(s).`);}
function narrativePick(items){return items[Math.floor(Math.random()*items.length)];}
function fighterArts(f){return Array.isArray(f?.arts)?f.arts.map(x=>String(x).toLowerCase()):[];}

 if(arts.some(x=>x.includes('sambo')))lines.push('alternou a pressão em pé com entradas de queda e controle de tronco, procurando uma transição favorável no solo','misturou desequilíbrios, quedas e pressão por cima para obrigar o rival a defender mais de uma ameaça');

 let line=narrativePick(lines);if(phase==='late'&&s.cardio<70)line+='; o esforço, porém, já começou a cobrar seu preço e a sequência saiu com menos velocidade';else if(phase==='late'&&s.cardio>=82)line+=' e ainda conseguiu manter um ritmo alto apesar do desgaste';return line+'.';}
function fighterDefenseLine(f,opponent,phase){const s=statsFor(f),o=statsFor(opponent);const choices=[];

 let line=narrativePick(choices);if(s.chin<65&&o.power>78)line+='; alguns golpes chegaram a abalar sua estabilidade e obrigaram a uma pausa';else if(s.grappling>=82&&phase!=='opening')line+=' e conseguiu evitar que a troca virasse domínio prolongado do oponente';return line+'.';}
function finishDescription(method,winner,loser){const arts=fighterArts(winner);if(/Finalização/i.test(method)){let hold;if(arts.some(x=>x.includes('jiu-jítsu')))hold=narrativePick(['um estrangulamento pelas costas','uma guilhotina encaixada durante a tentativa de queda','uma chave de braço construída após avançar a posição','um triângulo fechado quando o adversário tentou se levantar']);else if(arts.some(x=>x.includes('sambo')||x.includes('judô')))hold=narrativePick(['uma chave de braço após controlar a queda','um estrangulamento aproveitando a transição no solo','uma chave de perna encaixada durante a scramble']);else hold=narrativePick(['um estrangulamento encaixado na transição','uma chave de braço construída a partir do controle por cima','uma guilhotina quando o adversário tentou entrar nas pernas']);return `${nameWithNick(winner)} aproveitou a reação de ${nameWithNick(loser)} para ajustar ${hold}. A defesa foi ficando cada vez mais difícil, até que ${nameWithNick(loser)} sinalizou a desistência; o árbitro entrou imediatamente e confirmou a vitória por finalização.`;}

function generateFightReport(e,f,result){const a=byId(f.a),b=byId(f.b);if(!a||!b||!result)return null;const winner=result.winnerId?byId(result.winnerId):null;const loser=winner?(winner.id===a.id?b:a):null;const method=result.method||'Resultado registrado';const finishing=/KO|TKO|Finalização|Desqualificação/i.test(method)&&!!winner;const lastRound=clamp(parseInt(result.round||f.rounds||3,10)||3,1,f.rounds||3);const describedRounds=finishing?lastRound:(f.rounds||3);const titleLine=f.title&&e.type==='numbered'?`Disputa de cinturão de ${divObj(f.division).label}. `:'';const hook=f.story?` O contexto que cercava a luta era: ${f.story.trim().replace(/[.!?]+$/,'')}.`:'';

function fightReportText(e,f){const r=f?.result;if(!e||!f||!r)return '';const report=r.report||generateFightReport(e,f,r);const a=byId(f.a),b=byId(f.b),winner=r.winnerId?byId(r.winnerId):null;const lines=[`APEX COMBAT LEAGUE — ${eventLabel(e)}: ${e.name}`,`${fullName(a)} “${a?.nick||''}” vs. ${fullName(b)} “${b?.nick||''}” — ${divObj(f.division).label}`,`RESULTADO: ${winner?nameWithNick(winner)+' venceu':'Empate'} por ${r.method||'resultado registrado'}${r.round?' · Round '+r.round:''}`,'','CONTEXTO DA LUTA',report.opening,''];report.rounds.forEach(x=>{lines.push(`ROUND ${x.number} — ${x.title.toUpperCase()}`,x.text,'');});lines.push('PONTO DE VIRADA',report.turningPoint,'','IMPACTO NA ACL',report.implications,'','TEXTO PARA NARRAÇÃO NO RÁDIO',report.radio);if(Array.isArray(r.liveTranscript)&&r.liveTranscript.length){lines.push('','TRANSCRIÇÃO EM TEMPO REAL');r.liveTranscript.forEach(b=>lines.push(`R${b.round} · ${b.clock} · ${b.kind==='round'?'GONGO':b.kind==='finish'?'RESULTADO':'AO VIVO'}`,b.text));}if(r.note)lines.push('','NOTA EDITORIAL',r.note);return lines.join('\n');}

function simulateFight(f){const a=byId(f.a),b=byId(f.b);if(!a||!b)return null;const sa=statsFor(a),sb=statsFor(b);const scoreA=sa.striking*.23+sa.grappling*.19+sa.cardio*.14+sa.chin*.10+sa.technique*.20+sa.power*.14;const scoreB=sb.striking*.23+sb.grappling*.19+sb.cardio*.14+sb.chin*.10+sb.technique*.20+sb.power*.14;const pA=clamp(1/(1+Math.exp((scoreB-scoreA)/12)),.22,.78);const roll=Math.random();let result;if(roll<.035)result={winnerId:null,method:'Empate majoritário',round:f.rounds,note:'Os juízes não encontraram separação suficiente; a divisão segue sem uma resposta definitiva.'};else{const winner=roll<.035+(1-.035)*pA?a.id:b.id;const winF=byId(winner);const sw=statsFor(winF);const opp=byId(winner===a.id?b.id:a.id);const so=statsFor(opp);let finishChance=.30+((sw.power+sw.striking+sw.grappling)-(so.chin+so.grappling))/220;finishChance=clamp(finishChance,.18,.52);if(f.title)finishChance*=.92;const finish=Math.random()<finishChance;let method,round;if(finish){const subWeight=clamp((sw.grappling+sw.technique)/(sw.striking+sw.power+sw.grappling+sw.technique),.2,.7);const x=Math.random();method=x<subWeight?'Finalização':(x<subWeight+.48?'KO':'TKO');round=1+Math.floor(Math.pow(Math.random(),.68)*f.rounds);}else{method=Math.random()<.20?'Decisão dividida':'Decisão unânime';round=f.rounds;}const note=finish?(method==='Finalização'?'A sequência no chão abriu espaço para a finalização.':`Um ataque limpo mudou o rumo da luta e encerrou o combate por ${method.toLowerCase()}.`):(method==='Decisão dividida'?'Os juízes divergiram em uma luta de margens curtas.':'O vencedor controlou momentos decisivos e levou a melhor na pontuação.');result={winnerId:winner,method,round,note};}result.report=generateFightReport(eventForFight(f),f,result);return result;}

async function startEventTransmission(eventId,redo=false){

async function startNextEventFight(){

  await startLiveFight(e.id,next.id,{eventRun:true});
  const started=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)&&String(state.liveSimulation.eventId)===String(e.id)&&String(state.liveSimulation.fightId)===String(next.id);

   if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}
   render();toast('A fila foi pausada porque a próxima luta não conseguiu iniciar. Confira o erro de gravação e clique em “Transmitir evento” para tentar novamente.');
  }
 }finally{eventTransitionBusy=false;}
}
function ensureEventTransmissionTicker(){if(eventTransmissionTicker)return;eventTransmissionTicker=setInterval(()=>{
 const run=state.eventTransmission;if(!isAdmin||!run||!['running','intermission'].includes(run.status)){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;return;}
 const live=state.liveSimulation&&['running','paused'].includes(state.liveSimulation.status)?state.liveSimulation:null;
 if(live)return;
 if(run.status==='running'||Date.now()>=Number(run.nextFightAt||0))startNextEventFight().catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar a próxima luta'));

async function cancelEventTransmission(reason='cancelled'){
 const run=state.eventTransmission;if(!run||!['running','intermission'].includes(run.status))return;

 if(state.liveSimulation&&String(state.liveSimulation.eventId)===String(run.eventId)&&['running','paused'].includes(state.liveSimulation.status)){
  state.liveSimulation=null;liveOutcomePlan=null;clearLiveTicker();
 }
 if(eventTransmissionTicker){clearInterval(eventTransmissionTicker);eventTransmissionTicker=null;}
 const saved=await saveState();
 if(SUPABASE_CONFIGURED&&isAdmin&&!saved?.ok){state.eventTransmission=oldRun;state.liveSimulation=oldLive;if(oldLive&&oldLive.status==='running')ensureLiveTicker();ensureEventTransmissionTicker();toast('Não consegui salvar o cancelamento do evento. A transmissão continua como estava.');return;}

}

function liveElapsedMs(live){if(!live)return 0;const carried=Math.max(0,Number(live.elapsedBeforePauseMs)||0);return live.status==='running'&&live.startedAt?carried+Math.max(0,Date.now()-Number(live.startedAt)):carried;}

function liveRoundLabelAt(live,wallSeconds){const p=livePeriodAtWall(live,wallSeconds);return p.inRest?`INTERVALO · APÓS ROUND ${p.round}`:`ROUND ${p.round} / ${Math.max(1,Number(live?.rounds)||3)}`;}

 const rounds=Math.max(1,Number(live.rounds)||Number(f.rounds)||3);
 const maxDurationMs=(rounds*ACL_LIVE_ROUND_SECONDS+Math.max(0,rounds-1)*ACL_LIVE_REST_SECONDS)*1000;

function editResultModal(e,f){const current=f.result||{};const winnerDefault=current.winnerId===f.a?'a':current.winnerId===f.b?'b':'draw';openModal(current.winnerId||current.method?'Corrigir resultado':'Definir resultado',`${e.name} · resultado manual substitui a simulação automática desta luta.`, `<form id="resultEditorForm"><input type="hidden" name="eventId" value="${e.id}"><input type="hidden" name="fightId" value="${f.id}"><div class="form-grid"><div class="field"><label>Vencedor</label><select name="winner"><option value="a" ${winnerDefault==='a'?'selected':''}>${esc(fullName(byId(f.a)))} — atleta A</option><option value="b" ${winnerDefault==='b'?'selected':''}>${esc(fullName(byId(f.b)))} — atleta B</option><option value="draw" ${winnerDefault==='draw'?'selected':''}>Empate</option></select></div><div class="field"><label>Método</label><select name="method">${['KO','TKO','Finalização','Decisão unânime','Decisão dividida','Empate majoritário','Empate dividido','Desqualificação'].map(m=>`<option ${current.method===m?'selected':''}>${m}</option>`).join('')}</select></div><div class="field"><label>Round</label><select name="round">${Array.from({length:f.rounds||3},(_,i)=>i+1).map(n=>`<option value="${n}" ${+(current.round||f.rounds)===n?'selected':''}>Round ${n}</option>`).join('')}</select></div><div class="field full"><label>Nota para a narração (opcional)</label><textarea name="note" maxlength="400" placeholder="Ex.: vitória por controle de grade e ground and pound.">${esc(current.note||'')}</textarea></div></div></form>`, `<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit" form="resultEditorForm">Salvar resultado</button>`);}
function saveResultEditor(form){const d=new FormData(form);const e=eventById(String(d.get('eventId')));const f=e?.fights.find(x=>x.id===String(d.get('fightId')));if(!e||!f)return;const win=d.get('winner');const method=String(d.get('method'));const winnerId=win==='a'?f.a:win==='b'?f.b:null;f.result={winnerId,method,round:clamp(parseInt(d.get('round')||String(f.rounds),10)||f.rounds,1,f.rounds||3),note:String(d.get('note')||'').trim()};f.result.report=generateFightReport(e,f,f.result);saveState();closeModal();render();toast('Resultado ajustado. Rankings e cinturões recalculados.');}
function addManualFight(form){const d=new FormData(form);const e=eventById(String(d.get('event-id')||form.dataset.eventId));if(!e)return;const a=byId(String(d.get('a'))),b=byId(String(d.get('b'))),division=String(d.get('division'));if(!a||!b||a.id===b.id){toast('Selecione dois atletas diferentes.');return;}if(a.division!==b.division||a.division!==division){toast('Escolha atletas da mesma divisão selecionada.');return;}if(e.fights.some(f=>f.a===a.id||f.b===a.id||f.a===b.id||f.b===b.id)){toast('Um atleta já está escalado neste card.');return;}const title=d.get('title')==='on';if(title&&e.type!=='numbered'){toast('Fight Night não permite disputas de cinturão.');return;}if(title&&!validTitleParticipants(e,a.id,b.id,division)){toast('Disputa de cinturão precisa incluir o campeão atual; se o cinturão estiver vago, escolha dois atletas da divisão.');return;}e.fights.push(createFightObject(e,a,b,division,title,slotName(e.fights.length,e.fights.length+1),String(d.get('story')||'').trim()));e.fights.forEach((f,i)=>{if(i===0&&!f.title)f.slot='Luta principal';else if(i===1&&!f.title)f.slot='Co-main event';});saveState();render();toast('Luta adicionada ao card.');}
function refreshAddFightFighters(){const form=$('addFightForm');if(!form)return;const div=$('addFightDivision')?.value;const e=eventById(form.dataset.eventId);if(!e)return;const used=new Set(e.fights.flatMap(f=>[f.a,f.b]));const ava=divisionFighters(div).filter(f=>!used.has(f.id));const a=$('addFightA'),b=$('addFightB');if(!a||!b)return;const oldA=a.value,oldB=b.value;const opts=ava.map(f=>`<option value="${f.id}">${esc(fullName(f))} “${esc(f.nick)}”</option>`).join('');a.innerHTML=opts;b.innerHTML=opts;if(ava.some(f=>f.id===oldA))a.value=oldA;if(ava.some(f=>f.id===oldB)&&oldB!==a.value)b.value=oldB;else if(ava.length>1)b.value=ava.find(f=>f.id!==a.value)?.id||ava[0]?.id||'';if(ava.length<2){a.innerHTML='<option value="">Sem atletas disponíveis</option>';b.innerHTML='<option value="">Sem atletas disponíveis</option>';}}
async function handleCreateApplication(form){const d=new FormData(form);const arts=String(d.get('arts')||'').split(',').map(x=>x.trim()).filter(Boolean);if(arts.length===0){toast('Informe ao menos uma arte marcial.');return;}const app={id:uid('application'),first:String(d.get('first')||'').trim(),nick:String(d.get('nick')||'').trim(),last:String(d.get('last')||'').trim(),division:String(d.get('division')),origin:String(d.get('origin')||'').trim(),gym:String(d.get('gym')||'').trim()||'Equipe independente',arts,bio:String(d.get('bio')||'').trim(),status:'pending',createdAt:Date.now()};if(!SUPABASE_CONFIGURED||!supabaseClient){toast('As inscrições ainda não estão conectadas. O administrador precisa configurar o Supabase.');return;}try{const {error}=await supabaseClient.from('acl_applications').insert({first_name:app.first,nick:app.nick,last_name:app.last,division:app.division,origin:app.origin,gym:app.gym,arts:app.arts,bio:app.bio,status:'pending'});if(error)throw error;form.reset();toast('Inscrição enviada para a ACL! Ela ficará pendente até a avaliação.');if(isAdmin)await loadApplicationsFromCloud();render();}catch(err){console.error(err);toast('Não foi possível enviar a ficha. Verifique os campos e tente novamente.');}}
async function approveApplication(id){const app=state.applications.find(a=>a.id===id);if(!app||app.status!=='pending')return;const arts=app.arts||['MMA'];const f={id:uid('fighter'),first:app.first,nick:app.nick,last:app.last,origin:app.origin,base:/Los Santos/i.test(app.origin)?app.origin:'Los Santos — atleta visitante',gym:app.gym||'Equipe independente',division:app.division,age:26,height:175,reach:178,arts,stance:'Ortodoxo',style:styleFor(arts),bio:app.bio,baseRecord:{w:0,l:0,d:0},basePoints:45,stats:{striking:62,grappling:62,cardio:62,chin:62,technique:62,power:62},createdAt:Date.now()};state.fighters.push(f);app.status='approved';app.fighterId=f.id;saveState();await updateApplicationRemote(app);render();toast(`${fullName(f)} aprovado e adicionado ao elenco.`);}
async function deleteFighter(id){
 const f=byId(id);if(!f)return;
 if(SUPABASE_CONFIGURED&&(!supabaseClient||!isAdmin||!cloudLoaded)){toast('A base oficial não está pronta. Entre como administrador antes de excluir atletas.');return;}
 if(!confirm(`Excluir ${fullName(f)}? Suas lutas serão removidas dos cards e o histórico será recalculado. Essa operação não tem desfazer.`))return;
 const previous=JSON.parse(JSON.stringify(state));
 state.fighters=state.fighters.filter(x=>x.id!==id);
 state.events.forEach(e=>{e.fights=e.fights.filter(x=>x.a!==id&&x.b!==id)});
 Object.keys(state.initialChampions||{}).forEach(d=>{if(state.initialChampions[d]===id)state.initialChampions[d]=null;});
 const result=await saveState();
 if(!result?.ok){state=previous;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(_){}render();toast(`Não foi possível excluir o atleta na base oficial: ${result?.error?.message||'falha na gravação'}. Nenhuma alteração foi mantida.`);return;}
 render();toast('Atleta e suas lutas foram removidos. Rankings recalculados.');
}
function deleteEvent(id){const e=eventById(id);if(!e)return;if(!confirm(`Excluir o evento “${e.name}” (${eventLabel(e)}) e todos os seus resultados? Os rankings e cinturões serão recalculados sem esse evento.`))return;state.events=state.events.filter(x=>x.id!==id);selectedEventId=state.events.length?state.events[state.events.length-1].id:null;if(promoEventId===id){promoEventId='';promoText='';}saveState();render();toast('Evento excluído. Ranking e cinturões voltaram a refletir o histórico restante.');}
function createEmptyFromInputs(){const form=$('createEventForm');if(!form)return;const name=$('newEventName').value.trim();if(!name){toast('Digite um nome para o evento.');$('newEventName').focus();return;}createEventFromForm(form,false);}
function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`acl-backup-${todayISO()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Backup JSON exportado. Guarde o arquivo em local seguro.');}
function importJSONFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const incoming=JSON.parse(String(reader.result||''));if(!incoming||!Array.isArray(incoming.fighters)||!Array.isArray(incoming.events)||!incoming.initialChampions)throw new Error('Arquivo não parece ser um backup ACL.');incoming.applications=Array.isArray(incoming.applications)?incoming.applications:[];incoming.liveSimulation=incoming.liveSimulation||null;incoming.eventTransmission=incoming.eventTransmission||null;incoming.counters=incoming.counters||{numbered:0,fightnight:0,totalCreated:incoming.events.length};incoming.events.forEach(e=>{if(!Array.isArray(e.fights))e.fights=[];if(!e.number)e.number=1;e.fights.forEach(f=>{if(!f.id)f.id=uid('fight');if(!('result'in f))f.result=null;});});state=incoming;backfillFightReports();selectedEventId=null;promoEventId='';promoText='';(async()=>{if(isAdmin)await syncLegacyApplications(state.applications);saveState();await cloudSaveQueue;if(isAdmin)await loadApplicationsFromCloud();render();toast('Backup importado. Elenco, eventos e histórico restaurados.');})();}catch(err){alert('Não foi possível importar esse arquivo. Confirme se selecionou um backup JSON da ACL.');}};reader.readAsText(file);}
function mergeSeedRoster(){const seed=makeSeed();const existing=new Set(state.fighters.map(f=>f.id));const names=new Set(state.fighters.map(f=>`${f.first}|${f.last}|${f.division}`.toLowerCase()));let add=0;seed.fighters.forEach(f=>{if(!existing.has(f.id)&&!names.has(`${f.first}|${f.last}|${f.division}`.toLowerCase())){state.fighters.push(f);add++;}});Object.entries(seed.initialChampions).forEach(([d,id])=>{if(!state.initialChampions[d]&&byId(id))state.initialChampions[d]=id;});saveState();render();toast(add?`${add} atleta(s) padrão adicionado(s).`:'O roster padrão já está mesclado.');}
async function clearSeason(){if(!confirm('Apagar TODOS os eventos, cards, resultados e inscrições pendentes? O elenco e os cartéis-base serão mantidos; ranking/cinturões retornam à base.'))return;try{await clearApplicationsRemote();}catch(err){console.error(err);toast('Não foi possível limpar a fila de inscrições no servidor.');return;}state.events=[];state.applications=[];state.counters.totalCreated=0;state.counters.numbered=0;state.counters.fightnight=0;selectedEventId=null;promoEventId='';promoText='';saveState();await cloudSaveQueue;render();toast('Temporada limpa. Rankings e títulos retornaram ao elenco-base.');}
async function resetAll(){if(!confirm('ATENÇÃO: restaurar a ACL inicial apaga todas as suas edições locais, atletas criados, eventos, lutas e inscrições. Exporte um backup antes. Continuar?'))return;try{await clearApplicationsRemote();}catch(err){console.error(err);toast('Não foi possível limpar as inscrições no servidor.');return;}state=makeSeed();selectedEventId=null;promoEventId='';promoText='';saveState();await cloudSaveQueue;render();toast('Banco inicial restaurado.');}
function navigateCreateEvent(){setView('events');setTimeout(()=>$('newEventName')?.focus(),0)}
function refreshPromo(){const e=eventById($('promoEventSelect')?.value||promoEventId)||pickPromoEvent();if(!e){toast('Crie um evento primeiro.');return;}promoEventId=e.id;promoText=promoContent(e);render();toast('Texto promocional atualizado.');}
function copyFightReport(eid,fid){const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(!e||!f?.result)return;const value=fightReportText(e,f);const done=()=>toast('Relato completo copiado. Pronto para usar na narração.');const fallback=()=>{const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{const ok=document.execCommand('copy');toast(ok?'Relato completo copiado.':'Não foi possível copiar automaticamente; abra o relato e copie manualmente.');}catch(err){toast('Não foi possível copiar automaticamente; abra o relato e copie manualmente.');}ta.remove();};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(value).then(done).catch(fallback);else fallback();}
function copyPromo(){const textValue=$('promoText')?.value||promoText;if(!textValue){toast('Não há texto para copiar.');return;}promoText=textValue;const fallback=()=>{const ta=$('promoText');if(ta){ta.focus();ta.select();try{const ok=document.execCommand('copy');toast(ok?'Texto selecionado/copied.':'Selecione o texto e copie manualmente.');}catch(e){toast('Selecione o texto e copie manualmente.');}}};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(textValue).then(()=>toast('Divulgação copiada para a área de transferência.')).catch(fallback);else fallback();}
function downloadPromo(){const textValue=$('promoText')?.value||promoText;const e=eventById(promoEventId);const blob=new Blob([textValue],{type:'text/plain;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`ACL-divulgacao-${(e?.name||'evento').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/gi,'-').replace(/^-|-$/g,'').toLowerCase()}.txt`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Texto promocional baixado em .txt.');}
function printPromo(){const textValue=$('promoText')?.value||promoText;const e=eventById(promoEventId);if(!e)return;const w=window.open('','_blank','width=850,height=900');if(!w){toast('O navegador bloqueou a janela de impressão. Permita pop-ups ou baixe o .txt.');return;}w.document.write(`<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(e.name)} — ACL</title><style>body{font-family:Arial,sans-serif;margin:40px;color:#101820}header{border-bottom:6px solid #ff6b35;padding-bottom:18px}small{letter-spacing:3px;color:#b04417;font-weight:bold}h1{font-size:42px;line-height:1;margin:14px 0}h2{font-size:18px}pre{white-space:pre-wrap;font:14px/1.6 Arial,sans-serif;border-top:1px solid #bbb;padding-top:18px}footer{margin-top:30px;border-top:2px solid #111;padding-top:12px;font-size:11px}
body.public-mode #mainNav [data-view="backup"]{display:none!important}
body.public-mode .fight-actions{display:none!important}
body.public-mode .footer{color:var(--muted)}
#authButton{white-space:nowrap}
</style></head><body><header><small>APEX COMBAT LEAGUE · LOS SANTOS</small><h1>${esc(e.name)}</h1><div>${esc(eventLabel(e))} · ${esc(fmtDate(e.date))} · ${esc(e.venue)}</div></header><h2>CHAMADA OFICIAL</h2><pre>${esc(textValue)}</pre><footer>ACL // FIGHT BUSINESS. LOS SANTOS.</footer><script>window.onload=()=>{window.print();};<\/script></body></html>`);w.document.close();}
function actionClick(btn){const act=btn.dataset.action,id=btn.dataset.id,eid=btn.dataset.eventId,fid=btn.dataset.fightId;
 const publicAllowed=['login','logout','close-modal','go-events','go-rankings','go-promo','go-applications','open-event','copy-fight-report','copy-promo','download-promo','download-promo-png','print-promo','refresh-promo','refresh-public'];if(!isAdmin&&!publicAllowed.includes(act)){toast('Entre como administrador para usar esta função.');return;}
 switch(act){case 'login':openAdminLogin();break;case 'logout':logoutAdmin();break;case 'refresh-public':refreshPublicState();break;case 'go-create-event':navigateCreateEvent();break;case 'go-events':setView('events');break;case 'go-rankings':setView('rankings');break;case 'go-promo':setView('promo');break;case 'go-applications':setView('applications');break;case 'go-promo-for-event':promoEventId=id;promoText=promoContent(eventById(id));setView('promo');break;case 'open-event':selectedEventId=id;setView('events');break;case 'new-fighter':openFighterEditor(null);break;case 'edit-fighter':openFighterEditor(id);break;case 'delete-fighter':deleteFighter(id);break;case 'delete-event':deleteEvent(id);break;case 'simulate-pending':simulateEvent(id,false);break;case 'start-event-transmission':startEventTransmission(id,false).catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar o evento'));break;case 'cancel-event-transmission':if(confirm('Cancelar a sequência automática deste evento? A luta atual também será cancelada sem aplicar resultado.'))cancelEventTransmission('cancelled');break;case 'resimulate-all':simulateEvent(id,true).catch(err=>handleACLTransmissionError(err,'Não foi possível reiniciar o evento'));break;case 'start-live-fight':startLiveFight(eid,fid).catch(err=>handleACLTransmissionError(err,'Não foi possível iniciar a luta'));break;case 'open-live-simulation':openLiveSimulationModal();break;case 'pause-live-sim':pauseLiveSimulation();break;case 'resume-live-sim':resumeLiveSimulation();break;case 'cancel-live-sim':cancelLiveSimulation();break;case 'clear-live-simulation':forceClearLiveSimulation();break;case 'edit-fight':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editFightModal(e,f);break;}case 'edit-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f)editResultModal(e,f);break;}case 'clear-result':{const e=eventById(eid),f=e?.fights.find(x=>x.id===fid);if(e&&f&&confirm('Limpar o resultado desta luta? Cartel, ranking e cinturão serão recalculados.')){f.result=null;saveState();render();toast('Resultado removido.');}break;}case 'delete-fight':{const e=eventById(eid);if(e&&confirm('Excluir esta luta do card? O resultado deixa de contar no ranking.')){e.fights=e.fights.filter(x=>x.id!==fid);saveState();render();toast('Luta removida e ranking recalculado.');}break;}case 'generate-more-fights':{const e=eventById(id);if(e)addFightsToCount(e,6);break;}case 'close-modal':closeModal();break;case 'copy-fight-report':copyFightReport(eid,fid);break;case 'copy-promo':copyPromo();break;case 'download-promo':downloadPromo();break;case 'download-promo-png':downloadPromoPNG();break;case 'refresh-promo':refreshPromo();break;case 'print-promo':printPromo();break;case 'export-json':exportJSON();break;case 'trigger-import':$('importFile').click();break;case 'recalculate':{const c=recalculate();saveState();render();toast(`Recalculado: ${Object.keys(c.records).length} atletas avaliados.`);break;}case 'restore-seed':mergeSeedRoster();break;case 'clear-season':clearSeason();break;case 'reset-all':resetAll();break;case 'approve-application':approveApplication(id);break;case 'reject-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm(`Marcar a ficha de ${app.first} como recusada?`)){app.status='rejected';updateApplicationRemote(app).then(()=>{render();toast('Inscrição marcada como recusada.');});}break;}case 'delete-application':{const app=state.applications.find(a=>a.id===id);if(app&&confirm('Excluir permanentemente esta ficha de inscrição?')){deleteApplicationRemote(id).then(()=>{state.applications=state.applications.filter(a=>a.id!==id);render();toast('Ficha removida.');}).catch(err=>{console.error(err);toast('Não foi possível excluir a ficha no servidor.');});}break;}case 'create-empty-event':createEmptyFromInputs();break;}
}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-view]');if(nav){setView(nav.dataset.view);return;}const btn=e.target.closest('[data-action]');if(btn){actionClick(btn);return;}if(e.target===$('modalBackdrop'))closeModal();});
document.addEventListener('submit',e=>{if(e.target.id==='adminLoginForm'){e.preventDefault();loginAdmin(e.target);return;}if(e.target.id==='applicationForm'){e.preventDefault();handleCreateApplication(e.target);return;}if(!isAdmin&&['createEventForm','editEventForm','fighterEditorForm','fightEditorForm','resultEditorForm','addFightForm'].includes(e.target.id)){e.preventDefault();toast('Entre como administrador para alterar a liga.');return;}if(e.target.id==='createEventForm'){e.preventDefault();createEventFromForm(e.target,true);}else if(e.target.id==='editEventForm'){e.preventDefault();saveEventEdit(e.target);}else if(e.target.id==='fighterEditorForm'){e.preventDefault();saveFighterForm(e.target);}else if(e.target.id==='fightEditorForm'){e.preventDefault();saveFightEditor(e.target);}else if(e.target.id==='resultEditorForm'){e.preventDefault();saveResultEditor(e.target);}else if(e.target.id==='addFightForm'){e.preventDefault();addManualFight(e.target);}});
document.addEventListener('input',e=>{if(e.target.id==='fighterSearch'){fighterSearch=e.target.value;const pos=e.target.selectionStart;render();const next=$('fighterSearch');if(next){next.focus();next.setSelectionRange(pos,pos);}}else if(e.target.id==='promoText'){promoText=e.target.value;}});
document.addEventListener('change',e=>{if(e.target.id==='fighterDivision'){fighterDivision=e.target.value;render();}else if(e.target.id==='rankDivision'){rankDivision=e.target.value;render();}else if(e.target.id==='promoEventSelect'){promoEventId=e.target.value;promoText=promoContent(eventById(promoEventId));render();}else if(e.target.id==='addFightDivision'){refreshAddFightFighters();}else if(e.target.id==='newEventType'){const isNumbered=e.target.value==='numbered';const title=$('newTitleCount');if(title){title.disabled=!isNumbered;if(!isNumbered)title.value='0';else if(title.value==='0')title.value='1';}const warn=$('typeWarning');if(warn)warn.textContent=isNumbered?'Evento numerado: a ACL pode selecionar até duas disputas de cinturão; não é necessário colocar todos os títulos em jogo.':'Fight Night: nenhum cinturão pode ser colocado em jogo. O evento numerado é o formato para disputas de título.';}});
$('importFile').addEventListener('change',e=>{const file=e.target.files?.[0];if(file&&confirm('Importar este backup vai substituir os dados atuais deste navegador. Exporte o estado atual antes se quiser preservá-lo. Continuar?'))importJSONFile(file);e.target.value='';});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
// Normaliza elencos importados e inicia o modo público/administrador após verificar a sessão.
function normalizeState(){state.events.forEach(e=>{e.fights=e.fights||[];if(!e.type)e.type='fightnight';if(e.type==='fightnight')e.fights.forEach(f=>{if(f.title){f.title=false;f.rounds=3;}});});if(!state.counters)state.counters={numbered:0,fightnight:0,totalCreated:state.events.length};if(typeof state.counters.totalCreated!=='number')state.counters.totalCreated=state.events.length;if(!Object.prototype.hasOwnProperty.call(state,'liveSimulation'))state.liveSimulation=null;if(!Object.prototype.hasOwnProperty.call(state,'eventTransmission'))state.eventTransmission=null;if(state.liveSimulation&&Object.prototype.hasOwnProperty.call(state.liveSimulation,'plannedResult'))delete state.liveSimulation.plannedResult;if(state.liveSimulation&&liveSimulationIsStale(state.liveSimulation)){console.warn('ACL: removendo registro de transmissão órfão/expirado.',state.liveSimulation.id);state.liveSimulation=null;}}
normalizeState();initializeApp();
})();
