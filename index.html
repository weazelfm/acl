function makeSeed(){

  const statBase=rank===0?83:rank===1?78:rank===2?73:69;
  const offset=(n*7)%5;
  const stats={striking:clamp(statBase+offset-2,40,99),grappling:clamp(statBase+((n*3)%7)-3,40,99),cardio:clamp(statBase+((n*5)%6)-2,40,99),chin:clamp(statBase+((n*2)%7)-3,40,99),technique:clamp(statBase+((n*11)%5)-1,40,99),power:clamp(statBase+((n*13)%8)-3,40,99)};
  const age=23+((n*3)%13); const height=(di===6?188:di===5?181:di===4?178:di===3?174:di===2?170:di===1?166:di===0?163:160)+((n%5)-2);
  const reach=height+((n%9)-3);
  const f={id,first,nick,last,origin,base:/Los Santos/i.test(origin)?origin:'Los Santos — atleta visitante',gym,division:div,age,height,reach,arts,stance:n%3===0?'Canhoto':'Ortodoxo',style:styleFor(arts),bio:bio+' '+STORY_HOOKS[n%STORY_HOOKS.length],baseRecord:{w:record[0],l:record[1],d:record[2]},basePoints:rank===0?112:100-(rank*8),stats,createdAt:Date.now()+n};
  fighters.push(f); if(rank===0)champs[div]=id;
 }));
 return {schema:1,fighters,events:[],applications:[],initialChampions:champs,counters:{numbered:0,fightnight:0,totalCreated:0},createdAt:Date.now()};
}

function saveState(show=false){
 let localOk=true;
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));if(!SUPABASE_CONFIGURED)setStatus('● Modo demonstração local','grey');}
 catch(e){localOk=false;console.error('Falha no armazenamento local ACL',e);setStatus('! Falha no armazenamento','red');}
 if(!localOk){const error=new Error('O navegador não conseguiu gravar os dados locais.');if(show)toast(error.message);return Promise.resolve({ok:false,error});}
 // Se há configuração do Supabase e uma sessão administrativa, não fingir que salvou
 // quando o cliente/base ainda não terminou de carregar.
 if(SUPABASE_CONFIGURED&&isAdmin&&(!supabaseClient||!cloudLoaded)){
  const error=new Error('A base oficial ainda não terminou de carregar. Atualize a página e entre novamente.');
  setStatus('! Base oficial indisponível','red');if(show)toast(error.message);return Promise.resolve({ok:false,error});
 }
 if(SUPABASE_CONFIGURED&&supabaseClient&&isAdmin&&cloudLoaded){
  const snapshot=JSON.parse(JSON.stringify(state));delete snapshot.applications;
  const pending=cloudSaveQueue.then(async()=>{
   cloudSaving=true;setStatus('● Salvando na nuvem...','blue');
   // RPC SECURITY DEFINER com validação explícita da whitelist admin.
   // Evita falhas inconsistentes de INSERT/UPDATE via upsert sob RLS.
   const {data,error}=await supabaseClient.rpc('acl_save_state',{p_payload:snapshot});
   if(error)throw error;
   if(data!==true)throw new Error('O servidor não confirmou a gravação do estado ACL.');
   setStatus('● Dados compartilhados salvos','lime');return {ok:true};
  }).catch(err=>{
   console.error('Falha ao salvar ACL na nuvem',err);setStatus('! Erro ao salvar na nuvem','red');

   toast(`Falha ao salvar na base oficial: ${detail||'erro de conexão ou permissão'}`);
   return {ok:false,error:err};
  }).finally(()=>{cloudSaving=false;});

 }

}

function recalculate(){
 const comp={};const points={};const stats={};const streak={};
 state.fighters.forEach(f=>{const b=f.baseRecord||{w:0,l:0,d:0};comp[f.id]={w:+b.w||0,l:+b.l||0,d:+b.d||0};points[f.id]=Number.isFinite(+f.basePoints)?+f.basePoints:40;stats[f.id]={fights:0,wins:0,losses:0,draws:0};streak[f.id]={count:0,type:''};});
 const champs={};Object.entries(state.initialChampions||{}).forEach(([d,id])=>{if(id&&byId(id))champs[d]=id;});
 for(const e of sortedEvents()){
  for(const fight of (e.fights||[])){
   if(!fight.result||!byId(fight.a)||!byId(fight.b))continue;
   const a=fight.a,b=fight.b,r=fight.result;if(!comp[a]||!comp[b])continue;
   stats[a].fights++;stats[b].fights++;
   if(r.winnerId===a||r.winnerId===b){const w=r.winnerId,l=w===a?b:a;comp[w].w++;comp[l].l++;stats[w].wins++;stats[l].losses++;
    const finish=/KO|TKO|Submission|Finalização/i.test(r.method||'');points[w]+=finish?8:6;points[l]-=finish?6:4;streak[w].count=streak[w].type==='W'?streak[w].count+1:1;streak[w].type='W';streak[l].count=streak[l].type==='L'?streak[l].count+1:1;streak[l].type='L';
    if(fight.title&&e.type==='numbered')champs[fight.division]=w;
   }else{comp[a].d++;comp[b].d++;stats[a].draws++;stats[b].draws++;points[a]+=1;points[b]+=1;streak[a]={count:0,type:'D'};streak[b]={count:0,type:'D'};}
  }
 }
 const ranking={};DIVISIONS.forEach(d=>{const fs=divisionFighters(d.id).sort((a,b)=>{
  if(champs[d.id]===a.id&&champs[d.id]!==b.id)return -1;if(champs[d.id]===b.id&&champs[d.id]!==a.id)return 1;
  return (points[b.id]||0)-(points[a.id]||0)||(comp[b.id].w-comp[a.id].w)||(comp[a.id].l-comp[b.id].l)||fullName(a).localeCompare(fullName(b));
 });ranking[d.id]=fs;});
 return {records:comp,points,stats,streak,champions:champs,ranking};
}

function suggestedType(){return ((state.counters?.totalCreated||state.events.length)%4)===3?'numbered':'fightnight'}
function statusTag(e){if(eventDone(e))return '<span class="tag lime">CARD ENCERRADO</span>';if(eventResultsCount(e)>0)return '<span class="tag blue">EM ANDAMENTO</span>';return '<span class="tag grey">PROGRAMADO</span>'}
function toast(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function setView(view){if(!isAdmin&&view==='backup'){toast('Esta área é exclusiva da administração.');view='dashboard';}activeView=view;document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render();window.scrollTo({top:0,behavior:'smooth'});}
async function verifyAdminUser(session){if(!session?.user?.id||!supabaseClient)return false;try{const {data,error}=await supabaseClient.from('acl_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(error)throw error;return !!data;}catch(err){console.error('Verificação de administrador falhou',err);return false;}}
function mapApplicationRow(row){return {id:row.id,first:row.first_name,nick:row.nick,last:row.last_name,division:row.division,origin:row.origin,gym:row.gym||'Equipe independente',arts:Array.isArray(row.arts)?row.arts:[],bio:row.bio,status:row.status||'pending',fighterId:row.approved_fighter_id||null,createdAt:row.created_at?new Date(row.created_at).getTime():Date.now()};}
async function loadApplicationsFromCloud(){if(!supabaseClient||!isAdmin){state.applications=[];return;}const {data,error}=await supabaseClient.from('acl_applications').select('*').order('created_at',{ascending:false});if(error)throw error;state.applications=(data||[]).map(mapApplicationRow);}
async function clearApplicationsRemote(){if(!supabaseClient||!isAdmin)return;const {data,error}=await supabaseClient.from('acl_applications').select('id');if(error)throw error;const ids=(data||[]).map(r=>r.id);if(ids.length){const {error:deleteError}=await supabaseClient.from('acl_applications').delete().in('id',ids);if(deleteError)throw deleteError;}}
async function updateApplicationRemote(app){if(!SUPABASE_CONFIGURED||!supabaseClient||!isAdmin||!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(String(app.id)))return;const {error}=await supabaseClient.from('acl_applications').update({status:app.status,approved_fighter_id:app.fighterId||null}).eq('id',app.id);if(error){console.error(error);toast('O estado da inscrição não foi sincronizado. Recarregue a fila.');}}
async function deleteApplicationRemote(id){if(!supabaseClient||!isAdmin||!/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(String(id)))return true;const {error}=await supabaseClient.from('acl_applications').delete().eq('id',id);if(error){console.error(error);throw error;}return true;}
async function syncLegacyApplications(apps){if(!supabaseClient||!isAdmin||!Array.isArray(apps))return;for(const app of apps){if(/^[0-9a-f]{8}-[0-9a-f-]{27}$/i.test(String(app.id)))continue;const {data,error}=await supabaseClient.from('acl_applications').insert({first_name:app.first||'Atleta',nick:app.nick||'Sem apelido',last_name:app.last||'ACL',division:app.division||'light',origin:app.origin||'Los Santos',gym:app.gym||'Equipe independente',arts:Array.isArray(app.arts)&&app.arts.length?app.arts:['MMA'],bio:app.bio||'Ficha migrada de backup antigo.',status:['pending','approved','rejected'].includes(app.status)?app.status:'pending'}).select('id').single();if(!error&&data)app.id=data.id;}}
async function loadSharedState({bootstrap=false}={}){if(!supabaseClient){state=loadState();return;}const {data,error}=await supabaseClient.from('acl_state').select('payload').eq('id',1).maybeSingle();if(error)throw error;cloudStateExists=!!data?.payload;if(data?.payload){const payload=data.payload;state={...makeSeed(),...payload,applications:[]};state.fighters=Array.isArray(payload.fighters)?payload.fighters:makeSeed().fighters;state.events=Array.isArray(payload.events)?payload.events:[];state.initialChampions=payload.initialChampions||{};state.counters=payload.counters||{numbered:0,fightnight:0,totalCreated:state.events.length};normalizeState();if(isAdmin)await loadApplicationsFromCloud();else state.applications=[];cloudLoaded=true;backfillFightReports();if(isAdmin)saveState();return;}
 if(isAdmin){state=loadState();state.applications=Array.isArray(state.applications)?state.applications:[];await syncLegacyApplications(state.applications);cloudLoaded=true;saveState();await cloudSaveQueue;cloudStateExists=true;await loadApplicationsFromCloud();}else{state=makeSeed();state.applications=[];cloudLoaded=true;cloudStateExists=false;}}
async function refreshPublicState(){if(!supabaseClient||!SUPABASE_CONFIGURED){toast('Configure o Supabase para atualizar a base pública.');return;}try{await loadSharedState();render();toast('Informações da ACL atualizadas.');}catch(err){console.error(err);toast('Falha ao atualizar os dados do servidor.');}}
async function initializeApp(){if(!SUPABASE_CONFIGURED){isAdmin=false;cloudUnavailable=false;updateAuthUI();state=loadState();render();return;}if(!window.supabase?.createClient){cloudUnavailable=true;updateAuthUI();render();toast('A biblioteca do Supabase não carregou. Verifique a conexão.');return;}try{supabaseClient=window.supabase.createClient(ACL_CONFIG.supabaseUrl,ACL_CONFIG.supabasePublishableKey);const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;authSession=data.session;isAdmin=await verifyAdminUser(authSession);await loadSharedState({bootstrap:true});cloudUnavailable=false;backfillFightReports();updateAuthUI();render();if(isAdmin)setStatus('● Dados compartilhados salvos','lime');else if(cloudStateExists)setStatus('● Base oficial conectada','blue');else setStatus('● Aguardando ativação admin','grey');}catch(err){console.error('Erro ao iniciar ACL',err);cloudUnavailable=true;isAdmin=false;updateAuthUI();state=makeSeed();render();toast('Não foi possível conectar ao banco. Confira URL, chave, SQL e políticas RLS.');}}
function openAdminLogin(){if(!SUPABASE_CONFIGURED){toast('Configure config.js com a URL e a chave pública do Supabase antes de entrar.');return;}openModal('Acesso administrativo ACL','Entre com a conta de administrador cadastrada no Supabase.',`<form id="adminLoginForm"><div class="form-grid"><div class="field full"><label>E-mail</label><input type="email" name="email" autocomplete="username" required maxlength="160" placeholder="admin@exemplo.com"></div><div class="field full"><label>Senha</label><input type="password" name="password" autocomplete="current-password" required minlength="8" maxlength="128"></div></div><p class="small-text muted" style="margin-top:12px">As contas administrativas são criadas no painel do Supabase; não existe cadastro público de administradores.</p></form>`,`<button class="btn" data-action="close-modal">Cancelar</button><button class="btn primary" type="submit" form="adminLoginForm">Entrar</button>`);}
async function loginAdmin(form){if(!supabaseClient)return;const d=new FormData(form);const {data,error}=await supabaseClient.auth.signInWithPassword({email:String(d.get('email')||'').trim(),password:String(d.get('password')||'')});if(error){toast('Login não realizado. Confira e-mail e senha.');return;}authSession=data.session;isAdmin=await verifyAdminUser(authSession);if(!isAdmin){await supabaseClient.auth.signOut();authSession=null;toast('Esta conta não está autorizada como administradora da ACL.');return;}try{await loadSharedState({bootstrap:true});cloudUnavailable=false;backfillFightReports();updateAuthUI();closeModal();activeView='dashboard';render();saveState();toast('Painel administrativo conectado à base compartilhada.');}catch(err){console.error(err);isAdmin=false;await supabaseClient.auth.signOut();updateAuthUI();toast('Não foi possível carregar os dados da liga. Verifique as políticas RLS.');}}
async function logoutAdmin(){if(supabaseClient)await supabaseClient.auth.signOut();authSession=null;isAdmin=false;state.applications=[];await refreshPublicState();updateAuthUI();activeView='dashboard';render();toast('Sessão administrativa encerrada.');}

function updateAuthUI(){document.body.classList.toggle('public-mode',!isAdmin);const auth=$('authButton');if(auth){auth.dataset.action=isAdmin?'logout':'login';auth.textContent=isAdmin?'Sair do painel admin':'Entrar como administrador';}const appsNav=document.querySelector('#mainNav [data-view="applications"]');if(appsNav)appsNav.textContent=isAdmin?'＋ Inscrições':'＋ Inscrever-se';const backupNav=document.querySelector('#mainNav [data-view="backup"]');if(backupNav)backupNav.style.display=isAdmin?'':'none';if(!SUPABASE_CONFIGURED){setStatus('● Configuração do banco pendente','grey');$('footerStatus').textContent='Modo de demonstração local — configure o Supabase para compartilhar dados.';}else if(cloudUnavailable){setStatus('! Banco indisponível','red');$('footerStatus').textContent='Não foi possível conectar ao banco compartilhado.';}else if(isAdmin){$('footerStatus').textContent='Painel administrativo autenticado · alterações compartilhadas na nuvem.';}else if(!cloudStateExists){setStatus('● Aguardando ativação admin','grey');$('footerStatus').textContent='Prévia do elenco base. O administrador deve entrar uma vez para inicializar a temporada oficial.';}else{$('footerStatus').textContent='Elenco, cards, resultados e rankings oficiais da ACL.';}}
function render(){if(!isAdmin&&activeView==='backup')activeView='dashboard';document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===activeView));const root=$('viewRoot');if(activeView==='dashboard')root.innerHTML=isAdmin?renderDashboard():renderPublicDashboard();else if(activeView==='events')root.innerHTML=renderEvents();else if(activeView==='fighters')root.innerHTML=renderFighters();else if(activeView==='rankings')root.innerHTML=renderRankings();else if(activeView==='promo')root.innerHTML=renderPromo();else if(activeView==='applications')root.innerHTML=renderApplications();else if(activeView==='backup')root.innerHTML=renderBackup();}
function renderDashboard(){const c=recalculate();const upcoming=state.events.filter(e=>!eventDone(e)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))[0];const last=sortedEvents().filter(eventDone).slice(-1)[0];const totalFights=state.events.reduce((n,e)=>n+(e.fights||[]).length,0);const results=state.events.reduce((n,e)=>n+eventResultsCount(e),0);const champCount=Object.keys(c.champions).length;const featured=upcoming||last;
 return `<div class="page-head"><div><div class="eyebrow">Command center / Los Santos</div><h2>O jogo acontece aqui.</h2><p>Controle o elenco, monte cards, simule resultados e transforme cada semana em pauta para o seu programa esportivo.</p></div><div class="actions"><button class="btn primary" data-action="go-create-event">＋ Criar evento</button><button class="btn" data-action="go-promo">✦ Preparar divulgação</button></div></div>
 <div class="grid stats-grid"><div class="stat-card"><div class="stat-top">Atletas ativos <span class="stat-icon">♟</span></div><div class="stat-number">${state.fighters.length}</div><div class="stat-foot">Elenco cadastrado na ACL</div></div><div class="stat-card"><div class="stat-top">Eventos arquivados <span class="stat-icon">◉</span></div><div class="stat-number">${state.events.length}</div><div class="stat-foot">Fight Nights e cards numerados</div></div><div class="stat-card"><div class="stat-top">Cinturões ocupados <span class="stat-icon">♛</span></div><div class="stat-number">${champCount}<span style="font-size:14px;color:var(--muted)">/${DIVISIONS.length}</span></div><div class="stat-foot">Títulos recalculados pelo histórico</div></div><div class="stat-card"><div class="stat-top">Lutas com resultado <span class="stat-icon">✓</span></div><div class="stat-number">${results}<span style="font-size:14px;color:var(--muted)">/${totalFights}</span></div><div class="stat-foot">Resultados automáticos ou ajustados</div></div></div>
 <div class="grid dashboard-grid"><div><div class="hero-event"><div class="mini">${featured?eventLabel(featured)+' // '+(upcoming?'PRÓXIMO CARD':'ÚLTIMO EVENTO'):'APEX COMBAT LEAGUE // TEMPORADA 01'}</div><h3>${featured?esc(featured.name):'Construa a próxima noite de luta.'}</h3><div class="sub">${featured?esc(featured.notes||defaultEventPitch(featured)):'Os próximos cards e resultados são publicados pela direção da ACL e compartilhados com todos os visitantes.'}</div><div class="hero-meta">${featured?`<span>▦ ${esc(fmtDate(featured.date))}</span><span>⌖ ${esc(featured.venue||'Los Santos')}</span><span>⚔ ${(featured.fights||[]).length} lutas</span>`:'<span>⌖ Los Santos, San Andreas</span><span>⚔ Simulação automática habilitada</span>'}</div><div class="actions">${featured?`<button class="btn primary" data-action="open-event" data-id="${featured.id}">Abrir card →</button>`:`<button class="btn primary" data-action="go-create-event">Criar primeiro evento →</button>`}<button class="btn" data-action="go-rankings">Ver rankings</button></div></div>
 <div class="panel"><div class="panel-head"><div><h3>Última movimentação</h3><p>Resultados que mexeram no cenário esportivo</p></div><button class="btn small" data-action="go-events">Ver calendário</button></div>${last&&last.fights.some(f=>f.result)?`<div class="activity-list">${last.fights.filter(f=>f.result).slice().reverse().slice(0,4).map(f=>activityHTML(f,last,c)).join('')}</div>`:`<div class="empty"><strong>A história ainda está em aberto.</strong><p>Simule as lutas de um card para gerar cartel, mudanças de ranking e novas pautas.</p><button class="btn small" data-action="go-create-event">Montar um card</button></div>`}</div></div>
 <div><div class="panel"><div class="panel-head"><div><h3>Campeões da ACL</h3><p>Cinturões recalculados por ordem dos eventos</p></div><span class="tag lime">${champCount} campeões</span></div><div class="belt-list">${championRows(c).map(x=>`<div class="belt-row"><div class="left"><div class="belt-icon">♛</div><div><div class="belt-name">${esc(x.division.label)}</div><div class="belt-div">${esc(x.division.weight)}</div></div></div><div class="belt-champ">${x.f?esc(nameWithNick(x.f)):'VAGO'}<span class="record">${x.f?recordText(c.records[x.f.id]):'Disputa aberta'}</span></div></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><div><h3>Ritmo do calendário</h3><p>Cadência recomendada para a temporada</p></div></div><div class="helper"><strong>3 Fight Nights → 1 evento numerado.</strong><br>Fight Night não tem disputa de cinturão. Em evento numerado, a ACL pode colocar um ou dois títulos em jogo — nunca é obrigatório defender todos.</div><div class="rule"></div><div class="small-text muted">Próximo formato sugerido: <strong style="color:var(--text)">${suggestedType()==='numbered'?'Evento numerado ACL':'Fight Night'}</strong>. Você pode alterar isso na criação para manter controle editorial.</div></div></div></div>`;
}
function renderPublicDashboard(){const c=recalculate();const upcoming=state.events.filter(e=>!eventDone(e)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'))[0];const last=sortedEvents().filter(eventDone).slice(-1)[0];const featured=upcoming||last;const totalFights=state.events.reduce((n,e)=>n+(e.fights||[]).length,0);const results=state.events.reduce((n,e)=>n+eventResultsCount(e),0);return `<div class="page-head"><div><div class="eyebrow">APEX COMBAT LEAGUE / LOS SANTOS</div><h2>O próximo capítulo começa no cage.</h2><p>Acompanhe os eventos, conheça os atletas, confira os rankings e envie sua ficha para tentar entrar na ACL.</p></div><div class="actions"><button class="btn primary" data-view="applications">Inscrever atleta</button><button class="btn" data-view="rankings">Ver rankings</button></div></div><div class="grid stats-grid"><div class="stat-card"><div class="stat-top">Atletas no elenco <span class="stat-icon">♟</span></div><div class="stat-number">${state.fighters.length}</div><div class="stat-foot">Roster oficial da ACL</div></div><div class="stat-card"><div class="stat-top">Eventos <span class="stat-icon">◉</span></div><div class="stat-number">${state.events.length}</div><div class="stat-foot">Fight Nights e cards numerados</div></div><div class="stat-card"><div class="stat-top">Cinturões ativos <span class="stat-icon">♛</span></div><div class="stat-number">${Object.keys(c.champions).length}</div><div class="stat-foot">Campeões atuais por divisão</div></div><div class="stat-card"><div class="stat-top">Lutas decididas <span class="stat-icon">✓</span></div><div class="stat-number">${results}<span style="font-size:14px;color:var(--muted)">/${totalFights}</span></div><div class="stat-foot">Resultados oficiais publicados</div></div></div><div class="grid dashboard-grid"><div><div class="hero-event"><div class="mini">${featured?eventLabel(featured)+' // '+(upcoming?'PRÓXIMO EVENTO':'ÚLTIMO EVENTO'):'APEX COMBAT LEAGUE // LOS SANTOS'}</div><h3>${featured?esc(featured.name):'A temporada está prestes a começar.'}</h3><div class="sub">${featured?esc(featured.notes||defaultEventPitch(featured)):'Fique ligado aos próximos cards, às disputas de ranking e às histórias que vão nascer dentro do octógono.'}</div><div class="hero-meta">${featured?`<span>▦ ${esc(fmtDate(featured.date))}</span><span>⌖ ${esc(featured.venue||'Los Santos')}</span><span>⚔ ${(featured.fights||[]).length} lutas</span>`:'<span>⌖ Los Santos, San Andreas</span><span>⚔ Fight business. Los Santos.</span>'}</div><div class="actions">${featured?`<button class="btn primary" data-action="open-event" data-id="${featured.id}">Ver card completo →</button>`:`<button class="btn primary" data-view="events">Ver calendário →</button>`}<button class="btn" data-view="promo">Divulgação</button></div></div><div class="panel"><div class="panel-head"><div><h3>Últimos resultados</h3><p>O que mudou dentro do cage</p></div><button class="btn small" data-view="events">Todos os eventos</button></div>${last&&last.fights.some(f=>f.result)?`<div class="activity-list">${last.fights.filter(f=>f.result).slice().reverse().slice(0,5).map(f=>activityHTML(f,last,c)).join('')}</div>`:`<div class="empty"><strong>A história está sendo construída.</strong><p>Volte para acompanhar os resultados e os relatos completos dos combates.</p></div>`}</div></div><div><div class="panel"><div class="panel-head"><div><h3>Campeões da ACL</h3><p>O topo de cada divisão</p></div></div><div class="belt-list">${championRows(c).map(x=>`<div class="belt-row"><div class="left"><div class="belt-icon">♛</div><div><div class="belt-name">${esc(x.division.label)}</div><div class="belt-div">${esc(x.division.weight)}</div></div></div><div class="belt-champ">${x.f?esc(nameWithNick(x.f)):'VAGO'}<span class="record">${x.f?recordText(c.records[x.f.id]):'Disputa aberta'}</span></div></div>`).join('')}</div></div><div class="panel"><div class="panel-head"><div><h3>Entre para a ACL</h3><p>Envie a ficha do seu personagem</p></div></div><p class="muted">Crie a história do seu lutador, escolha sua divisão e conte à direção por que merece uma vaga.</p><button class="btn primary" data-view="applications">Enviar inscrição ↗</button></div></div></div>`;}
function renderPublicEvents(){const evts=[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));const selected=eventById(selectedEventId)||evts[0]||null;if(selected)selectedEventId=selected.id;const c=recalculate();return `<div class="page-head"><div><div class="eyebrow">Calendário oficial / ACL</div><h2>Eventos & cards</h2><p>Confira os cards confirmados, resultados e relatos completos. Fight Nights não têm disputas de cinturão.</p></div><div class="actions"><button class="btn" data-action="refresh-public">↻ Atualizar</button><button class="btn primary" data-view="applications">Inscrever atleta</button></div></div><div class="event-layout"><div><div class="panel"><div class="panel-head"><div><h3>Calendário</h3><p>${evts.length} evento(s) publicados</p></div></div>${evts.length?`<div class="list-stack">${evts.map(e=>`<div class="event-card ${selected&&selected.id===e.id?'selected':''}" data-action="open-event" data-id="${e.id}"><div class="actions" style="justify-content:space-between"><span class="tag ${e.type==='numbered'?'lime':'orange'}">${eventLabel(e)}</span>${statusTag(e)}</div><div class="event-card-title">${esc(e.name)}</div><div class="event-card-meta"><span>▦ ${esc(fmtDate(e.date))}</span><span>⚔ ${(e.fights||[]).length} lutas</span></div><div class="event-card-bottom"><span class="small-text muted">${esc(e.venue||'Los Santos')}</span><span class="small-text" style="color:var(--orange2);font-weight:900">Abrir →</span></div></div>`).join('')}</div>`:`<div class="empty"><strong>Primeiro evento em preparação.</strong><p>O calendário será atualizado quando a direção publicar o card.</p></div>`}</div></div><div>${selected?`<div class="panel"><div class="event-headline"><div><div class="actions"><span class="tag ${selected.type==='numbered'?'lime':'orange'}">${eventLabel(selected)}</span>${statusTag(selected)}</div><h3>${esc(selected.name)}</h3><div class="small-text muted">${esc(fmtDate(selected.date))} · ${esc(selected.venue||'Local a definir')}</div></div></div>${selected.notes?`<p class="muted">${esc(selected.notes)}</p>`:''}<div class="event-details-grid"><div class="detail-tile"><span>Lutas no card</span><strong>${selected.fights.length}</strong></div><div class="detail-tile"><span>Resultados</span><strong>${eventResultsCount(selected)} / ${selected.fights.length}</strong></div><div class="detail-tile"><span>Cinturões</span><strong>${selected.type==='fightnight'?'0 (bloqueado)':selected.fights.filter(f=>f.title).length+' em disputa'}</strong></div></div></div><div class="panel"><div class="panel-head"><div><h3>Card de lutas</h3><p>Relatos completos liberados após os resultados</p></div></div>${selected.fights.length?selected.fights.map((f,i)=>renderPublicFightCard(selected,f,i,c)).join(''):`<div class="empty">Este card ainda não foi publicado por completo.</div>`}</div>`:`<div class="panel"><div class="empty"><strong>Nenhum evento publicado.</strong><p>Confira novamente em breve.</p></div></div>`}</div></div>`;}
function renderPublicFightCard(e,f,i,c){return renderFightCard(e,f,i,c).replace(/<div class="fight-actions">[\s\S]*?<\/div>/,'');}
function renderPublicFighters(){const c=recalculate();const filtered=state.fighters.filter(f=>{const q=fighterSearch.toLowerCase();return (!q||[f.first,f.nick,f.last,f.origin,f.base,f.gym,(f.arts||[]).join(' '),divObj(f.division).label].join(' ').toLowerCase().includes(q))&&(fighterDivision==='all'||f.division===fighterDivision)}).sort((a,b)=>fullName(a).localeCompare(fullName(b)));return `<div class="page-head"><div><div class="eyebrow">Roster oficial / Los Santos</div><h2>Conheça os atletas</h2><p>Cartéis, academias, artes marciais e histórias dos nomes que movimentam a ACL.</p></div><div class="actions"><button class="btn primary" data-view="applications">Tentar entrar na ACL</button></div></div><div class="toolbar"><div class="field"><label for="fighterSearch">Buscar atleta</label><input id="fighterSearch" placeholder="Nome, apelido, academia, origem..." value="${esc(fighterSearch)}"></div><div class="field"><label for="fighterDivision">Divisão</label><select id="fighterDivision"><option value="all">Todas as divisões</option>${DIVISIONS.map(d=>`<option value="${d.id}" ${fighterDivision===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div><span class="tag grey">${filtered.length} atletas</span></div>${filtered.length?`<div class="grid fighters-grid">${filtered.map(f=>fighterCard(f,c).replace(/<div class="actions"><button class="btn small" data-action="edit-fighter"[\s\S]*?<\/div>/,'')).join('')}</div>`:`<div class="empty"><strong>Nenhum atleta encontrado.</strong><p>Altere a busca ou confira outra divisão.</p></div>`}`;}
function renderPublicApplications(){return `<div class="page-head"><div><div class="eyebrow">Fighter intake / inscrições abertas</div><h2>Inscreva seu lutador</h2><p>Envie sua ficha para a direção da Apex Combat League. A inscrição ficará pendente até a avaliação administrativa.</p></div><div class="actions"><span class="tag orange">AVALIAÇÃO DA ACL</span></div></div><div class="grid dashboard-grid"><div class="panel"><div class="panel-head"><div><h3>Ficha de inscrição</h3><p>Use os dados do personagem do seu roleplay.</p></div></div><form id="applicationForm"><div class="form-grid"><div class="field"><label>Nome *</label><input name="first" required maxlength="35" placeholder="Primeiro nome"></div><div class="field"><label>Apelido de luta *</label><input name="nick" required maxlength="35" placeholder="Como será anunciado"></div><div class="field"><label>Sobrenome *</label><input name="last" required maxlength="35" placeholder="Sobrenome do atleta"></div><div class="field"><label>Divisão *</label><select name="division" required>${DIVISIONS.map(d=>`<option value="${d.id}">${esc(d.label)} (${esc(d.weight)})</option>`).join('')}</select></div><div class="field full"><label>Origem / cidade / país *</label><input name="origin" required maxlength="90" placeholder="Ex.: Rancho, Los Santos"></div><div class="field full"><label>Academia / equipe</label><input name="gym" maxlength="80" placeholder="Nome da equipe ou academia"></div><div class="field full"><label>Artes marciais praticadas *</label><input name="arts" required maxlength="120" placeholder="Ex.: Boxe, Wrestling, Jiu-jítsu"></div><div class="field full"><label>História do personagem e estilo de luta *</label><textarea name="bio" required minlength="15" maxlength="700" placeholder="Conte de onde veio, como luta e por que merece uma vaga na ACL."></textarea></div></div><div class="actions" style="margin-top:13px"><button type="submit" class="btn primary">Enviar para avaliação</button></div></form><div class="notice">A candidatura não garante entrada imediata no elenco. A direção revisará a ficha antes de aprová-la.</div></div><div class="panel"><div class="panel-head"><div><h3>Como funciona</h3><p>Do cadastro à estreia</p></div></div><div class="list-stack"><div class="belt-row"><div><div class="belt-name">1. Envie a ficha</div><div class="belt-div">Descreva um personagem original e sua base de luta.</div></div></div><div class="belt-row"><div><div class="belt-name">2. Aguarde avaliação</div><div class="belt-div">A equipe verifica divisão, estilo e história.</div></div></div><div class="belt-row"><div><div class="belt-name">3. Entre no roster</div><div class="belt-div">Após a aprovação, o atleta aparece no elenco oficial.</div></div></div></div></div></div>`;}
function activityHTML(f,e,c){const a=byId(f.a),b=byId(f.b),r=f.result;if(!a||!b||!r)return '';const winner=r.winnerId?byId(r.winnerId):null;return `<div class="activity-row"><div><div style="font-size:12px;font-weight:850">${winner?esc(fullName(winner)):'Empate'} <span class="muted">${winner?'venceu':'entre'}</span> ${winner?esc(''):`${esc(fullName(a))} e ${esc(fullName(b))}`}</div><div class="small-text muted">${esc(e.name)} · ${esc(r.method)}${r.round?' · R'+r.round:''}</div></div><span class="tag ${f.title?'lime':'grey'}">${f.title?'TÍTULO':'RESULTADO'}</span></div>`;}
function renderEvents(){if(!isAdmin)return renderPublicEvents();const evts=[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.createdAt||0)-(a.createdAt||0));const selected=eventById(selectedEventId)||evts[0]||null;if(selected)selectedEventId=selected.id;
 const suggestion=suggestedType();return `<div class="page-head"><div><div class="eyebrow">Matchmaking / agenda</div><h2>Eventos & cards</h2><p>Dê um nome próprio a cada edição, gere confrontos automaticamente e edite qualquer parte do card depois de criado.</p></div><div class="actions"><span class="tag ${suggestion==='numbered'?'lime':'orange'}">Sugestão: ${suggestion==='numbered'?'ACL numerado':'Fight Night'}</span></div></div>
 <div class="event-layout"><div><div class="panel"><div class="panel-head"><div><h3>Nova edição</h3><p>O nome é obrigatório e nunca será repetido automaticamente.</p></div><span class="tag orange">NOVO CARD</span></div><form id="createEventForm"><div class="form-grid"><div class="field full"><label for="newEventName">Nome do evento *</label><input id="newEventName" name="name" required maxlength="90" placeholder="Ex.: Noite de Acerto de Contas"></div><div class="field"><label for="newEventType">Formato *</label><select id="newEventType" name="type"><option value="fightnight" ${suggestion==='fightnight'?'selected':''}>Fight Night — sem cinturão</option><option value="numbered" ${suggestion==='numbered'?'selected':''}>Evento numerado ACL — títulos permitidos</option></select></div><div class="field"><label for="newEventDate">Data do evento</label><input id="newEventDate" name="date" type="date" value="${todayISO()}"></div><div class="field full"><label for="newEventVenue">Local / arena</label><input id="newEventVenue" name="venue" value="Maze Bank Arena, Los Santos" maxlength="100"></div><div class="field"><label for="newFightCount">Quantidade de lutas</label><select id="newFightCount" name="fightCount"><option>4</option><option selected>6</option><option>8</option><option>10</option></select></div><div class="field" id="titleCountWrap"><label for="newTitleCount">Disputas de cinturão</label><select id="newTitleCount" name="titleCount" ${suggestion!=='numbered'?'disabled':''}><option value="0">Nenhuma</option><option value="1" ${suggestion==='numbered'?'selected':''}>1 — luta principal</option><option value="2">2 — card especial</option></select></div><div class="field full"><label for="newEventNotes">Contexto / gancho editorial (opcional)</label><textarea id="newEventNotes" name="notes" rows="3" placeholder="Ex.: dois prospectos disputam espaço no ranking; o campeão pediu um adversário que ainda não enfrentou."></textarea></div></div><div id="typeWarning" class="helper" style="margin-top:13px">Fight Night: nenhum cinturão pode ser colocado em jogo. O evento numerado é o formato para disputas de título.</div><div class="actions" style="margin-top:14px"><button class="btn primary" type="submit">＋ Criar evento e montar card</button><button class="btn" type="button" data-action="create-empty-event">Criar vazio</button></div></form></div><div class="notice">A numeração do tipo é gerada separadamente (Fight Night #01, ACL #01 etc.). O nome que você digitar vira o título editorial do evento. Apagar uma edição não apaga outras nem reaproveita o número.</div>
 <div class="panel" style="margin-top:16px"><div class="panel-head"><div><h3>Calendário da ACL</h3><p>${evts.length} edição(ões) no arquivo</p></div><span class="tag grey">${evts.filter(e=>!eventDone(e)).length} em aberto</span></div>${evts.length?`<div class="list-stack">${evts.map(e=>`<div class="event-card ${selected&&selected.id===e.id?'selected':''}" data-action="open-event" data-id="${e.id}"><div class="actions" style="justify-content:space-between"><span class="tag ${e.type==='numbered'?'lime':'orange'}">${eventLabel(e)}</span>${statusTag(e)}</div><div class="event-card-title">${esc(e.name)}</div><div class="event-card-meta"><span>▦ ${esc(fmtDate(e.date))}</span><span>⚔ ${(e.fights||[]).length} lutas</span></div><div class="event-card-bottom"><span class="small-text muted">${esc(e.venue||'Los Santos')}</span><span class="small-text" style="color:var(--orange2);font-weight:900">Abrir →</span></div></div>`).join('')}</div>`:`<div class="empty"><strong>Nenhum evento criado ainda.</strong><p>Escolha um nome acima e monte o primeiro card.</p></div>`}</div></div>
 <div>${selected?renderEventDetail(selected):`<div class="panel"><div class="empty"><strong>Selecione ou crie um evento.</strong><p>O editor completo do card aparecerá aqui.</p></div></div>`}</div></div>`;
}
function defaultEventPitch(e){return e.type==='fightnight'?'Noite de confronto e movimentação do ranking. Sem cinturões em disputa: cada vitória pode mudar o caminho até a próxima chance.':'Um palco maior para lutas decisivas. O evento numerado pode ter disputas de título selecionadas pela direção da ACL.'}
function renderEventDetail(e){const c=recalculate();const titleFights=(e.fights||[]).filter(f=>f.title).length;return `<div class="panel"><div class="event-headline"><div><div class="actions"><span class="tag ${e.type==='numbered'?'lime':'orange'}">${eventLabel(e)}</span>${statusTag(e)}</div><h3>${esc(e.name)}</h3><div class="small-text muted">${esc(fmtDate(e.date))} · ${esc(e.venue||'Local a definir')}</div></div><button class="btn danger small" data-action="delete-event" data-id="${e.id}">Excluir evento</button></div>
 <div class="event-details-grid"><div class="detail-tile"><span>Lutas no card</span><strong>${e.fights.length}</strong></div><div class="detail-tile"><span>Resultados</span><strong>${eventResultsCount(e)} / ${e.fights.length}</strong></div><div class="detail-tile"><span>Cinturões</span><strong>${e.type==='fightnight'?'0 (bloqueado)':titleFights+' em disputa'}</strong></div></div>
 <div class="rule"></div><div class="panel-head"><div><h3>Editar informações do evento</h3><p>O nome, a data, o formato, o local e o contexto podem ser alterados.</p></div></div><form id="editEventForm" data-id="${e.id}"><div class="form-grid"><div class="field full"><label>Nome do evento *</label><input name="name" required value="${esc(e.name)}" maxlength="90"></div><div class="field"><label>Formato</label><select name="type"><option value="fightnight" ${e.type==='fightnight'?'selected':''}>Fight Night — sem cinturão</option><option value="numbered" ${e.type==='numbered'?'selected':''}>Evento numerado ACL</option></select></div><div class="field"><label>Data</label><input name="date" type="date" value="${esc(e.date||'')}"></div><div class="field full"><label>Local / arena</label><input name="venue" value="${esc(e.venue||'')}" maxlength="100"></div><div class="field full"><label>Contexto / gancho editorial</label><textarea name="notes" rows="3" placeholder="O que está em jogo para esta edição?">${esc(e.notes||'')}</textarea></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" type="submit">Salvar alterações</button><button class="btn" type="button" data-action="go-promo-for-event" data-id="${e.id}">Preparar divulgação ↗</button></div></form></div>
 <div class="panel"><div class="panel-head"><div><h3>Card de lutas</h3><p>Resultados são simulados automaticamente, mas você pode editar ou corrigir qualquer decisão.</p></div><div class="actions"><button class="btn primary small" data-action="simulate-pending" data-id="${e.id}" ${e.fights.every(f=>f.result)?'disabled':''}>▶ Simular pendentes</button><button class="btn small" data-action="resimulate-all" data-id="${e.id}" ${!e.fights.length?'disabled':''}>↻ Refazer tudo</button></div></div>
 ${e.fights.length?e.fights.map((f,i)=>renderFightCard(e,f,i,c)).join(''):`<div class="empty"><strong>Este card ainda não tem lutas.</strong><p>Adicione os confrontos manualmente ou gere um card automático.</p></div>`}
 <div class="rule"></div><div class="panel-head"><div><h3>Adicionar confronto</h3><p>Atletas devem ser da mesma divisão. Cada atleta só luta uma vez no mesmo card.</p></div></div>${renderAddFightForm(e)}</div>`;}
function renderFightCard(e,f,i,c){const a=byId(f.a),b=byId(f.b);if(!a||!b)return '';const r=f.result;const winner=r?.winnerId?byId(r.winnerId):null;return `<div class="fight-card"><div class="fight-top"><div><div class="fight-slot">${esc(f.slot||slotName(i,e.fights.length))} · ${esc(divObj(f.division).label)} · ${f.rounds||3} rounds</div><div class="fighter-meta"><span class="tag ${f.title?'lime':'grey'}">${f.title?'♛ DISPUTA DE CINTURÃO':'LUTA CASADA'}</span>${f.title&&e.type!=='numbered'?'<span class="tag red">FORMATO INVÁLIDO</span>':''}</div></div><span class="small-text muted">${String(i+1).padStart(2,'0')}</span></div><div class="fighters-vs"><div class="fighter-side"><div class="fighter-name">${esc(fullName(a))}</div><div class="fighter-nick">“${esc(a.nick||'Sem apelido')}”</div><div class="fighter-record">${recordText(c.records[a.id])} · ${esc(a.base||a.origin)}</div></div><div class="vs">VS</div><div class="fighter-side right"><div class="fighter-name">${esc(fullName(b))}</div><div class="fighter-nick">“${esc(b.nick||'Sem apelido')}”</div><div class="fighter-record">${recordText(c.records[b.id])} · ${esc(b.base||b.origin)}</div></div></div>${r?`<div class="fight-result"><strong style="color:${winner?'var(--green)':'var(--orange2)'}">${winner?esc(fullName(winner))+' venceu':'Empate'}</strong> · ${esc(r.method||'Resultado manual')}${r.round?' · Round '+r.round:''}${r.note?`<div class="small-text muted" style="margin-top:4px">${esc(r.note)}</div>`:''}</div>${renderFightReport(e,f)}`:`<div class="fight-result pending">⏳ Resultado pendente — pronto para simulação automática.</div>`}${f.story?`<div class="fight-story"><strong>Gancho editorial:</strong> ${esc(f.story)}</div>`:''}<div class="fight-actions"><button class="btn small" data-action="edit-fight" data-event-id="${e.id}" data-fight-id="${f.id}">Editar luta</button><button class="btn small" data-action="edit-result" data-event-id="${e.id}" data-fight-id="${f.id}">${r?'Corrigir resultado':'Definir resultado'}</button>${r?`<button class="btn small" data-action="clear-result" data-event-id="${e.id}" data-fight-id="${f.id}">Limpar resultado</button>`:''}<button class="btn danger small" data-action="delete-fight" data-event-id="${e.id}" data-fight-id="${f.id}">Excluir</button></div></div>`;}
function slotName(i,total){if(i===0)return 'Luta principal';if(i===1)return 'Co-main event';if(i<Math.max(3,total-2))return 'Card principal';return 'Card preliminar';}
function renderAddFightForm(e){const used=new Set((e.fights||[]).flatMap(f=>[f.a,f.b]));const firstDiv=DIVISIONS.find(d=>divisionFighters(d.id).filter(f=>!used.has(f.id)).length>=2)?.id||DIVISIONS[0].id;const options=DIVISIONS.map(d=>`<option value="${d.id}" ${d.id===firstDiv?'selected':''}>${esc(d.label)}</option>`).join('');const available=divisionFighters(firstDiv).filter(f=>!used.has(f.id));return `<form id="addFightForm" data-event-id="${e.id}"><div class="form-grid three"><div class="field"><label>Divisão</label><select name="division" id="addFightDivision">${options}</select></div><div class="field"><label>Atleta A</label><select name="a" id="addFightA">${available.map((f,i)=>`<option value="${f.id}">${esc(fullName(f))}${i===0?' · topo do ranking':''}</option>`).join('')}</select></div><div class="field"><label>Atleta B</label><select name="b" id="addFightB">${available.slice(1).concat(available.slice(0,1)).map((f,i)=>`<option value="${f.id}" ${i===0?'selected':''}>${esc(fullName(f))}</option>`).join('')}</select></div><div class="field full"><label>Gancho editorial da luta (opcional)</label><input name="story" maxlength="300" placeholder="Ex.: o vencedor pode entrar no top 5 da divisão"></div><div class="field full"><label class="checkline"><input type="checkbox" name="title" ${e.type!=='numbered'?'disabled':''}> Disputa de cinturão ${e.type!=='numbered'?'(bloqueada em Fight Night)':''}</label></div></div><div class="actions" style="margin-top:12px"><button class="btn primary" type="submit">＋ Adicionar luta</button><button class="btn" type="button" data-action="generate-more-fights" data-id="${e.id}">Gerar lutas até completar 6</button></div></form>`;}
function renderFighters(){if(!isAdmin)return renderPublicFighters();const c=recalculate();const filtered=state.fighters.filter(f=>{const q=fighterSearch.toLowerCase();return (!q||[f.first,f.nick,f.last,f.origin,f.base,f.gym,f.arts.join(' '),divObj(f.division).label].join(' ').toLowerCase().includes(q))&&(fighterDivision==='all'||f.division===fighterDivision)}).sort((a,b)=>fullName(a).localeCompare(fullName(b)));return `<div class="page-head"><div><div class="eyebrow">Roster management / cadastro</div><h2>O elenco da ACL</h2><p>Perfis completos para narração: origem, academia, artes marciais, cartel, atributos e gancho de personagem. Edite, cadastre ou remova atletas quando quiser.</p></div><div class="actions"><button class="btn primary" data-action="new-fighter">＋ Cadastrar atleta</button><button class="btn" data-action="go-applications">Ver inscrições</button></div></div><div class="toolbar"><div class="field"><label for="fighterSearch">Buscar atleta</label><input id="fighterSearch" placeholder="Nome, apelido, academia, origem..." value="${esc(fighterSearch)}"></div><div class="field"><label for="fighterDivision">Divisão</label><select id="fighterDivision"><option value="all">Todas as divisões</option>${DIVISIONS.map(d=>`<option value="${d.id}" ${fighterDivision===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div><span class="tag grey">${filtered.length} atletas</span></div>${filtered.length?`<div class="grid fighters-grid">${filtered.map(f=>fighterCard(f,c)).join('')}</div>`:`<div class="empty"><strong>Nenhum atleta encontrado.</strong><p>Altere a busca ou cadastre um novo nome para a ACL.</p><button class="btn primary" data-action="new-fighter">Cadastrar atleta</button></div>`}`;}
function initials(f){return ((f.first||'?')[0]+(f.last||'?')[0]).toUpperCase()}
function rankPos(f,c){const arr=c.ranking[f.division]||[];return c.champions[f.division]===f.id?'CAMPEÃO':String(arr.findIndex(x=>x.id===f.id)+(c.champions[f.division]&&arr[0]?.id===c.champions[f.division]?0:1));}
function fighterCard(f,c){const st=statsFor(f),r=c.records[f.id]||f.baseRecord;const champ=c.champions[f.division]===f.id;return `<article class="fighter-card"><div class="fighter-card-top"><div class="fighter-avatar">${initials(f)}</div><div class="actions"><button class="btn small" data-action="edit-fighter" data-id="${f.id}">Editar</button><button class="btn danger small" data-action="delete-fighter" data-id="${f.id}">×</button></div></div><h3>${esc(fullName(f))}</h3><div class="nickname">“${esc(f.nick||'Sem apelido')}”</div><div class="fighter-meta"><span class="tag ${champ?'lime':'grey'}">${champ?'♛ CAMPEÃO':`RANK #${esc(rankPos(f,c))}`}</span><span class="tag blue">${recordText(r)}</span></div><div class="fighter-meta"><span class="small-text muted">Origem: ${esc(f.origin||'Não informada')}</span></div><div class="fighter-meta"><span class="small-text muted">⌖ Luta por: ${esc(f.base||'Los Santos')}</span></div><div class="fighter-meta"><span class="small-text muted">⌂ Academia: ${esc(f.gym||'Equipe independente')}</span></div><div class="arts">${(f.arts||[]).map(a=>`<span class="art-chip">${esc(a)}</span>`).join('')}</div><p class="fighter-story">${esc(f.bio||'Sem biografia cadastrada. Edite o perfil para adicionar contexto de narração.')}</p><div class="attribute-bars">${[['STR',st.striking],['GRP',st.grappling],['GÁS',st.cardio],['QUEIXO',st.chin],['TÉC',st.technique]].map(([l,v])=>`<div class="attr"><strong>${v}</strong><div class="bar"><span style="width:${v}%"></span></div><span>${l}</span></div>`).join('')}</div><div class="card-footer"><span class="small-text muted">${esc(divObj(f.division).label)} · ${f.age||'—'} anos</span><span class="small-text" style="font-weight:900">${c.points[f.id]??f.basePoints} pts</span></div></article>`;}
function renderRankings(){const c=recalculate();const divs=rankDivision==='all'?DIVISIONS:DIVISIONS.filter(d=>d.id===rankDivision);return `<div class="page-head"><div><div class="eyebrow">Competitive landscape / standings</div><h2>Rankings & cinturões</h2><p>A classificação é calculada a partir do cartel inicial e de todos os resultados salvos. Ao editar ou apagar um evento, o ranking e os campeões são reconstruídos automaticamente.</p></div><div class="actions"><span class="tag lime">Histórico reversível</span></div></div><div class="toolbar"><div class="field"><label for="rankDivision">Filtrar divisão</label><select id="rankDivision"><option value="all">Todas as divisões</option>${DIVISIONS.map(d=>`<option value="${d.id}" ${rankDivision===d.id?'selected':''}>${esc(d.label)}</option>`).join('')}</select></div><span class="tag grey">Pontos dinâmicos</span></div><div class="grid rank-layout">${divs.map(d=>{const fs=c.ranking[d.id]||[];const champ=c.champions[d.id];return `<section class="rank-panel"><div class="rank-head"><div><h3>${esc(d.label)}</h3><div class="small-text muted">${esc(d.weight)} · ${fs.length} atletas</div></div><span class="tag ${champ?'lime':'red'}">${champ?'CINTURÃO ATIVO':'CINTURÃO VAGO'}</span></div>${champ?'<div class="title-rule"></div>':''}${fs.map((f,i)=>{const isChamp=champ===f.id;const r=c.records[f.id];const s=c.stats[f.id];return `<div class="rank-row ${isChamp?'champ':''}"><div class="rank-pos">${isChamp?'♛':(i+(champ?0:1))}</div><div class="rank-person"><strong>${esc(fullName(f))} ${isChamp?'<span style="color:var(--lime)">· C</span>':''}</strong><span>“${esc(f.nick||'—')}” · ${esc(f.gym||f.base||f.origin)}</span></div><div class="rank-numbers">${recordText(r)}<small>${c.points[f.id]??0} pts · ${s.fights} ACL</small></div></div>`}).join('')||'<div class="empty">Sem atletas nesta divisão.</div>'}</section>`}).join('')}</div><div class="notice">Regra de cálculo: cada vitória melhora a pontuação (finalização/KO vale mais que decisão), derrotas reduzem pontos e empates dão um pequeno ajuste. O campeão é exibido separado no topo. Lutas passadas e títulos são reprocessados na ordem cronológica do evento.</div>`;}
function pickPromoEvent(){let e=eventById(promoEventId);if(e)return e;const upcoming=state.events.filter(x=>!eventDone(x)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999'));return upcoming[0]||[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||null;}
function promoContent(e){if(!e)return 'APEX COMBAT LEAGUE\n\nAinda não há evento cadastrado. Crie um evento e monte seu card para gerar a divulgação.';const c=recalculate();const f=e.fights||[];const head=f[0];const a=head?byId(head.a):null,b=head?byId(head.b):null;const lines=[];lines.push(`🥊 APEX COMBAT LEAGUE — ${eventLabel(e)}: ${e.name}`);lines.push(`📅 ${fmtDate(e.date,{weekday:'long',day:'2-digit',month:'long',year:'numeric'})} | 📍 ${e.venue||'Los Santos, San Andreas'}`);lines.push('');lines.push(e.type==='fightnight'?'LOS SANTOS, É NOITE DE RANKING. Sem cinturões em disputa: cada vitória muda a conversa, cada derrota aperta o caminho até o topo.':'LOS SANTOS RECEBE UM EVENTO NUMERADO. A ACL reservou o cage para confrontos de alto impacto e disputas de título selecionadas.');lines.push('');if(head){lines.push(`🔥 LUTA PRINCIPAL — ${fullName(a)} “${a.nick}” (${recordText(c.records[a.id])}) vs. ${fullName(b)} “${b.nick}” (${recordText(c.records[b.id])})`);lines.push(`${divObj(head.division).label}${head.title?' · CINTURÃO EM JOGO':''}`);lines.push('');}lines.push('CARD CONFIRMADO');f.forEach((fight,i)=>{const fa=byId(fight.a),fb=byId(fight.b);if(!fa||!fb)return;const match=`${i+1}. ${fullName(fa)} “${fa.nick}” vs. ${fullName(fb)} “${fb.nick}” — ${divObj(fight.division).label}${fight.title?' [DISPUTA DE CINTURÃO]':''}`;lines.push(match);if(fight.story)lines.push(`   Gancho: ${fight.story}`);});if(e.notes){lines.push('');lines.push('O QUE ESTÁ EM JOGO');lines.push(e.notes);}const titleCount=f.filter(x=>x.title).length;if(e.type==='fightnight'){lines.push('');lines.push('📊 Sem disputas de cinturão nesta edição. O foco é ranking, prospectos e definição dos próximos desafiantes.');}else if(titleCount){lines.push('');lines.push(`🏆 ${titleCount} disputa(s) de cinturão confirmada(s). Não são todos os títulos da ACL — apenas as divisões selecionadas para este card.`);}lines.push('');lines.push('APEX COMBAT LEAGUE — A reputação é construída dentro do cage.');lines.push('#ACL #LosSantos #FightNight');return lines.join('\n');}
function renderPromo(){const e=pickPromoEvent();if(e)promoEventId=e.id;const choices=[...state.events].sort((a,b)=>(b.date||'').localeCompare(a.date||''));if(!promoText||!promoEventId)promoText=promoContent(e);return `<div class="page-head"><div><div class="eyebrow">Media room / press & hype</div><h2>Coloque o card na rua.</h2><p>Monte uma chamada pronta para Discord, redes sociais ou abertura do programa. O texto é editável antes de copiar, e inclui cartel, lutas principais e o que está em jogo.</p></div><div class="actions"><button class="btn" data-action="go-events">Editar card ↗</button></div></div>${state.events.length?`<div class="toolbar no-print"><div class="field"><label for="promoEventSelect">Evento para divulgar</label><select id="promoEventSelect">${choices.map(x=>`<option value="${x.id}" ${x.id===e?.id?'selected':''}>${esc(eventLabel(x))} — ${esc(x.name)}</option>`).join('')}</select></div><button class="btn primary" data-action="refresh-promo">⟳ Atualizar texto do card</button></div><div class="grid promo-grid"><div class="promo-poster" id="promoPoster"><div class="promo-kicker">Apex Combat League · Los Santos</div><h3>${esc(e?.name||'Próximo combate')}</h3><div class="promo-date">${esc(eventLabel(e))} · ${esc(fmtDate(e?.date,{day:'2-digit',month:'long',year:'numeric'}))} · ${esc(e?.venue||'Los Santos')}</div>${(()=>{const main=e?.fights?.[0];if(!main)return '<div class="promo-main"><small>FIGHT CARD</small><strong>Card em construção</strong><span>Adicione lutas para liberar a chamada principal.</span></div>';const a=byId(main.a),b=byId(main.b);return `<div class="promo-main"><small>${main.title?'TITLE FIGHT':'MAIN EVENT'} · ${esc(divObj(main.division).label)}</small><strong>${esc(a?fullName(a):'Atleta A')} vs. ${esc(b?fullName(b):'Atleta B')}</strong><span>${esc(a?`“${a.nick}” · ${recalculate().records[a.id]?recordText(recalculate().records[a.id]):'—'}`:'')} ${b?` / “${b.nick}” · ${recordText(recalculate().records[b.id])}`:''}</span></div>`})()}<div class="promo-cardlist">${(e?.fights||[]).slice(1,6).map(f=>{const a=byId(f.a),b=byId(f.b);return `<div class="promo-line"><strong>${esc(a?fullName(a):'Atleta')} vs. ${esc(b?fullName(b):'Atleta')}</strong><span>${esc(divObj(f.division).label)}${f.title?' · TÍTULO':''}</span></div>`}).join('')||'<div class="promo-line"><strong>Confrontos a confirmar</strong><span>ACL</span></div>'}</div><div style="position:relative;z-index:1;margin-top:22px"><span class="tag ${e?.type==='numbered'?'lime':'orange'}">${e?titleType(e.type):'APEX COMBAT LEAGUE'}</span></div></div><div class="panel promo-editor"><div class="panel-head"><div><h3>Texto de divulgação</h3><p>Edite o tom, acrescente rumores ou deixe no estilo de chamada esportiva.</p></div></div><div class="field"><label for="promoText">Copy pronta para publicar</label><textarea id="promoText">${esc(promoText||promoContent(e))}</textarea></div><div class="actions" style="margin-top:12px"><button class="btn primary" data-action="copy-promo">▣ Copiar texto</button><button class="btn" data-action="download-promo">↓ Baixar .txt</button><button class="btn" data-action="print-promo">▤ Imprimir card</button></div><div class="notice">Dica de narração: divulgue a luta principal, leia os cartéis e puxe o gancho editorial. Você pode salvar a chamada antes dos resultados e depois atualizar para fazer o pós-luta.</div></div></div>`:`<div class="panel"><div class="empty"><strong>A divulgação começa pelo calendário.</strong><p>Crie um evento e monte as lutas; depois volte aqui para gerar o texto promocional.</p><button class="btn primary" data-action="go-create-event">Criar primeiro evento →</button></div></div>`}`;}
function renderApplications(){if(!isAdmin)return renderPublicApplications();const apps=state.applications||[];return `<div class="page-head"><div><div class="eyebrow">Fighter intake / tryouts</div><h2>Inscrições de atletas</h2><p>Receba fichas de personagem, revise o histórico e aprove quem vai entrar no roster oficial da ACL.</p></div><div class="actions"><span class="tag orange">${apps.filter(a=>a.status==='pending').length} pendentes</span><button class="btn" data-action="new-fighter">Cadastrar diretamente</button></div></div><div class="grid dashboard-grid"><div class="panel"><div class="panel-head"><div><h3>Ficha de inscrição</h3><p>O atleta informa identidade, origem e base de luta.</p></div></div><form id="applicationForm"><div class="form-grid"><div class="field"><label>Nome *</label><input name="first" required maxlength="35" placeholder="Primeiro nome"></div><div class="field"><label>Apelido de luta *</label><input name="nick" required maxlength="35" placeholder="Como será anunciado"></div><div class="field"><label>Sobrenome *</label><input name="last" required maxlength="35"></div><div class="field"><label>Divisão *</label><select name="division" required>${DIVISIONS.map(d=>`<option value="${d.id}">${esc(d.label)} (${esc(d.weight)})</option>`).join('')}</select></div><div class="field full"><label>Origem / cidade / país *</label><input name="origin" required maxlength="90" placeholder="Ex.: Rancho, Los Santos"></div><div class="field full"><label>Academia / equipe</label><input name="gym" maxlength="80" placeholder="Nome da equipe ou academia"></div><div class="field full"><label>Artes marciais praticadas *</label><input name="arts" required maxlength="120" placeholder="Ex.: Boxe, Wrestling, Jiu-jítsu"></div><div class="field full"><label>História do personagem e estilo de luta *</label><textarea name="bio" required minlength="15" maxlength="700" placeholder="Conte de onde veio, como luta, o que quer conquistar e por que merece uma vaga na ACL."></textarea></div></div><div class="actions" style="margin-top:13px"><button type="submit" class="btn primary">Enviar para avaliação</button></div></form><div class="notice"><strong>Inscrições compartilhadas:</strong> as fichas são enviadas ao banco central e ficam visíveis apenas à direção da ACL após login.</div></div><div class="panel"><div class="panel-head"><div><h3>Fila de avaliação</h3><p>Administração das candidaturas recebidas na base compartilhada da ACL</p></div></div>${apps.length?apps.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).map(a=>`<div class="application-card"><div class="application-top"><div><h4>${esc(a.first)} “${esc(a.nick)}” ${esc(a.last)}</h4><div class="small-text muted">${esc(divObj(a.division).label)} · ${esc(a.origin)} · ${esc(a.gym||'Independente')}</div></div><span class="tag ${a.status==='approved'?'lime':a.status==='rejected'?'red':'orange'}">${a.status==='approved'?'APROVADO':a.status==='rejected'?'RECUSADO':'PENDENTE'}</span></div><p>${esc(a.bio)}</p><div class="arts">${(a.arts||[]).map(x=>`<span class="art-chip">${esc(x)}</span>`).join('')}</div><div class="actions" style="margin-top:10px">${a.status==='pending'?`<button class="btn primary small" data-action="approve-application" data-id="${a.id}">✓ Aprovar atleta</button><button class="btn small" data-action="reject-application" data-id="${a.id}">Recusar</button>`:''}<button class="btn danger small" data-action="delete-application" data-id="${a.id}">Excluir ficha</button></div></div>`).join(''):`<div class="empty"><strong>Nenhuma inscrição por enquanto.</strong><p>As novas fichas aparecerão nesta fila para aprovação.</p></div>`}</div></div>`;}
function renderBackup(){return `<div class="page-head"><div><div class="eyebrow">Administration / data integrity</div><h2>Dados & backup</h2><p>Tenha controle do universo da ACL. Exporte toda a base para guardar, transferir para outro navegador ou recuperar depois.</p></div><div class="actions"><span class="tag lime">Salvamento automático</span></div></div><div class="grid dashboard-grid"><div class="panel"><div class="panel-head"><div><h3>Backup completo</h3><p>Elenco, cartéis, eventos, lutas, resultados, inscrições e contadores.</p></div></div><div class="helper">Os dados oficiais ficam na base compartilhada do Supabase. O backup JSON serve para migração e recuperação; guarde uma cópia segura regularmente.</div><div class="actions" style="margin-top:15px"><button class="btn primary" data-action="export-json">↓ Exportar backup JSON</button><button class="btn" data-action="trigger-import">↑ Importar backup JSON</button></div><div class="rule"></div><div class="detail-tile"><span>Elenco</span><strong>${state.fighters.length} atletas</strong></div><div class="detail-tile" style="margin-top:8px"><span>Arquivo de eventos</span><strong>${state.events.length} eventos · ${state.events.reduce((n,e)=>n+e.fights.length,0)} lutas</strong></div><div class="detail-tile" style="margin-top:8px"><span>Inscrições</span><strong>${state.applications.length} fichas</strong></div></div><div class="panel"><div class="panel-head"><div><h3>Ferramentas administrativas</h3><p>Operações para manutenção do universo</p></div></div><div class="list-stack"><div class="belt-row"><div><div class="belt-name">Validar consistência</div><div class="belt-div">Reprocessa rankings e campeões sem apagar dados.</div></div><button class="btn small" data-action="recalculate">Recalcular</button></div><div class="belt-row"><div><div class="belt-name">Adicionar elenco de exemplo</div><div class="belt-div">Só acrescenta os atletas-padrão ausentes; não substitui eventos.</div></div><button class="btn small" data-action="restore-seed">Mesclar roster base</button></div><div class="belt-row"><div><div class="belt-name">Limpar toda a temporada</div><div class="belt-div">Apaga eventos e inscrições, mantendo atletas e rankings-base.</div></div><button class="btn danger small" data-action="clear-season">Limpar eventos</button></div><div class="belt-row"><div><div class="belt-name">Restaurar banco inicial</div><div class="belt-div">Apaga alterações locais e recomeça com elenco padrão.</div></div><button class="btn danger small" data-action="reset-all">Restaurar tudo</button></div></div><div class="notice"><strong>Controle editorial:</strong> você pode editar e excluir eventos, confrontos e resultados. Rankings e cinturões não são gravados como estado fixo: eles são recalculados a partir do histórico, por isso apagar uma edição desfaz a contribuição dela e preserva o impacto das outras.</div></div></div>`;}
function generateStory(a,b,div,title){if(title)return `Cinturão de ${divObj(div).label} em jogo: ${fullName(a)} e ${fullName(b)} chegam com caminhos diferentes, mas só um pode sair com o título.`;const c=recalculate();const pa=c.ranking[div]||[];const ra=pa.findIndex(x=>x.id===a.id)+1,rb=pa.findIndex(x=>x.id===b.id)+1;if(Math.abs(ra-rb)<=1)return `Confronto direto entre atletas próximos no ranking. Uma vitória aqui pode ser o primeiro passo para entrar na conversa pelo top 5.`;return `${fullName(a)} tenta confirmar sua posição na divisão, enquanto ${fullName(b)} busca uma vitória que mude a hierarquia do ranking.`;}
function alreadyFought(a,b){return state.events.some(e=>(e.fights||[]).some(f=>(f.a===a&&f.b===b)||(f.a===b&&f.b===a)));}
function nextEventNumber(type){const field=type==='numbered'?'numbered':'fightnight';const max=state.events.filter(e=>e.type===type).reduce((n,e)=>Math.max(n,+e.number||0),0);state.counters[field]=Math.max(+state.counters[field]||0,max)+1;return state.counters[field];}
function createEventFromForm(form,generate=true){const data=new FormData(form);const name=String(data.get('name')||'').trim();if(!name){toast('Digite um nome para o evento.');return;}const type=data.get('type')==='numbered'?'numbered':'fightnight';const event={id:uid('event'),name,type,number:nextEventNumber(type),date:String(data.get('date')||todayISO()),venue:String(data.get('venue')||'Los Santos').trim(),notes:String(data.get('notes')||'').trim(),fights:[],createdAt:Date.now()};state.events.push(event);state.counters.totalCreated=(+state.counters.totalCreated||0)+1;if(generate){const count=clamp(parseInt(data.get('fightCount')||'6',10)||6,1,12);const titles=type==='numbered'?clamp(parseInt(data.get('titleCount')||'0',10)||0,0,2):0;generateCard(event,count,titles);}selectedEventId=event.id;saveState();render();toast(`${eventLabel(event)} criado: “${name}”.`);}
function generateCard(e,count=6,titleCount=0){if(e.type!=='numbered')titleCount=0;count=clamp(count,1,12);titleCount=Math.min(titleCount,count,2);e.fights=[];const used=new Set();const titleDivs=new Set();for(let i=0;i<titleCount;i++){const pair=pickTitlePair(e,used,titleDivs);if(!pair)break;const f=createFightObject(e,pair.a,pair.b,pair.division,true,'Luta principal',pair.story);e.fights.push(f);used.add(pair.a.id);used.add(pair.b.id);titleDivs.add(pair.division);}while(e.fights.length<count){const pair=pickRegularPair(used);if(!pair)break;const i=e.fights.length;const slot=slotName(i,count);e.fights.push(createFightObject(e,pair.a,pair.b,pair.division,false,slot,pair.story));used.add(pair.a.id);used.add(pair.b.id);}e.fights.forEach((f,i)=>{if(i===0)f.slot=f.title?'Luta principal':slotName(i,e.fights.length);else if(i===1&&!f.title)f.slot='Co-main event';else f.slot=slotName(i,e.fights.length);});}
function pickTitlePair(e,used,excludedDivs=new Set()){const c=recalculate();const divOptions=DIVISIONS.filter(d=>!excludedDivs.has(d.id)).map(d=>{const fs=(c.ranking[d.id]||[]).filter(f=>!used.has(f.id));const champId=c.champions[d.id];const champ=champId?fs.find(f=>f.id===champId):null;const opponents=fs.filter(f=>f.id!==champId);const last=state.events.filter(x=>x.id!==e.id&&(x.fights||[]).some(f=>f.title&&f.division===d.id)).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];return {d,fs,champ,opponents,last,eligible:champ?opponents.length>0:fs.length>=2};}).filter(x=>x.eligible);divOptions.sort((a,b)=>{if(!a.last&&!b.last)return a.d.id.localeCompare(b.d.id);if(!a.last)return -1;if(!b.last)return 1;return (a.last.date||'').localeCompare(b.last.date||'');});for(const opt of divOptions){let a,b;if(opt.champ){a=opt.champ;b=opt.opponents[0];}else{a=opt.fs[0];b=opt.fs[1];}if(!a||!b)continue;return {a,b,division:opt.d.id,story:opt.champ?'O campeão precisa confirmar o reinado diante de um desafiante que pode mudar a hierarquia da divisão.':'Cinturão vago: os dois nomes melhor posicionados disponíveis disputam a primeira palavra na divisão.'};}return null;}
function pickRegularPair(used){const c=recalculate();const allCandidates=[];DIVISIONS.forEach(d=>{let fs=(c.ranking[d.id]||[]).filter(f=>!used.has(f.id));const champ=c.champions[d.id];if(fs.filter(f=>f.id!==champ).length>=2)fs=fs.filter(f=>f.id!==champ);if(fs.length<2)return;const appearances={};state.events.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,3).forEach(e=>(e.fights||[]).forEach(f=>{appearances[f.a]=(appearances[f.a]||0)+1;appearances[f.b]=(appearances[f.b]||0)+1;}));for(let i=0;i<fs.length;i++)for(let j=i+1;j<fs.length;j++){const a=fs[i],b=fs[j];let score=(c.points[a.id]||0)+(c.points[b.id]||0);score-=((appearances[a.id]||0)+(appearances[b.id]||0))*7;if(alreadyFought(a.id,b.id))score-=50;score+=Math.random()*5;allCandidates.push({a,b,division:d.id,score,story:generateStory(a,b,d.id,false)});}});allCandidates.sort((a,b)=>b.score-a.score);return allCandidates[0]||null;}
function createFightObject(e,a,b,division,title=false,slot='',story=''){return {id:uid('fight'),a:a.id,b:b.id,division,title:!!title,rounds:title?5:3,slot:slot||'Card preliminar',story:story||generateStory(a,b,division,title),result:null};}
function addFightsToCount(e,target=6){const used=new Set((e.fights||[]).flatMap(f=>[f.a,f.b]));while(e.fights.length<target){const pair=pickRegularPair(used);if(!pair)break;const i=e.fights.length;e.fights.push(createFightObject(e,pair.a,pair.b,pair.division,false,slotName(i,target),pair.story));used.add(pair.a.id);used.add(pair.b.id);}e.fights.forEach((f,i)=>{if(!f.title)f.slot=slotName(i,e.fights.length);});saveState();render();toast(`Card atualizado: ${e.fights.length} luta(s).`);}
function narrativePick(items){return items[Math.floor(Math.random()*items.length)];}
function fighterArts(f){return Array.isArray(f?.arts)?f.arts.map(x=>String(x).toLowerCase()):[];}
function fighterAttackLine(f,phase){const arts=fighterArts(f);const s=statsFor(f);const lines=[];
 if(arts.some(x=>x.includes('muay thai')))lines.push('trabalhou chutes na perna e no corpo, tentando fechar a sequência com joelhadas quando a distância encurtou','marcou o ritmo com chutes baixos e procurou o clinch para encaixar joelhos curtos');
 if(arts.some(x=>x.includes('boxe')))lines.push('usou o jab para medir a distância e conectou combinações de mãos na cabeça e no tronco','apertou a guarda adversária com diretos e cruzados, saindo do eixo depois das combinações');
 if(arts.some(x=>x.includes('kickboxing')))lines.push('misturou combinações de mãos com chutes na linha de cintura, sem ficar parado depois de atacar','alternou golpes retos e chutes para impedir que o rival encontrasse um ritmo confortável');
 if(arts.some(x=>x.includes('karate')||x.includes('taekwondo')))lines.push('usou o jogo de pernas e ataques lineares para surpreender na entrada e sair do raio de resposta','trabalhou fintas e golpes rápidos de fora, procurando pegar o adversário no avanço');
 if(arts.some(x=>x.includes('wrestling')))lines.push('mudou de nível e atacou as pernas, tentando completar a queda e manter o controle junto à grade','pressionou com entradas de queda em cadeia e tentou transformar a grade em uma terceira mão');
 if(arts.some(x=>x.includes('sambo')))lines.push('alternou a pressão em pé com entradas de queda e controle de tronco, procurando uma transição favorável no solo','misturou desequilíbrios, quedas e pressão por cima para obrigar o rival a defender mais de uma ameaça');
 if(arts.some(x=>x.includes('judô')))lines.push('procurou o clinch, desequilibrou o rival e ameaçou uma projeção para cair por cima','usou pegadas e mudanças de direção para quebrar a postura do adversário e buscar a queda');
 if(arts.some(x=>x.includes('jiu-jítsu')))lines.push('forçou a aproximação, ameaçou levar a disputa ao solo e procurou avançar posição para abrir uma finalização','trabalhou por dentro no clinch e, quando encontrou espaço, tentou controlar quadril e braços para construir uma ameaça de finalização');
 if(arts.some(x=>x.includes('luta livre')))lines.push('explorou mudanças de nível e pressão na grade para levar a disputa ao chão, buscando permanecer por cima','alternou pressão frontal e entradas nas pernas, tentando transformar cada contato em uma queda');
 if(!lines.length)lines.push('misturou movimentação lateral, golpes retos e entradas rápidas, buscando pontuar sem se expor','tentou variar o tempo dos ataques para encontrar uma abertura na guarda adversária');
 let line=narrativePick(lines);if(phase==='late'&&s.cardio<70)line+='; o esforço, porém, já começou a cobrar seu preço e a sequência saiu com menos velocidade';else if(phase==='late'&&s.cardio>=82)line+=' e ainda conseguiu manter um ritmo alto apesar do desgaste';return line+'.';}
function fighterDefenseLine(f,opponent,phase){const s=statsFor(f),o=statsFor(opponent);const choices=[];
 if(fighterArts(f).some(x=>x.includes('wrestling')||x.includes('sambo')||x.includes('luta livre')))choices.push('respondeu com pressão de clinch e tentou neutralizar a sequência encostando o rival na grade','defendeu a primeira entrada, reposicionou os pés e ameaçou devolver a queda');
 if(fighterArts(f).some(x=>x.includes('jiu-jítsu')||x.includes('judô')))choices.push('buscou amarrar a troca e transformar a aproximação em disputa de pegadas e posição','tentou aproveitar o contato para inverter a posição e ameaçar uma transição no solo');

function finishDescription(method,winner,loser){const arts=fighterArts(winner);if(/Finalização/i.test(method)){let hold;if(arts.some(x=>x.includes('jiu-jítsu')))hold=narrativePick(['um estrangulamento pelas costas','uma guilhotina encaixada durante a tentativa de queda','uma chave de braço construída após avançar a posição','um triângulo fechado quando o adversário tentou se levantar']);else if(arts.some(x=>x.includes('sambo')||x.includes('judô')))hold=narrativePick(['uma chave de braço após controlar a queda','um estrangulamento aproveitando a transição no solo','uma chave de perna encaixada durante a scramble']);else hold=narrativePick(['um estrangulamento encaixado na transição','uma chave de braço construída a partir do controle por cima','uma guilhotina quando o adversário tentou entrar nas pernas']);return `${nameWithNick(winner)} aproveitou a reação de ${nameWithNick(loser)} para ajustar ${hold}. A defesa foi ficando cada vez mais difícil, até que ${nameWithNick(loser)} sinalizou a desistência; o árbitro entrou imediatamente e confirmou a vitória por finalização.`;}

function simulateFight(f){const a=byId(f.a),b=byId(f.b);if(!a||!b)return null;const sa=statsFor(a),sb=statsFor(b);const scoreA=sa.striking*.23+sa.grappling*.19+sa.cardio*.14+sa.chin*.10+sa.technique*.20+sa.power*.14;const scoreB=sb.striking*.23+sb.grappling*.19+sb.cardio*.14+sb.chin*.10+sb.technique*.20+sb.power*.14;const pA=clamp(1/(1+Math.exp((scoreB-scoreA)/12)),.22,.78);const roll=Math.random();let result;if(roll<.035)result={winnerId:null,method:'Empate majoritário',round:f.rounds,note:'Os juízes não encontraram separação suficiente; a divisão segue sem uma resposta definitiva.'};else{const winner=roll<.035+(1-.035)*pA?a.id:b.id;const winF=byId(winner);const sw=statsFor(winF);const opp=byId(winner===a.id?b.id:a.id);const so=statsFor(opp);let finishChance=.30+((sw.power+sw.striking+sw.grappling)-(so.chin+so.grappling))/220;finishChance=clamp(finishChance,.18,.52);if(f.title)finishChance*=.92;const finish=Math.random()<finishChance;let method,round;if(finish){const subWeight=clamp((sw.grappling+sw.technique)/(sw.striking+sw.power+sw.grappling+sw.technique),.2,.7);const x=Math.random();method=x<subWeight?'Finalização':(x<subWeight+.48?'KO':'TKO');round=1+Math.floor(Math.pow(Math.random(),.68)*f.rounds);}else{method=Math.random()<.20?'Decisão dividida':'Decisão unânime';round=f.rounds;}const note=finish?(method==='Finalização'?'A sequência no chão abriu espaço para a finalização.':`Um ataque limpo mudou o rumo da luta e encerrou o combate por ${method.toLowerCase()}.`):(method==='Decisão dividida'?'Os juízes divergiram em uma luta de margens curtas.':'O vencedor controlou momentos decisivos e levou a melhor na pontuação.');result={winnerId:winner,method,round,note};}result.report=generateFightReport(eventForFight(f),f,result);return result;}
